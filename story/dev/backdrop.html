<!doctype html><html><head><meta charset="utf-8"><title>Backdrop dev</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#bg{position:fixed;inset:0;width:100%;height:100%}
#board{position:fixed;left:50%;top:50%;width:300px;height:600px;transform:translate(-50%,-50%);background:rgba(10,10,20,.82);border:2px solid #fff3;border-radius:6px}</style></head><body>
<canvas id="bg"></canvas><div id="board"></div>
<script type="module">
// Dev harness for Tetris backdrops: story/dev/backdrop.html?level=ferrari
// window.run({ seconds, from, events:[[t, kind, data]] }) steps the backdrop
// at 60 fps from song time `from` and returns a screenshot of the page.
import { createBackdrop } from '../backdrop.js';
const q = new URLSearchParams(location.search);
try {
  const bd = await createBackdrop(q.get('level') || 'taco', { canvas: document.getElementById('bg'), low: q.get('low') === '1' });
  window.bd = bd;
  window.run = async ({ seconds = 2, from = 20, events = [] } = {}) => {
    const ev = events.slice().sort((a, b) => a[0] - b[0]);
    let t = 0; const dt = 1 / 60, times = [];
    while (t < seconds) {
      while (ev.length && ev[0][0] <= t) { const e = ev.shift(); bd.react(e[1], e[2] || {}); }
      const t0 = performance.now(); bd.update(dt, { songTime: from + t }); times.push(performance.now() - t0);
      t += dt;
    }
    times.sort((a, b) => a - b);
    return { failed: bd.failed, msMedian: +times[times.length >> 1].toFixed(2), msP95: +times[Math.floor(times.length * 0.95)].toFixed(2) };
  };
  window.ready = true;
} catch (e) { window.__err = String(e && e.stack || e); console.error(e); }
</script></body></html>
