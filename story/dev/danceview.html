<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance View</title>
<style>
:root { --bg: #120c1c; --panel: #1d1530; --ink: #efe8ff; --dim: #9a8cb8; --acc: #4de8ff; --warn: #ff4d6d; --gold: #ffc93a; --ok: #6bff9e; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, sans-serif; }
#app { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: 1fr 150px; height: 100vh; }
#side { grid-row: 1 / 3; background: var(--panel); overflow-y: auto; padding: 12px; border-right: 1px solid #2c2246; }
#stage { position: relative; min-height: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
#time { background: #0d0916; border-top: 1px solid #2c2246; position: relative; }
#time canvas { width: 100%; height: 100%; display: block; }
h1 { font-size: 16px; letter-spacing: 3px; margin: 0 0 10px; color: var(--gold); }
h2 { font-size: 11px; letter-spacing: 2px; color: var(--dim); margin: 14px 0 6px; text-transform: uppercase; }
select, button, input[type=range] { width: 100%; }
select, button { background: #2a2043; color: var(--ink); border: 1px solid #3c2f60; border-radius: 6px; padding: 6px 8px; font: inherit; cursor: pointer; }
button.on { background: #3d2d6b; border-color: var(--acc); color: #fff; }
.row { display: flex; gap: 6px; margin: 4px 0; } .row > * { flex: 1; }
.chk { display: flex; align-items: center; gap: 6px; margin: 3px 0; color: var(--dim); } .chk input { width: auto; }
#moves { max-height: 260px; overflow-y: auto; border: 1px solid #2c2246; border-radius: 6px; }
#moves div { padding: 4px 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; border-bottom: 1px solid #241b3a; }
#moves div:hover { background: #2a2043; } #moves div.sel { background: #3d2d6b; }
.tag { font-size: 10px; padding: 0 5px; border-radius: 4px; background: #33285a; color: var(--dim); white-space: nowrap; }
.tag.sp { background: #5a1f33; color: #ffb3c2; } .tag.row { background: #1f3f5a; color: #b3ecff; }
#chain { min-height: 28px; padding: 4px; border: 1px dashed #3c2f60; border-radius: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
#chain span { background: #33285a; border-radius: 4px; padding: 1px 6px; font-size: 11px; cursor: pointer; }
#hud { position: absolute; left: 12px; top: 10px; font: 600 13px/1.5 ui-monospace, monospace; text-shadow: 0 1px 3px #000; pointer-events: none; }
#hud .big { font-size: 22px; color: var(--gold); letter-spacing: 1px; }
#hud .st { color: var(--acc); }
#warn { position: absolute; right: 12px; top: 10px; text-align: right; font: 600 12px/1.6 ui-monospace, monospace; pointer-events: none; }
#warn div { color: var(--warn); } #warn .ok { color: var(--ok); }
#beatbox { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: none; }
#beatbox i { width: 18px; height: 18px; border-radius: 50%; background: #2a2043; border: 2px solid #3c2f60; }
#beatbox i.on { background: var(--gold); border-color: #fff; } #beatbox i.d.on { background: #ff6ad5; }
small { color: var(--dim); }
@media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: 55vh 120px auto; } #side { grid-row: 3; } }
</style></head><body>
<div id="app">
  <div id="side">
    <h1>DANCE VIEW</h1>
    <small>Every move and dance string on the beat grid — scrub, slow down, change cameras, inspect feet and transitions.</small>
    <h2>Dancer</h2>
    <select id="char"></select>
    <h2>Mode</h2>
    <div class="row"><button data-mode="string" class="on">STRING</button><button data-mode="move">MOVE</button><button data-mode="chain">CHAIN</button></div>
    <div class="row"><button data-mode="miss">MISS</button><button data-mode="solo">SOLO</button><button data-mode="groove">GROOVE</button></div>
    <div class="row" id="lineRow"><button data-line="std" class="on">STD LINE</button><button data-line="alt">★ LINE</button></div>
    <h2>Moves <small id="mcount"></small></h2>
    <label class="chk"><input type="checkbox" id="allMoves"> show every move in the library</label>
    <div id="moves"></div>
    <h2>Chain <small>(click moves in CHAIN mode · click to remove)</small></h2>
    <div id="chain"></div>
    <h2>Tempo</h2>
    <div class="row"><input type="range" id="bpm" min="60" max="180" value="120"><span id="bpmv" style="flex:0 0 52px;text-align:right">120</span></div>
    <div class="row"><button data-speed="0.1">0.1×</button><button data-speed="0.25">¼×</button><button data-speed="0.5">½×</button><button data-speed="1" class="on">1×</button></div>
    <div class="row"><button id="play">❚❚ PAUSE</button><button id="back">◀ 1/16</button><button id="fwd">1/16 ▶</button></div>
    <input type="range" id="scrub" min="0" max="64" step="0.0625" value="0">
    <h2>Camera</h2>
    <div class="row"><button data-cam="front" class="on">FRONT</button><button data-cam="three">¾</button><button data-cam="side">SIDE</button></div>
    <div class="row"><button data-cam="top">TOP</button><button data-cam="low">LOW</button><button data-cam="orbit">ORBIT</button></div>
    <h2>Overlays</h2>
    <label class="chk"><input type="checkbox" id="skel" checked> skeleton</label>
    <label class="chk"><input type="checkbox" id="feet" checked> foot contacts + trails</label>
    <label class="chk"><input type="checkbox" id="hits" checked> drum hits (kick 1·3, snare 2·4)</label>
    <label class="chk"><input type="checkbox" id="click"> metronome click</label>
    <label class="chk"><input type="checkbox" id="mirror"> mirror</label>
  </div>
  <div id="stage"><div id="hud"></div><div id="warn"></div><div id="beatbox"><i class="d"></i><i></i><i></i><i></i></div></div>
  <div id="time"><canvas id="tl"></canvas></div>
</div>
<script type="module">
import * as THREE from '../../vendor/three/three.module.min.js';
import { createCharacter, CHARACTERS } from '../characters.js';
import { DanceController, MOVES, MOVE_LABELS, LAYOUT, moveProfile } from '../dance.js';
import { Choreographer } from '../choreo.js';
import { LEVEL_ORDER, STORY_LEVELS, loadLevel } from '../levels.js';
import { musicalPosition } from '../music-clock.js';
import { MotionMonitor, describe } from '../dance-metrics.js';

const { ROOT, FEET, FS, ANK } = LAYOUT;
const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const TAU = Math.PI * 2;

// ── Characters: the hand-built three + every level boss ─────────────
const charIds = ['player', 'toni', 'tina'];
const bossLevel = {};
await Promise.all(LEVEL_ORDER.map(async (id) => {
  try { await loadLevel(id); const b = STORY_LEVELS[id].dancers.rival; bossLevel[b] = id; if (!charIds.includes(b)) charIds.push(b); } catch (e) { console.warn('level', id, e); }
}));
for (const id of charIds) {
  const o = document.createElement('option'); o.value = id;
  o.textContent = `${CHARACTERS[id].name}${bossLevel[id] ? ' — ' + STORY_LEVELS[bossLevel[id]].title : id === 'player' ? ' (you)' : ''}`;
  $('char').append(o);
}

// ── Scene ───────────────────────────────────────────────────────────
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x231a38);
scene.add(new THREE.HemisphereLight(0xffeedd, 0x3a2a60, 1.25));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(2.5, 5, 4); scene.add(key);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({ color: 0x3b2c5c, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const grid = new THREE.GridHelper(14, 56, 0x7a68b0, 0x4a3d72); grid.position.y = 0.002; scene.add(grid);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100);

// Skeleton overlay.
const BONES = [['hips', 'spine'], ['spine', 'chest'], ['chest', 'neck'], ['neck', 'head'],
  ['chest', 'shL'], ['shL', 'armL'], ['armL', 'foreL'], ['foreL', 'handL'], ['chest', 'shR'], ['shR', 'armR'], ['armR', 'foreR'], ['foreR', 'handR'],
  ['hips', 'thighL'], ['thighL', 'shinL'], ['shinL', 'footL'], ['hips', 'thighR'], ['thighR', 'shinR'], ['shinR', 'footR']];
const skelGeo = new THREE.BufferGeometry();
skelGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(BONES.length * 6), 3));
const skel = new THREE.LineSegments(skelGeo, new THREE.LineBasicMaterial({ color: 0x4de8ff, depthTest: false, transparent: true, opacity: 0.9 }));
skel.renderOrder = 10; skel.frustumCulled = false; scene.add(skel);
// Foot contact discs + trails.
const footMk = ['L', 'R'].map((s) => {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.06, 0.1, 24), new THREE.MeshBasicMaterial({ color: 0x6bff9e, side: THREE.DoubleSide, depthTest: false, transparent: true }));
  m.rotation.x = -Math.PI / 2; m.renderOrder = 11; scene.add(m); return m;
});
const TRAIL = 90;
const trailGeo = ['L', 'R'].map(() => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL * 3), 3)); g.setDrawRange(0, 0); return g; });
const trails = trailGeo.map((g, i) => { const l = new THREE.Points(g, new THREE.PointsMaterial({ color: i ? 0xff6ad5 : 0x4de8ff, size: 0.035, depthTest: false })); l.renderOrder = 9; l.frustumCulled = false; scene.add(l); return l; });

// ── State ───────────────────────────────────────────────────────────
const S = {
  char: q.get('char') || 'player', mode: q.get('mode') || 'string', line: 'std', move: q.get('move') || null, chain: [],
  bpm: +(q.get('bpm') || 120), speed: 1, playing: q.get('paused') !== '1', beat: 0, cam: q.get('cam') || 'front',
  loopBeats: 64, plan: [], labels: [], contacts: [], stateLog: [], warnings: new Map(), lastPose: null,
};
let rig = null, dc = null, choreo = null;
const monitor = new MotionMonitor();
const fakeAcc = { kick: 0, snare: 0, energy: 1 };

function accAt(beat) {
  if (!$('hits').checked) return null;
  const spb = 60 / S.bpm, ph = beat - Math.floor(beat), even = (Math.floor(beat) & 1) === 0;
  fakeAcc.kick = even ? Math.exp(-ph * spb / 0.075) : 0;
  fakeAcc.snare = even ? 0 : Math.exp(-ph * spb / 0.09);
  return fakeAcc;
}

function setChar(id) {
  if (rig) { scene.remove(rig.root); rig.dispose(); }
  S.char = id; $('char').value = id;
  const def = CHARACTERS[id];
  rig = createCharacter(def); rig.baseYaw = 0; scene.add(rig.root);
  choreo = new Choreographer(def);
  rebuild();
  listMoves();
}

// The moves this dancer uses (plan rows, finisher, freeze, solo, routines).
function charMoves() {
  const def = CHARACTERS[S.char], P = choreo.plan, out = [];
  const add = (n, tag) => { if (n && MOVES[n] && !out.some(o => o.n === n)) out.push({ n, tag }); };
  P.std.forEach((n, i) => add(n, `row ${i + 1}`));
  P.alt.forEach((n, i) => add(n, `★ ${i + 1}`));
  add(P.finisher.std, 'finish'); add(P.finisher.alt, '★ finish'); add(P.freeze, 'freeze');
  P.solo.forEach((n) => add(n, 'solo')); add(P.victory, 'victory'); add(P.stumble, 'miss'); add(P.recover, 'recover');
  const r = def.style.routines; const rs = !r ? [] : Array.isArray(r) ? r : [...(r.chill || []), ...(r.hype || [])];
  rs.forEach((n) => add(n, 'groove'));
  if (def.taunt) add(def.taunt, 'jammer');
  return out;
}
function listMoves() {
  const box = $('moves'); box.innerHTML = '';
  let list = charMoves();
  if ($('allMoves').checked) for (const n of Object.keys(MOVES).sort()) if (!list.some(o => o.n === n)) list.push({ n, tag: '' });
  $('mcount').textContent = `(${list.length})`;
  for (const { n, tag } of list) {
    const p = moveProfile(n, CHARACTERS[S.char].style);
    const d = document.createElement('div'); if (n === S.move) d.className = 'sel';
    const flags = [p.flip && 'FLIP', p.air && 'AIR', p.spin && p.turns.toFixed(1) + '↻'].filter(Boolean).join(' ');
    d.innerHTML = `<span>${MOVE_LABELS[n] || n}</span><span>${tag ? `<span class="tag row">${tag}</span>` : ''}${flags ? ` <span class="tag sp">${flags}</span>` : ''}</span>`;
    d.title = n;
    d.onclick = () => {
      if (S.mode === 'chain') { S.chain.push(n); drawChain(); rebuild(); return; }
      S.move = n; setMode('move');
    };
    box.append(d);
  }
}
function drawChain() {
  const c = $('chain'); c.innerHTML = '';
  S.chain.forEach((n, i) => { const s = document.createElement('span'); s.textContent = MOVE_LABELS[n] || n; s.onclick = () => { S.chain.splice(i, 1); drawChain(); rebuild(); }; c.append(s); });
}

// ── Plans: what plays when (beats), built with the real Choreographer ──
// A simulated battle: bar 0 grooves, then one landed command per bar,
// exactly as RhythmBattle reports them (row, line, freeze, rest bar).
function buildPlan() {
  const plan = [], labels = [];
  const c = new Choreographer(CHARACTERS[S.char]);
  const alt = S.line === 'alt', mirror = $('mirror').checked;
  const push = (entries, label, bar) => { for (const e of entries) plan.push({ ...e, mirror: !!e.mirror !== mirror }); labels.push({ bar, label }); };
  if (S.mode === 'move' && S.move) {
    for (let bar = 1; bar < 16; bar++) push([{ name: S.move, start: bar * 4, len: 4, state: 'DANCE_MOVE', level: 3 }], MOVE_LABELS[S.move] || S.move, bar);
  } else if (S.mode === 'chain') {
    S.chain.forEach((n, i) => push([{ name: n, start: (i + 1) * 4, len: 4, state: 'DANCE_MOVE', level: Math.min(4, 1 + i) }], MOVE_LABELS[n] || n, i + 1));
  } else if (S.mode === 'string' || S.mode === 'miss') {
    let row = 0, string = 0, tier = 1, bar = 1;
    while (bar < 15) {
      if (S.mode === 'miss' && bar === 5) {
        // The command for bar 5 is missed at beat 4 of bar 4.
        const miss = c.miss({ bar: bar - 1 }, (bar - 1) * 4 + 3.25);
        push(miss, 'MISS → RECOVERY', bar); row = 0; tier = Math.max(1, tier - 1); bar++; continue;
      }
      const freeze = row >= 7;
      const e = { bar, tier, kind: alt ? 'branch' : 'std', row, string, freeze };
      const entries = c.success(e);
      push(entries, freeze ? 'FINISH → FREEZE' : `${row + 1}/8 ${MOVE_LABELS[entries[0].name] || entries[0].name}`, bar);
      tier = Math.min(4, tier + 1);
      if (freeze) { labels.push({ bar: bar + 1, label: 'REST (freeze held)' }); row = 0; string++; bar += 2; }
      else { row++; bar++; }
    }
  } else if (S.mode === 'solo') {
    push([{ name: 'kneeBounce', start: 4, len: 4, state: 'DANCE_MOVE', level: 3 }], '1/8 warm-up', 1);
    push(c.solo({ bar: 2, bars: 2 }), '★★ SOLO', 2);
    labels.push({ bar: 3, label: 'SOLO · finish → freeze' });
  }
  return { plan, labels };
}

function rebuild() {
  const { plan, labels } = buildPlan();
  S.plan = plan; S.labels = labels;
  S.loopBeats = Math.max(16, Math.ceil((Math.max(0, ...plan.map(e => e.start + e.len)) + 6) / 4) * 4);
  $('scrub').max = S.loopBeats;
  seek(S.playing ? 0 : Math.min(S.beat, S.loopBeats));
}

// Restart the controller at `beat`: queue the plan and run the springs in
// from a little before, so a paused frame is the real one.
function seek(beat) {
  const def = CHARACTERS[S.char];
  dc = new DanceController(rig, { ...def.style, spb: 60 / S.bpm }, +1);
  for (const e of S.plan) dc.play(e.name, e.start, e.len, { state: e.state, fade: e.fade, lead: e.lead, out: e.out, level: e.level, mirror: e.mirror });
  if (S.mode === 'groove') dc.level = 3;
  S.stateLog = []; S.warnings.clear(); trailN = [0, 0];
  monitor.spb = 60 / S.bpm; monitor.allSlide = !!def.style.slides; monitor.reset(); S.contacts = monitor.contacts;
  const step = 1 / 60 / (60 / S.bpm);
  const from = Math.max(-1, beat - 3);
  for (let b = from; b < beat - step * 0.5; b += step) tick(b, true);
  S.beat = beat; tick(beat, true);
}

// ── Per-frame analysis ──────────────────────────────────────────────
const _v = new THREE.Vector3();
const jw = (n) => rig.joints[n].getWorldPosition(new THREE.Vector3());
let trailN = [0, 0];
function tick(beat, quiet = false) {
  const st = dc.update(beat, accAt(beat));
  const o = dc.out, spb = 60 / S.bpm;
  rig.root.updateMatrixWorld(true);
  const warn = (k, msg) => S.warnings.set(k, { msg, at: beat });
  for (const e of monitor.feed(beat, o, dc.state, dc.cur.name)) warn(e.kind + (e.side || ''), describe(e));
  S.contacts = monitor.contacts;
  const last = S.stateLog[S.stateLog.length - 1];
  if (!last || last.state !== dc.state) {
    S.stateLog.push({ beat, state: dc.state, move: dc.cur.name });
    if (S.stateLog.length > 64) S.stateLog.shift();
  }
  // Hands through the floor.
  for (const h of ['handL', 'handR']) if (jw(h).y < 0.0) warn('hand' + h, `${h} below the floor in ${dc.cur.name}`);
  if (!quiet) updateOverlays();
  return st;
}

function updateOverlays() {
  const pos = skelGeo.attributes.position.array;
  BONES.forEach(([a, b], i) => { const A = jw(a), B = jw(b); pos.set([A.x, A.y, A.z, B.x, B.y, B.z], i * 6); });
  skelGeo.attributes.position.needsUpdate = true;
  skel.visible = $('skel').checked;
  const o = dc.out, show = $('feet').checked;
  ['footL', 'footR'].forEach((n, i) => {
    const p = jw(n), planted = o[FEET + i * FS + 1] < ANK + 0.012;
    footMk[i].position.set(p.x, 0.004, p.z);
    footMk[i].material.color.set(planted ? 0x6bff9e : 0x6a5a90);
    footMk[i].visible = show; trails[i].visible = show;
    if (planted) {
      const arr = trailGeo[i].attributes.position.array, k = trailN[i] % TRAIL;
      arr[k * 3] = p.x; arr[k * 3 + 1] = 0.006; arr[k * 3 + 2] = p.z;
      trailN[i]++; trailGeo[i].setDrawRange(0, Math.min(TRAIL, trailN[i])); trailGeo[i].attributes.position.needsUpdate = true;
    }
  });
}

// ── Camera ──────────────────────────────────────────────────────────
function placeCamera(t) {
  const hip = rig ? jw('hips') : new THREE.Vector3(0, 1, 0);
  const look = new THREE.Vector3(hip.x * 0.5, 0.95, hip.z * 0.5);
  const C = { front: [0, 1.3, 4.6], three: [2.6, 1.45, 3.6], side: [4.6, 1.25, 0], top: [0.01, 6, 0.8], low: [0.4, 0.35, 3.2] }[S.cam];
  if (S.cam === 'orbit') { const a = t * 0.35; camera.position.set(Math.sin(a) * 5, 1.5, Math.cos(a) * 5); }
  else camera.position.set(...C);
  camera.lookAt(look);
}

// ── HUD + timeline ──────────────────────────────────────────────────
function hud() {
  const mp = musicalPosition(S.beat);
  const lab = [...S.labels].reverse().find(l => l.bar <= mp.bar);
  $('hud').innerHTML =
    `<div class="big">${MOVE_LABELS[dc.cur.name] || dc.cur.name}</div>` +
    `<div class="st">${dc.state}</div>` +
    `<div>${lab ? lab.label : 'IDLE GROOVE'}</div>` +
    `<div>${S.bpm} BPM · bar ${mp.bar} · count ${mp.count}${mp.eighth ? '&' : ''} · 8-count ${mp.countIn8}/8 · phrase ${mp.phrase}.${mp.barInPhrase + 1}</div>` +
    `<div>level ${dc.style.level || 1} · speed ${S.speed}× · beat ${S.beat.toFixed(3)}</div>`;
  const now = S.beat, ws = [...S.warnings.values()].filter(w => now - w.at < 2 && now >= w.at - 0.01);
  $('warn').innerHTML = ws.length ? ws.map(w => `<div>⚠ ${w.msg}</div>`).join('') : '<div class="ok">✓ no flips · no skating · no pops</div>';
  [...$('beatbox').children].forEach((el, i) => el.classList.toggle('on', i === Math.floor(mp.beatInBar)));
}

const STATE_COLOR = {
  INTRO_TAUNT: '#b35cff', IDLE_GROOVE: '#3b4f7a', MOVE_PREPARATION: '#8a7cff', DANCE_MOVE: '#2fbf8f', MOVE_TRANSITION: '#5c6b9a',
  COMBO_ADVANCE: '#4de8ff', ADVANCED_COMBO: '#ffb03a', FREEZE_POSE: '#ffe14d', SOLO_SEQUENCE: '#ff6ad5', JAMMER_ATTACK: '#c04dff',
  JAMMER_DODGE: '#ff8a4d', MISSED_INPUT: '#ff4d6d', RECOVERY: '#d98aa0', VICTORY_DANCE: '#fff',
};
function timeline() {
  const cv = $('tl'), r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  const g = cv.getContext('2d'), W = cv.width, H = cv.height;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.scale(dpr, dpr);
  const w = W / dpr, h = H / dpr, span = 8, b0 = S.beat - span * 0.75, x = (b) => (b - b0) / span * w;
  // State ribbon.
  for (let i = 0; i < S.stateLog.length; i++) {
    const s = S.stateLog[i], e = S.stateLog[i + 1] ? S.stateLog[i + 1].beat : S.beat;
    g.fillStyle = STATE_COLOR[s.state] || '#666'; g.fillRect(x(s.beat), 8, Math.max(1, x(e) - x(s.beat)), 16);
    if (x(e) - x(s.beat) > 70) { g.fillStyle = '#000'; g.font = '10px monospace'; g.fillText(s.state, x(s.beat) + 3, 20); }
  }
  // Beat grid.
  for (let b = Math.ceil(b0 * 2) / 2; b < b0 + span; b += 0.5) {
    const down = Number.isInteger(b) && b % 4 === 0, whole = Number.isInteger(b);
    g.strokeStyle = down ? '#ffc93a' : whole ? '#7a68b0' : '#3c2f60'; g.lineWidth = down ? 2 : 1;
    g.beginPath(); g.moveTo(x(b), 30); g.lineTo(x(b), h - 6); g.stroke();
    if (whole) { g.fillStyle = down ? '#ffc93a' : '#9a8cb8'; g.font = '10px monospace'; g.fillText(String(((b % 4) + 4) % 4 + 1), x(b) + 2, 42); }
  }
  // Foot contacts vs the nearest 8th: offset in ms.
  const spb = 60 / S.bpm; let sum = 0, n = 0;
  for (const c of S.contacts) {
    if (c.beat < b0) continue;
    const near = Math.round(c.beat * 2) / 2, ms = (c.beat - near) * spb * 1000;
    sum += Math.abs(ms); n++;
    const R = c.side === 'R', y = R ? 98 : 70;
    g.fillStyle = R ? '#ff6ad5' : '#4de8ff';
    g.beginPath(); g.arc(x(c.beat), y, 5, 0, TAU); g.fill();
    g.fillStyle = Math.abs(ms) > 45 ? '#ff4d6d' : '#9a8cb8'; g.font = '10px monospace';
    g.fillText(`${ms >= 0 ? '+' : ''}${ms.toFixed(0)}ms`, x(c.beat) + 7, y + 4);
  }
  g.fillStyle = '#9a8cb8'; g.font = '11px monospace';
  g.fillText('L foot', 4, 74); g.fillText('R foot', 4, 102);
  g.fillText(n ? `foot contacts vs 8th-note grid: mean |offset| ${(sum / n).toFixed(0)} ms (${n})` : 'foot contacts vs grid: —', 4, h - 10);
  // Playhead.
  g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.moveTo(x(S.beat), 0); g.lineTo(x(S.beat), h); g.stroke();
}

// ── Loop ────────────────────────────────────────────────────────────
let last = performance.now(), audio = null, lastWhole = null;
function clickAt(down) {
  if (!$('click').checked) return;
  audio = audio || new AudioContext();
  const o = audio.createOscillator(), gn = audio.createGain();
  o.frequency.value = down ? 1500 : 1000; gn.gain.setValueAtTime(0.25, audio.currentTime); gn.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.05);
  o.connect(gn).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.06);
}
function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.playing) {
    const db = dt * S.bpm / 60 * S.speed;
    // Sub-step so slow motion and fast tempos keep the springs honest.
    const n = Math.max(1, Math.ceil(db / (1 / 60 / (60 / S.bpm))));
    for (let i = 1; i <= n; i++) tick(S.beat + db * i / n, i < n);
    S.beat += db;
    if (Math.floor(S.beat) !== lastWhole) { lastWhole = Math.floor(S.beat); clickAt(lastWhole % 4 === 0); }
    if (S.beat >= S.loopBeats) seek(0);
    $('scrub').value = S.beat;
  }
  placeCamera(now / 1000);
  hud(); timeline();
  renderer.render(scene, camera);
}

// ── UI ──────────────────────────────────────────────────────────────
function setMode(m) {
  S.mode = m;
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  listMoves(); rebuild();
}
$('char').onchange = (e) => setChar(e.target.value);
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('[data-line]').forEach(b => b.onclick = () => { S.line = b.dataset.line; document.querySelectorAll('[data-line]').forEach(x => x.classList.toggle('on', x === b)); rebuild(); });
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => { S.speed = +b.dataset.speed; document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', x === b)); });
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => { S.cam = b.dataset.cam; document.querySelectorAll('[data-cam]').forEach(x => x.classList.toggle('on', x === b)); });
$('bpm').oninput = (e) => { S.bpm = +e.target.value; $('bpmv').textContent = S.bpm; seek(S.beat); };
$('play').onclick = () => { S.playing = !S.playing; $('play').textContent = S.playing ? '❚❚ PAUSE' : '▶ PLAY'; };
const nudge = (d) => { S.playing = false; $('play').textContent = '▶ PLAY'; seek(Math.max(0, S.beat + d)); };
$('back').onclick = () => nudge(-1 / 16); $('fwd').onclick = () => nudge(1 / 16);
$('scrub').oninput = (e) => { S.playing = false; $('play').textContent = '▶ PLAY'; seek(+e.target.value); };
$('allMoves').onchange = listMoves;
$('mirror').onchange = rebuild;
addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  if (e.key === 'ArrowLeft') nudge(-1 / 16); if (e.key === 'ArrowRight') nudge(1 / 16);
});

$('bpm').value = S.bpm; $('bpmv').textContent = S.bpm;
document.querySelectorAll('[data-cam]').forEach(x => x.classList.toggle('on', x.dataset.cam === S.cam));
setChar(charIds.includes(S.char) ? S.char : 'player');
setMode(S.mode);
resize();
requestAnimationFrame(frame);

// ── Automation API (tests / screenshots) ────────────────────────────
// dv.set({ char, mode, line, move, bpm, cam, mirror }) · dv.seek(beat) ·
// dv.shot() → JPEG · dv.info() → state, warnings, contacts, plan.
window.dv = {
  set(o = {}) {
    if (o.char && o.char !== S.char) setChar(o.char);
    if (o.line) S.line = o.line;
    if (o.move) S.move = o.move;
    if (o.bpm) { S.bpm = o.bpm; $('bpm').value = o.bpm; $('bpmv').textContent = o.bpm; }
    if (o.cam) S.cam = o.cam;
    if (o.mirror != null) $('mirror').checked = !!o.mirror;
    if (o.skel != null) $('skel').checked = !!o.skel;
    if (o.feet != null) $('feet').checked = !!o.feet;
    S.playing = false; $('play').textContent = '▶ PLAY';
    setMode(o.mode || S.mode);
  },
  seek(b) { seek(b); updateOverlays(); placeCamera(0); hud(); timeline(); renderer.render(scene, camera); },
  shot(q = 0.8) { return renderer.domElement.toDataURL('image/jpeg', q); },
  info() {
    const y = (n) => +jw(n).y.toFixed(3);
    return { char: S.char, mode: S.mode, beat: S.beat, state: dc.state, move: dc.cur.name, warnings: [...S.warnings.values()], contacts: S.contacts, plan: S.plan, labels: S.labels, choreo: choreo.plan,
      heights: { handL: y('handL'), handR: y('handR'), footL: y('footL'), footR: y('footR'), head: y('head'), hips: y('hips') } };
  },
  chars: charIds,
};
window.ready = true;
</script>
</body></html>
