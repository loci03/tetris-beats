name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't stack multiple deploys; cancel in-progress when a new push lands.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Cloudflare Worker — leaderboard + PvP signaling.
  # Needs CF_API_TOKEN (with Workers:Edit + KV:Edit + Durable Objects:Edit)
  # in repo secrets. Created once via the Cloudflare dashboard:
  #   https://dash.cloudflare.com/profile/api-tokens → Create Token
  # ──────────────────────────────────────────────────────────────────
  deploy-worker:
    runs-on: ubuntu-latest
    if: ${{ vars.WORKER_URL != '' }}     # skip until WORKER_URL is set
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - name: Check API token presence
        id: token
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::warning::CF_API_TOKEN not set — skipping Worker deploy. Add it under Settings → Secrets and variables → Actions to enable autodeploy."
            echo "have_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.token.outputs.have_token == 'true'
        with: { node-version: '20', cache: 'npm', cache-dependency-path: worker/package.json }
      - if: steps.token.outputs.have_token == 'true'
        run: npm install
      - name: Deploy worker
        if: steps.token.outputs.have_token == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  # ──────────────────────────────────────────────────────────────────
  # GitHub Pages — static frontend (index.html + audio + tiles).
  # Substitutes the WORKER_URL repo variable into the api-base meta tag
  # so the deployed site talks to the Worker, while local checkout stays
  # empty and uses the same-origin Express server.
  # ──────────────────────────────────────────────────────────────────
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject Worker URL into api-base meta
        if: ${{ vars.WORKER_URL != '' }}
        run: |
          sed -i 's|<meta name="api-base" content="">|<meta name="api-base" content="${{ vars.WORKER_URL }}">|' index.html
      - name: Bundle static site
        run: |
          mkdir -p _site
          # Copy only the files the static site needs. server.js, worker/, and
          # node_modules are intentionally excluded — they don't run on Pages.
          cp index.html _site/
          cp -r audio _site/ 2>/dev/null || true
          cp -r tiles _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
