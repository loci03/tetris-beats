// dolphin vs shark, played out where you can see it
function drawSacrifice() {
  const A = S.sac;
  if (!A) return;
  const p = clamp(A.t / A.dur, 0, 1);
  const meet = 0.42, recoil = 0.62;
  // --- shark: drives in, then is thrown back ---
  let sp = p < meet ? p / meet : 0;
  let swx, swy;
  if (p < meet) { swx = lerp(A.sx0, A.mx, sp * sp); swy = lerp(A.sy0, A.my, sp * sp); }
  else {
    const q = clamp((p - meet) / (1 - meet), 0, 1);
    swx = lerp(A.mx, A.sx0, q * q * 0.9); swy = lerp(A.my, A.sy0, q * q * 0.9);
  }
  const [ssx, ssy] = w2s(swx - S.wx, swy - S.wy);
  const srise = p < meet ? 22 * Math.sin(sp * Math.PI * 0.6) : 22 * (1 - clamp((p - meet) / 0.3, 0, 1));
  cx.save();
  cx.translate(Math.round(ssx), Math.round(ssy - srise));
  cx.scale(1.7 - p * 0.35, 1.7 - p * 0.35);
  dShark(p > meet ? sprJawShut : sprJaw, -20, -32);
  cx.restore();
  // --- dolphin: launches into the jaws, then spins away and dissolves ---
  let dwx, dwy, drise, rot;
  if (p < meet) {
    const q = p / meet;
    dwx = lerp(A.dx0, A.mx, q); dwy = lerp(A.dy0, A.my, q);
    drise = Math.sin(q * Math.PI * 0.75) * 34;
    rot = -0.9 + q * 0.5;
  } else {
    const q = clamp((p - meet) / (1 - meet), 0, 1);
    dwx = A.mx + (A.mx - A.sx0) * 0.25 * q; dwy = A.my + (A.my - A.sy0) * 0.25 * q;
    drise = 34 + Math.sin(q * Math.PI) * 22;
    rot = -0.4 - q * 7;                                       // tumbles away
  }
  const [dsx, dsy] = w2s(dwx - S.wx, dwy - S.wy);
  cx.globalAlpha = p > recoil ? clamp(1 - (p - recoil) / (1 - recoil), 0, 1) : 1;
  cx.save();
  cx.translate(Math.round(dsx), Math.round(dsy - drise));
  cx.rotate(rot);
  cx.scale(1.35, 1.35);
  dLit(sprDolphinBig, -23, -15);
  // caught between the teeth for a beat before it is thrown clear
  if (p > meet && p < meet + 0.22) {
    cx.fillStyle = '#ffffff';
    for (let i = 0; i < 6; i++) cx.fillRect(-2 + i * 3, -9 + (i % 2) * 2, 2, 3);
    cx.fillStyle = '#8c1734';
    cx.fillRect(-3, -4, 20, 3);
  }
  cx.restore();
  cx.globalAlpha = 1;
  // --- the impact ---
  if (p >= meet && p < meet + 0.12) {
    const f = 1 - (p - meet) / 0.12;
    cx.globalAlpha = f * 0.9;
    cx.fillStyle = FW;
    const [mx2, my2] = w2s(A.mx - S.wx, A.my - S.wy);
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * TAU;
      const r = 12 + (1 - f) * 46;
      cx.fillRect(Math.round(mx2 + Math.cos(a) * r), Math.round(my2 + Math.sin(a) * r), 3, 3);
    }
    cx.globalAlpha = 1;
    drawText('!', mx2, my2 - 34, { sc: 3, col: AG, align: 'c', out: '#05070c' });
  }
  if (p > recoil && Math.random() < 0.7)
    part(dwx + rnd(-10, 10), dwy + rnd(-10, 10), rnd(-24, 24), rnd(-24, 24), drise * 0.7, 20, 60, 0.7, Math.random() < 0.6 ? AG : FW, 2);
}

// ---------- barracudas: they shadow you, then launch out of the water ----------
function updateBarra(b, dt) {
  const lvl = Math.min(S.laps, MAX_LEVEL - 1) * 0.25;   // predator aggression rides the curve
  const dx = S.wx - b.wx, dy = S.wy - b.wy;
  const d2 = dx * dx + dy * dy;
  if (b.cd > 0) b.cd -= dt;
  b.t += dt;
  const steer = (target, rate) => { b.h += clamp(wrapPi(target - b.h), -rate * dt, rate * dt); };
  const swim = spd => { b.wx += Math.sin(b.h) * spd * dt; b.wy += -Math.cos(b.h) * spd * dt; };

  switch (b.st) {
    case 'patrol': {
      steer(b.h + Math.sin(b.t * 0.6 + b.ph) * 0.9, 1.6);
      swim(52);
      const homeD = Math.hypot(b.wx - b.hx, b.wy - b.hy);
      if (homeD > 150) steer(Math.atan2(b.hx - b.wx, -(b.hy - b.wy)), 2.2);
      if (d2 < 330 * 330 && S.state === 'play' && S.wipeT <= 0) { b.st = 'follow'; b.t = 0; }
      break;
    }
    case 'follow': {
      steer(Math.atan2(dx, -dy), 3.2);
      swim(168 + lvl * 12);                       // fast, but you can outrun them in a straight line
      if (Math.random() < dt * 5) part(b.wx, b.wy, rnd(-8, 8), rnd(-8, 8), 0, 8, 50, 0.3, '#9fc8d8', 1);
      if (d2 < 62 * 62 && b.cd <= 0 && S.wipeT <= 0) {
        b.st = 'wind'; b.wind = 0.3;      // own field: b.t is advanced at the top of this function
        SFX.hiss();
      }
      if (d2 > 620 * 620 || Math.hypot(b.wx - b.hx, b.wy - b.hy) > 700) { b.st = 'patrol'; b.t = 0; }
      break;
    }
    case 'wind':                                   // brief coil before the strike
      steer(Math.atan2(dx, -dy), 4.0);
      swim(60);
      b.wind -= dt;
      if (b.wind <= 0) {
        b.st = 'leap'; b.t = 0; b.arc = 0; b.hit = false;
        const lead = 0.34;
        b.lx = b.wx; b.ly = b.wy;
        b.tx = S.wx + S.velx * lead; b.ty = S.wy + S.vely * lead;
        SFX.barraLeap();
        splashCrown(b.wx, b.wy, 6, 45);
      }
      break;
    case 'leap': {                                 // airborne — jump it or steer clear
      const p = clamp(b.t / 0.55, 0, 1);           // b.t was zeroed on entry and ticks at the top
      b.wx = lerp(b.lx, b.tx, p); b.wy = lerp(b.ly, b.ty, p);
      b.arc = Math.sin(p * Math.PI) * 30;
      const near = Math.hypot(S.wx - b.wx, S.wy - b.wy);
      if (!b.hit && near < 14) {
        b.hit = true;
        if (S.hgt >= 12) {                         // you hopped it
          S.score += 250;
          pop('MISSED! +250', b.wx, b.wy, AG, 1);
        } else if (S.wipeT <= 0 && S.invT <= 0) {
          wipeout('BARRACUDA!');
          splashCrown(b.wx, b.wy, 14, 85);
          loseRings(5, S.wx, S.wy);
        }
      }
      if (p >= 1) {
        b.st = 'follow'; b.t = 0; b.arc = 0;
        b.cd = rnd(2.2, 3.6);
        splashCrown(b.wx, b.wy, 8, 55);
        SFX.barraSplash();
      }
      break;
    }
  }
}

// Everything that drives on this water obeys the same land. Returns the island
// it is about to hit, so a chaser you lead into a beach genuinely runs aground.
function landAhead(wx, wy, margin) {
  for (const isl of S.isles) {
    const dx = wx - isl.wx, dy = wy - isl.wy;
    if (dx * dx + dy * dy < (isl.r + margin) * (isl.r + margin)) return isl;
  }
  return null;
}
// steer away from a beach; returns true if it is already on the sand
function avoidLand(o, dt, turnRate, lookahead) {
  const fx = Math.sin(o.h), fy = -Math.cos(o.h);
  const ahead = landAhead(o.wx + fx * lookahead, o.wy + fy * lookahead, 30);
  if (ahead) {
    const away = Math.atan2(o.wx - ahead.wx, -(o.wy - ahead.wy));
    o.h += clamp(wrapPi(away - o.h), -turnRate * dt, turnRate * dt);
  }
  return !!landAhead(o.wx, o.wy, -6);         // actually aground
}
// a chaser piles into the sand: spray, spin, and it is out of the fight
function runAground(o, label) {
  splashCrown(o.wx, o.wy, 26, 120);
  plume(o.wx, o.wy, 16);
  S.shake = Math.max(S.shake, 3);
  SFX.bump(); noise(0.4, 0.24, 700, 160);
  pop(label, o.wx, o.wy, OR, 2);
}

// ---------- harbour patrol: shout at enough people and they come for you ----------
// Every "HEY!" you provoke is one more strike. Ten and the blue lights come on.
function addHeat(wx, wy) {
  if (S.cops.length || S.state !== 'play') return;
  S.heat++;
  if (S.heat === HEAT_LIMIT - 3) banner('PEOPLE ARE COMPLAINING', OR, 1.6, 'EASE OFF OR THEY COME');
  if (S.heat >= HEAT_LIMIT) startPursuit();
}
// what turns up depends on how many times you have already got away
function pursuitTier() {
  if (S.stars >= 4) return 3;      // military + helicopter
  if (S.stars >= 3) return 2;      // two patrol boats, and meaner
  return 1;                        // one patrol boat
}
function spawnCop(kind, angOff) {
  const a = rnd(TAU) + angOff;
  const hard = S.stars >= 3 ? 1 : 0;
  return {
    kind,
    wx: S.wx + Math.sin(a) * (kind === 'heli' ? 620 : 520),
    wy: S.wy - Math.cos(a) * (kind === 'heli' ? 620 : 520),
    h: a + Math.PI, spd: 150, st: 'chase', t: 0,
    wireCd: kind === 'heli' ? 99 : 4.5, bombCd: rnd(3.5, 6),
    giveUp: 0, hailT: 0, wires: 0, leaveT: 0,
    searchT: 0, scanA: 0, rotor: 0,
    snarl: 0,
    // MEASURED: at the old tops a perfect turbo-using pilot needed 47-59s to shake ONE
    // patrol boat and could NEVER outrun the gunboat+heli tier (0/6 over 75s). Turbo is
    // 1.6s on / 5.5s off — a 22% duty cycle — so against a 250 heli you lost 270 units
    // coasting for every 74 you bought boosting. These tops sit just under the player's
    // MK2 cruise, so coasting bleeds slowly and a turbo burst clearly opens the gap.
    top: kind === 'heli' ? 212 : kind === 'military' ? 202 : 190 + hard * 8

}
function startPursuit() {
  const tier = pursuitTier();

    S.cops.push(spawnCop('military', 0), spawnCop('heli', 2.1));
    banner('MILITARY RESPONSE', '#ff2436', 2.8, 'BOMBS WILL KILL YOU - RUN');
  } else if (tier === 2) {
    S.cops.push(spawnCop('police', 0), spawnCop('police', 2.6));
    banner('TWO PATROL BOATS', '#39b6ff', 2.6, 'THEY WANT YOU BADLY NOW');
  } else {
    S.cops.push(spawnCop('police', 0));
    banner('HARBOUR PATROL', '#39b6ff', 2.4, 'LOSE THEM AND EARN A STAR');
  }
  S.heat = 0; S.pursuitT = 0; S.pursuitResolved = false;
  SFX.siren(); SFX.hail();
}
// getting clean away is worth a star for the rest of the run
function endPursuit(msg, sub, earnStar) {
  S.cops = [];
  S.police = null;
  S.heat = 0;
  S.pursuitResolved = true;
  if (earnStar && S.stars < 9) {
    S.stars++;
    S.score += 5000;
    setTimeout(() => { if (S.state === 'play') {
      banner('STAR EARNED', YL, 2.6, S.stars + (S.stars >= 4 ? ' - THE MILITARY IS COMING' : S.stars >= 3 ? ' - THEY BRING TWO BOATS NOW' : ' STAR' + (S.stars > 1 ? 'S' : '')));
      SFX.levelUp();

}
function updateCops(dt) {
  if (!S.cops.length) { S.police = null; return; }
  S.pursuitT += dt;
  S.sirenT -= dt;
  if (S.sirenT <= 0) { S.sirenT = 0.9; SFX.siren(); }
  let anyChasing = false;
  for (let i = S.cops.length - 1; i >= 0; i--) {
    const C = S.cops[i];
    // Getting ticketed calls endPursuit() from INSIDE updateCop, which replaces S.cops
    // with a fresh empty array — so with two units alive the next index read undefined
    // and threw. Pre-existing; it needed a multi-unit tier plus a catch to show up.
    if (!C) break;
    if (!updateCop(C, dt)) { if (S.cops[i] === C) S.cops.splice(i, 1); continue; }
    if (C.st === 'chase') anyChasing = true;
  }
  S.police = S.cops[0] || null;
  // wrecking or feeding the last unit is a real escape too — it used to end the
  // pursuit silently here, with no star and no resolution
  if (!S.cops.length) {
    if (!S.pursuitResolved) endPursuit('YOU LOST THEM', 'NOBODY LEFT TO CHASE YOU', true);
    return;
  }
  // every unit has given up looking — you are clear
  if (!anyChasing && S.cops.every(c => c.st === 'search' && c.searchT <= 0)) {
    endPursuit('YOU LOST THEM', 'CLEAN GETAWAY', true);
  }
}
// They were laying razor wire across your line and then driving straight over it,
// which looked idiotic and wasted the one thing on the water that could have slowed
// them. A boat now reads its own wire and swings WIDE around it — casts it, then goes
// by the side — and if it clips one anyway it gets snarled like anyone else.
function wireBias(C) {
  if (C.kind === 'heli') return 0;                  // it flies over
  const fx = Math.sin(C.h), fy = -Math.cos(C.h);
  const rx = Math.cos(C.h), ry = Math.sin(C.h);
  let bias = 0;
  for (const w of S.wires) {
    const ddx = w.wx - C.wx, ddy = w.wy - C.wy;
    const dist = Math.hypot(ddx, ddy);
    if (dist > 170 || dist < 2) continue;
    if ((ddx * fx + ddy * fy) / dist < 0.3) continue;   // behind us, ignore it
    const across = ddx * rx + ddy * ry;
    // swing to whichever side of the wire we are already on; if dead centre, pick one
    const side = Math.abs(across) < 6 ? (w.wx + w.wy > 0 ? 1 : -1) : (across > 0 ? -1 : 1);
    bias += side * (1 - dist / 170) * 2.6;
  }
  return clamp(bias, -2.2, 2.2);
}
function updateCop(C, dt) {
  C.t += dt; C.wireCd -= dt; C.bombCd -= dt; C.hailT -= dt; C.rotor += dt * 22;
  const dx = S.wx - C.wx, dy = S.wy - C.wy;
  const d = Math.hypot(dx, dy) || 1;
  const air = C.kind === 'heli';

  if (C.st === 'leave') {
    C.leaveT -= dt;
    const away = Math.atan2(-dx, dy);
    C.h += clamp(wrapPi(away - C.h), -1.6 * dt, 1.6 * dt);
    C.spd = lerp(C.spd, C.top + 40, dt * 1.5);
    C.wx += Math.sin(C.h) * C.spd * dt; C.wy += -Math.cos(C.h) * C.spd * dt;
    return C.leaveT > 0 && d < 900;
  }

  if (C.st === 'search') {
    // cool-off: they sweep a scan cone. Get seen and it is back on.
    C.searchT -= dt;
    C.scanA += dt * 1.5;
    C.h += clamp(wrapPi(C.scanA - C.h), -1.4 * dt, 1.4 * dt);
    C.spd = lerp(C.spd, 90, dt);
    if (!air && avoidLand(C, dt, 2.6, 46)) { runAground(C, 'AGROUND!'); return false; }
    C.wx += Math.sin(C.h) * C.spd * dt; C.wy += -Math.cos(C.h) * C.spd * dt;
    const inCone = Math.abs(wrapPi(Math.atan2(dx, -dy) - C.h)) < 0.55;
    if (d < 260 && inCone) {                       // spotted again
      C.st = 'chase'; C.giveUp = 0; C.searchT = 0;
      banner('SPOTTED!', '#ff2436', 1.4, 'THE PURSUIT IS BACK ON');
      SFX.hail(); SFX.siren();
    }
    if (C.searchT <= 0) return true;               // held until every unit gives up
    return true;
  }

  // ---- snarled in wire ----
  if (C.snarl > 0) {
    C.snarl -= dt;
    C.h += dt * 3.4 * (C.snarlDir || 1);              // slewing sideways, engine bogged
    C.spd = lerp(C.spd, 26, dt * 3);
    C.wx += Math.sin(C.h) * C.spd * dt; C.wy += -Math.cos(C.h) * C.spd * dt;
    if (Math.random() < dt * 30) part(C.wx + rnd(-8, 8), C.wy + rnd(-8, 8), rnd(-30, 30), rnd(-30, 30), 0, 24, 90, 0.4, FW, 1);
    return true;
  }
  // ---- chase ----
  const want = Math.atan2(dx, -dy) + wireBias(C);
  C.h += clamp(wrapPi(want - C.h), -(air ? 2.4 : 2.1) * dt, (air ? 2.4 : 2.1) * dt);
  C.spd = lerp(C.spd, C.top + Math.min(12, S.laps), dt * 1.3);
  // boats respect the shoreline — and can be led onto it
  if (!air && avoidLand(C, dt, 2.9, 52)) {
    runAground(C, C.kind === 'military' ? 'BEACHED!' : 'AGROUND!');
    pop(C.kind === 'military' ? 'GUNBOAT DOWN' : 'PATROL DOWN', C.wx, C.wy, AG, 1);
    return false;
  }
  const fx = Math.sin(C.h), fy = -Math.cos(C.h);
  C.wx += fx * C.spd * dt; C.wy += fy * C.spd * dt;
  if (!air && Math.random() < dt * 26) part(C.wx - fx * 12, C.wy - fy * 12, rnd(-16, 16), rnd(-16, 16), 0, 18, 80, 0.4, FW, 1);

  // wire (patrol + military)
  if (!air && C.wireCd <= 0 && d < 420) {
    C.wireCd = rnd(4.5, 7.5);
    const lead = 0.95;
    S.wires.push({ wx: S.wx + S.velx * lead, wy: S.wy + S.vely * lead,
                   ang: Math.atan2(S.velx, -S.vely), t: 0, life: 11, warn: 0.75 });
    SFX.wireDrop();
    C.wires++;
    if (C.hailT <= 0) { C.hailT = 5; pop('PULL OVER!', C.wx, C.wy, '#39b6ff', 1); SFX.hail(); }
    if (C.wires >= 5) { C.st = 'search'; C.searchT = 9; C.scanA = C.h; banner('THEY LOSE YOUR TRAIL', AG, 1.8, 'STAY OUT OF THE LIGHT'); }
  }
  // bombs (military + helicopter) — these kill
  if ((C.kind === 'military' || air) && C.bombCd <= 0 && d < 460) {
    C.bombCd = rnd(3.2, 5.4);
    throwBomb(C.wx, C.wy, S.wx + S.velx * 1.05, S.wy + S.vely * 1.05);
    if (C.hailT <= 0) { C.hailT = 4; pop('INCOMING!', C.wx, C.wy, OR, 1); }
  }
  // caught
  const grabR = air ? 14 : 17;
  if (d < grabR && S.wipeT <= 0 && S.invT <= 0 && S.hgt < 12) {
    // Getting caught escalates: the first ticket is 50, every one after is 100.
    // The military was 35 flat, which would have made the gunboat CHEAPER than a
    // patrol boat once the repeat rate kicked in — it scales with you instead.
    S.tickets = (S.tickets || 0) + 1;
    const repeat = S.tickets > 1;
    const fine = C.kind === 'police' ? (repeat ? 100 : 50) : (repeat ? 150 : 100);
    SFX.ticket();
    // loseRings() posts its own "BLOOD IN THE WATER" banner, so the ticket has to be
    // announced AFTER it or the player never learns what they were actually fined
    loseRings(fine, S.wx, S.wy);
    banner(C.kind === 'police' ? (repeat ? 'REPEAT OFFENDER!' : 'TICKET!') : 'DETAINED!',
           '#39b6ff', 2.4, '-' + fine + ' RINGS' + (repeat ? '  (CAUGHT AGAIN)' : ''));
    S.spd *= 0.5;
    S.shake = Math.max(S.shake, 4); S.flash = 0.22; S.flashCol = '#39b6ff';
    endPursuit(null, null, false);
    return false;
  }
  // outrun them and they drop to searching rather than vanishing
  if (d > 540) {
    C.giveUp += dt;
    if (C.giveUp > 2.8) { C.st = 'search'; C.searchT = 6; C.scanA = C.h; C.giveUp = 0; }
  } else C.giveUp = 0;
  if (C.t > 95) { C.st = 'search'; C.searchT = 5; }
  return true;
}
function updateWires(dt) {
  for (let i = S.wires.length - 1; i >= 0; i--) {
    const w = S.wires[i];
    w.t += dt;
    if (w.warn > 0) w.warn -= dt;
    if (w.t >= w.life) { S.wires.splice(i, 1); continue; }
    // THEIR OWN WIRE BITES THEM TOO. It only ever tested the player before, so the
    // razor wire was a pure tax on you; now leading a boat across one is a real play.
    if (w.warn <= 0) {
      const wrx = Math.cos(w.ang), wry = Math.sin(w.ang);
      let snagged = false;
      for (const C of S.cops) {
        if (C.kind === 'heli' || C.snarl > 0) continue;
        const cax = clamp((C.wx - w.wx) * wrx + (C.wy - w.wy) * wry, -34, 34);
        const cx2 = w.wx + wrx * cax, cy2 = w.wy + wry * cax;
        if (Math.hypot(C.wx - cx2, C.wy - cy2) < 11) {
          C.snarl = 1.9; C.snarlDir = Math.random() < 0.5 ? 1 : -1;
          C.spd *= 0.3;
          S.score += 750;
          pop('FOULED! +750', C.wx, C.wy, AG, 2);
          banner('THEIR OWN WIRE', AG, 1.4, 'HE IS SNARLED');
          splashCrown(C.wx, C.wy, 12, 90);
          SFX.bump();
          snagged = true;
        }
      }
      if (snagged) { S.wires.splice(i, 1); continue; }
    }
    if (S.wipeT > 0 || S.invT > 0 || S.hgt >= 12) continue;   // airborne clears it
    // distance to the wire segment (it lies perpendicular to how it was thrown)
    const rx = Math.cos(w.ang), ry = Math.sin(w.ang);
    const px = S.wx - w.wx, py = S.wy - w.wy;
    const along = clamp(px * rx + py * ry, -34, 34);
    const cxp = w.wx + rx * along, cyp = w.wy + ry * along;
    if (Math.hypot(S.wx - cxp, S.wy - cyp) < 7) {
      wipeout('BARBED WIRE!');
      S.spd *= 0.35;                                          // it really bogs you down
      for (let k = 0; k < 14; k++)
        part(S.wx, S.wy, rnd(-70, 70), rnd(-70, 70), 0, rnd(20, 60), 200, rnd(0.3, 0.6), Math.random() < 0.5 ? '#c8d4e0' : OR, 1);
      S.wires.splice(i, 1);
    }
  }
}

// ---------- the Raider: a hostile rider who rams you or lobs bombs ----------
const RAIDER_LEVEL = 1;                 // laps completed, so he turns up ON LEVEL 2
// ---------- THE MISCHIEF RIDER ----------
// Sweet to your face, planting traps behind your back. She only ever plants while
// she is far enough away that you cannot see her do it — the whole joke is that
// the boxes look exactly like the real thing.
const PINK_LEVEL = 3;                   // laps completed, so she turns up ON LEVEL 4
const MINE_LEVEL = 7;                   // from LEVEL 8 the fakes are live mines
const PINK_COOS = ['HI THERE!', 'NICE ONE!', 'SO COOL!', 'DO IT AGAIN!', 'WOW!', 'MY HERO!', 'CATCH ME!', 'MK3 BABY!'];
const PINK_SLY  = ['TEEHEE', 'OOPS!', 'HAVE FUN!', 'XOXO'];
function updatePink(dt) {
  if (!S.pink) {
    if (S.laps < PINK_LEVEL || S.state !== 'play') return;
    S.pinkCd -= dt;
    if (S.pinkCd > 0) return;
    const a = rnd(TAU);
    S.pink = { wx: S.wx + Math.sin(a) * 400, wy: S.wy - Math.cos(a) * 400, h: a + Math.PI,
               spd: 240, st: 'come', t: 0, cooCd: 0, plantCd: rnd(4, 9), bob: rnd(6), passes: 0 };
    banner('SHE LIKES YOU', '#ff4fa3', 1.8, 'AND SHE HAS THE MK3');
    SFX.shout(0.1, true);
    return;
  }
  const P = S.pink;
  P.t += dt; P.cooCd -= dt; P.plantCd -= dt;
  const dx = S.wx - P.wx, dy = S.wy - P.wy;
  const d = Math.hypot(dx, dy) || 1;
  const want = Math.atan2(dx, -dy);
  const steer = (target, rate) => { P.h += clamp(wrapPi(target - P.h), -rate * dt, rate * dt); };

  if (P.st === 'come') {                                  // swing in to say hello
    steer(want, 2.2);
    P.spd = lerp(P.spd, 288, dt * 1.4);                   // MK3 — nothing out here is quicker
    if (d < 230) { P.st = Math.random() < 0.65 ? 'flyby' : 'admire'; P.t = 0; }
  } else if (P.st === 'flyby') {
    // The drive-by. She has to COMMIT: at 300 speed with a lazy turn rate she just
    // arced away and never got closer than 229, so the pass never happened.
    if (!P.passedClose) {
      steer(want, 4.2);                                   // hard enough to actually line you up
      P.spd = lerp(P.spd, 334, dt * 2.5);
      if (d < 62) P.passedClose = true;                   // committed — now hold the line
    } else {
      P.spd = lerp(P.spd, 352, dt * 2);
    }
    if (P.cooCd <= 0) { P.cooCd = 0.14; throwHeart(P, true); }
    if (Math.random() < dt * 26) spray(P.wx, P.wy, 2, FW, 70, true);
    if (d < 95 && !P.hooted) {
      P.hooted = true;
      pop(pick(PINK_COOS), P.wx, P.wy, '#ff4fa3', 2);
      SFX.passBy(0.1, 170, 1.0, true);
    }
    if ((P.passedClose && d > 200) || P.t > 6) {
      P.st = 'slip'; P.t = 0; P.hooted = false; P.passedClose = false; P.passes++;
    }
  } else if (P.st === 'gas') {
    // 10 seconds of her trying to get alongside and dose you. Outrun her or turn
    // inside her — she is faster in a straight line, so straight lines lose.
    P.gasT -= dt;
    // She corners well enough to close on anyone standing still. The counter is not
    // out-turning her, it is not letting her HOLD you — at 1.85 her turn radius was
    // 171 units and she could not converge on a stationary target either.
    steer(want, 2.18);        // just UNDER your 2.55 — turning is the way out
    // Close fast, then MATCH you so she can sit on your shoulder and dose you. At a
    // flat 316 she blew straight past every time and never held contact long enough.
    P.spd = lerp(P.spd, d < 80 ? Math.max(90, S.spd * 1.06) : 316, dt * 2.5);
    if (Math.random() < dt * 34)
      part(P.wx + rnd(-8, 8), P.wy + rnd(-8, 8), rnd(-24, 24), rnd(-24, 24), 0, 20, 90, 0.55, '#9fe8b4', 2);
    if (P.cooCd <= 0) { P.cooCd = 0.5; pop(pick(['HOLD STILL!', 'ONE WHIFF!', 'COME HERE!']), P.wx, P.wy, '#5ad17a', 1); }
    if ((P.gassed || 0) > 0.15) {                        // the dose building on you
      S.flash = Math.max(S.flash, 0.07 * (P.gassed / 0.5));
      S.flashCol = '#5ad17a';
      if (Math.random() < dt * 40) part(S.wx + rnd(-10, 10), S.wy + rnd(-10, 10), rnd(-20, 20), rnd(-20, 20), 0, 18, 80, 0.5, '#9fe8b4', 1);
    }
    // She has to HOLD you, not brush you — a single touch was unavoidable given she
    // is 80 units/s faster than you. Now a graze costs you nothing if you shake her.
    if (d < 34 && S.wipeT <= 0 && S.invT <= 0) P.gassed = (P.gassed || 0) + dt;
    else P.gassed = Math.max(0, (P.gassed || 0) - dt * 0.8);
    if (P.gassed >= 0.5 && S.wipeT <= 0 && S.invT <= 0) {
      S.drowsy = 10;
      banner('SHE GOT YOU', '#5ad17a', 2.4, 'DROWSY - 10 SECONDS');
      pop('SWEET DREAMS!', P.wx, P.wy, '#5ad17a', 2);
      S.flash = 0.3; S.flashCol = '#5ad17a'; S.shake = Math.max(S.shake, 5); S.slow = 0.6;
      for (let i = 0; i < 20; i++)
        part(S.wx + rnd(-12, 12), S.wy + rnd(-12, 12), rnd(-40, 40), rnd(-40, 40), 0, 26, 110, 0.7, '#9fe8b4', 2);
      P.st = 'slip'; P.t = 0;
    } else if (P.gasT <= 0) {
      S.score += 2500;
      banner('HELD YOUR BREATH!', CY, 1.8, '+2,500');
      pop('NO FAIR!', P.wx, P.wy, MG, 1);
      P.st = 'slip'; P.t = 0;
    }
  } else if (P.st === 'admire') {                         // pace you, throwing hearts
    steer(want + 1.05 * (P.bob > 3 ? 1 : -1), 1.9);
    P.spd = lerp(P.spd, 218, dt);
    // she loves an audience — tricks get her going
    const showing = S.air || S.airTricks > 0 || S.trickyT > 0;
    if (P.cooCd <= 0 && d < 260) {

      cx.rotate(e.h - S.h);
      cx.scale(1.5, 1.5);
      dLit(sprSailBig, -sprSailBig.width / 2, -sprSailBig.height / 2);
      cx.restore();
    } else if (e.k === 'pod') {
      if (e.active > 0.05) {
        for (let di = 0; di < 3; di++) {
          const ph = (e.t * 0.55 + di * 0.33) % 1;
          const jump = Math.sin(ph * Math.PI);
          const ddx = Math.sin(e.t * 0.8 + di * 2.1) * (40 + di * 14);
          const ddy = Math.cos(e.t * 0.8 + di * 2.1) * (26 + di * 10);
          const [dsx, dsy] = w2s(e.wx + ddx - S.wx, e.wy + ddy - S.wy);
          if (jump < 0.1) continue;
          cx.globalAlpha = e.active;
          cx.fillStyle = 'rgba(0,0,0,0.3)';
          cx.fillRect(Math.round(dsx) - 5, Math.round(dsy), 10, 2);
          const f = DOL_F[Math.floor(T * 5 + di) % 2];
          cx.drawImage(ddx > 0 ? flipXCached(f) : f, Math.round(dsx) - 8, Math.round(dsy) - 8 - Math.round(jump * 14));
          cx.globalAlpha = 1;
          if (jump > 0.9 && Math.random() < 0.2) part(e.wx + ddx, e.wy + ddy, rnd(-20, 20), rnd(-20, 20), 0, 30, 120, 0.4, FW, 1);
        }
      }
    }
  }

  // beachgoers: sunbathing, drinking, strolling, wading — scattering when it goes wrong
  for (const p of S.beach) {
    if (p.hide > 0) continue;
    const dx = p.wx - S.wx, dy = p.wy - S.wy;
    if (dx * dx + dy * dy > VIEW2) continue;
    const [sx0, sy0] = w2s(dx, dy);
    const sx = Math.round(sx0), sy = Math.round(sy0);
    if (sx < -14 || sx > W + 14 || sy < HOR - 14 || sy > H + 14) continue;
    let img, ox = -4, oy = -7;
    const lk = p.look || 0;
    if (p.scare > 0) img = BEACH_RUN[lk];
    else if (p.kind === 'sun') img = BEACH_SUN[lk];
    else if (p.kind === 'drink') img = BEACH_SIT[lk];
    else if (p.kind === 'walk') img = BEACH_WLK[lk][Math.floor(T * 4 + p.a * 3) % 2];
    else { img = BEACH_SWM[lk][Math.floor(T * 3 + p.t) % 2]; ox = -6; oy = -4; }
    const bobY = p.kind === 'wade' ? Math.round(Math.sin(T * 2.4 + p.t) * 1.2) : 0;
    cx.drawImage(img, sx + ox, sy + oy + bobY);
    // a raised drink catches the light
    if (p.kind === 'drink' && p.scare <= 0 && Math.floor(T * 0.7 + p.t) % 4 === 0) {
      cx.fillStyle = FW; cx.fillRect(sx + 4, sy - 5, 1, 1);      // glint off the glass
    }
    if (p.scare > 0 && Math.floor(T * 8) % 2 === 0) drawText('!', sx, sy - 16, { sc: 1, col: OR, align: 'c', out: '#05070c' });
  }

  // alligators — basking on the sand, lurking eyes, or wakes closing on you
  for (const g of S.gators) {
    const dx = g.wx - S.wx, dy = g.wy - S.wy;
    if (dx * dx + dy * dy > VIEW2) continue;
    const [sx0, sy0] = w2s(dx, dy);
    const sx = Math.round(sx0), sy = Math.round(sy0);
    if (sx < -24 || sx > W + 24 || sy < HOR - 24 || sy > H + 24) continue;
    if (g.st === 'bask') {
      cx.save();
      cx.translate(sx, sy + Math.round(Math.sin(T * 1.4 + g.hx) * 0.5));
      cx.rotate(g.h - S.h);
      dLit(sprGator, -4, -11);
      cx.restore();
    } else {
      const swim = Math.sin(T * 7 + g.hx) * 1.2;
      cx.fillStyle = 'rgba(232,244,255,0.45)';
      for (let i = 1; i < 5; i++) cx.fillRect(sx - i, sy + 7 + i * 2, i * 2, 1);
      cx.save();
      cx.translate(sx, sy);
      cx.rotate(g.h - S.h + swim * 0.04);
      cx.globalAlpha = 0.45;
      dLit(sprGator, -4, -11);
      cx.globalAlpha = 1;
      dLit(sprGatorLurk, -4, -8);
      cx.restore();
      if (Math.floor(T * 6) % 2 === 0 && g.st === 'chase') { cx.fillStyle = '#ffd23a'; cx.fillRect(sx - 2, sy - 5, 1, 1); cx.fillRect(sx + 1, sy - 5, 1, 1); }
    }
  }

  // barracudas — a dark dart under the surface, then a fish in the air
  for (const b of S.barras) {
    const dxb = b.wx - S.wx, dyb = b.wy - S.wy;
    if (dxb * dxb + dyb * dyb > VIEW2) continue;
    const [sx0, sy0] = w2s(dxb, dyb);
    const sx = Math.round(sx0), sy = Math.round(sy0);
    if (sx < -20 || sx > W + 20 || sy < HOR - 20 || sy > H + 20) continue;
    if (b.st === 'leap') {
      cx.globalAlpha = 0.3; cx.fillStyle = '#000';
      cx.fillRect(sx - 5, sy, 11, 2); cx.globalAlpha = 1;
      const dirS = Math.atan2(b.tx - b.lx, -(b.ty - b.ly)) - S.h;
      cx.save();
      cx.translate(sx, Math.round(sy - b.arc));
      cx.rotate(dirS - Math.PI / 2);
      cx.scale(1.15, 1.15);
      dLit(sprBarraSide, -11, -4);
      cx.restore();
      if (Math.random() < 0.5) part(b.wx + rnd(-4, 4), b.wy + rnd(-4, 4), rnd(-10, 10), rnd(-10, 10), b.arc * 0.7, -10, 120, 0.3, FW, 1);
    } else {
      cx.save();
      cx.translate(sx, sy + Math.round(Math.sin(T * 9 + b.ph) * 0.8));
      cx.rotate(wrapPi(b.h - S.h));
      cx.globalAlpha = b.st === 'patrol' ? 0.75 : 1;
      dLit(sprBarra, -3, -10);
      cx.globalAlpha = 1;
      cx.restore();
      if (b.st === 'wind' && Math.floor(T * 12) % 2 === 0)
        drawText('!', sx, sy - 20, { sc: 2, col: AG, align: 'c', out: '#05070c' });
    }
  }

  // the dolphin friend, and its sacrifice
  if (S.pw.comp) {
    const C = S.pw.comp;
    const cwx = C.dead > 0 ? (C.sx !== undefined ? C.sx : C.wx) : C.wx;
    const cwy = C.dead > 0 ? (C.sy !== undefined ? C.sy : C.wy) : C.wy;
    const [csx, csy] = w2s(cwx - S.wx, cwy - S.wy);
    if (C.dead > 0) {
      // the sacrifice tableau draws the dolphin itself
    } else {
      const arc = C.arc || 0;
      const up = arc > 1;
      // shadow on the water, always
      cx.globalAlpha = up ? 0.3 : 0.22; cx.fillStyle = '#000';
      cx.fillRect(Math.round(csx) - 7, Math.round(csy) + 2, 15, 2);
      cx.globalAlpha = 1;
      if (up) {
        // airborne: rotate along the arc, nose up on the way out, down on entry
        const cyc = (C.ph % 1.7) / 1.7 / 0.55;
        const rot = lerp(-0.75, 0.75, clamp(cyc, 0, 1)) - S.h + S.h;
        cx.save();
        cx.translate(Math.round(csx), Math.round(csy - arc));
        cx.rotate(rot);
        const facing = C.side > 0 ? sprDolphinBig : sprDolphinFlip;
        cx.scale(0.85, 0.85);
        cx.drawImage(facing, -23, -15);
        cx.restore();
      } else {
        // cruising under: dorsal fin and a wake line
        cx.fillStyle = 'rgba(232,244,255,0.45)';
        for (let i = 1; i < 5; i++) cx.fillRect(Math.round(csx) - i, Math.round(csy) + 5 + i * 2, i * 2, 1);
        cx.fillStyle = '#3f6a92';
        cx.fillRect(Math.round(csx) - 1, Math.round(csy) - 3, 3, 5);
        cx.fillRect(Math.round(csx), Math.round(csy) - 5, 2, 3);
        cx.fillStyle = '#101c2a';
        cx.fillRect(Math.round(csx) - 2, Math.round(csy) + 2, 5, 1);
      }
      if (C.t < 12 && Math.floor(T * 4) % 2 === 0)
        drawText(Math.ceil(C.t) + 'S', Math.round(csx), Math.round(csy - arc) - 24, { sc: 1, col: AG, align: 'c', out: '#05070c' });
    }
  }

  // wreckage left where something got eaten
  for (const d2 of S.debris) {
    const [dx2, dy2] = w2s(d2.wx - S.wx, d2.wy - S.wy);
    if (dx2 < -20 || dx2 > W + 20 || dy2 < HOR || dy2 > H + 20) continue;
    cx.globalAlpha = clamp(1 - d2.t / 22, 0, 1) * 0.9;
    cx.fillStyle = d2.col;
    cx.fillRect(Math.round(dx2), Math.round(dy2 + Math.sin(T * 2 + d2.wx) * 1), 3, 2);
    cx.fillStyle = 'rgba(232,244,255,0.35)';
    cx.fillRect(Math.round(dx2) - 2, Math.round(dy2) + 2, 7, 1);
    cx.globalAlpha = 1;
  }

  // barbed wire: a warning flash as it lands, then a coil sitting in your line
  for (const w of S.wires) {
    const [wx0, wy0] = w2s(w.wx - S.wx, w.wy - S.wy);
    if (wx0 < -60 || wx0 > W + 60 || wy0 < HOR - 40 || wy0 > H + 40) continue;
    const fade = w.t > w.life - 2 ? clamp((w.life - w.t) / 2, 0, 1) : 1;
    cx.save();
    cx.translate(Math.round(wx0), Math.round(wy0));
    cx.rotate(w.ang - S.h);        // the coil lies across your line, not along it
    cx.globalAlpha = fade;
    cx.drawImage(sprWire, -12, -3, 24, 7);
    cx.drawImage(sprWire, -36, -3, 24, 7);
    cx.drawImage(sprWire, 12, -3, 24, 7);
    cx.restore();
    // bright hazard flash while it's still settling
    if (w.warn > 0 && Math.floor(T * 12) % 2 === 0) {
      cx.globalAlpha = clamp(w.warn / 0.75, 0, 1);
      cx.fillStyle = OR;
      cx.fillRect(Math.round(wx0) - 34, Math.round(wy0) - 5, 68, 1);
      cx.fillRect(Math.round(wx0) - 34, Math.round(wy0) + 4, 68, 1);
      cx.globalAlpha = 1;
      drawText('!', Math.round(wx0), Math.round(wy0) - 20, { sc: 2, col: OR, align: 'c', out: '#05070c' });
    }
    cx.globalAlpha = 1;
  }

  // pursuit units: patrol boats, gunboats, and the helicopter overhead
  for (const C of S.cops) {
    const dxp = C.wx - S.wx, dyp = C.wy - S.wy;
    if (dxp * dxp + dyp * dyp > VIEW2 * 2.4) continue;
    let [sx0, sy0] = w2s(dxp, dyp);
    const off = sx0 < 10 || sx0 > W - 10 || sy0 < HOR + 6 || sy0 > H - 10;
    const sx = Math.round(clamp(sx0, 10, W - 10)), sy = Math.round(clamp(sy0, HOR + 6, H - 10));
    cx.globalAlpha = off ? 0.75 : 1;
    if (C.kind === 'heli') {
      // shadow on the water, body above it, rotor blur on top
      cx.globalAlpha = 0.3; cx.fillStyle = '#000';
      cx.fillRect(sx - 7, sy + 2, 15, 4);
      cx.globalAlpha = off ? 0.75 : 1;
      const lift = 34;
      cx.save();
      cx.translate(sx, sy - lift);
      cx.rotate(wrapPi(C.h - S.h));
      dLit(sprHeli, -8, -10);
      cx.fillStyle = '#c8d0b8';
      for (let b = 0; b < 4; b++) {
        const a2 = C.rotor + b * Math.PI / 2;
        cx.fillRect(Math.round(Math.cos(a2) * 15) - 1, Math.round(Math.sin(a2) * 15) - 1, 3, 2);
      }
      cx.restore();
      // searchlight cone sweeping the water
      const beam = Math.sin(T * 1.6) * 0.5;
      cx.globalAlpha = 0.13;
      cx.fillStyle = '#fff6c0';
      for (let r = 6; r < 46; r += 3) {
        const wdt = 3 + r * 0.42;
        cx.fillRect(Math.round(sx + Math.sin(beam) * r - wdt / 2), Math.round(sy - lift + 12 + r), Math.round(wdt), 3);
      }
      cx.globalAlpha = off ? 0.75 : 1;
      if (Math.floor(T * 8) % 2 === 0) { cx.fillStyle = '#ff2436'; cx.fillRect(sx - 1, sy - lift - 12, 2, 2); }
    } else {
      cx.fillStyle = 'rgba(232,244,255,0.55)';
      for (let i = 1; i < 6; i++) cx.fillRect(sx - i, sy + 12 + i * 2, i * 2, 1);
      cx.save();
      cx.translate(sx, sy + Math.round(Math.sin(T * 3 + C.wx) * 1));
      cx.rotate(wrapPi(C.h - S.h));
      cx.scale(1.5, 1.5);
      cx.drawImage(C.kind === 'military' ? sprMilitary : sprPolice, -6, -14);
      cx.restore();
      const blue = Math.floor(T * 7) % 2 === 0;
      const c1 = C.kind === 'military' ? '#ff2436' : (blue ? '#39b6ff' : '#ff2436');
      const c2 = C.kind === 'military' ? '#ffe600' : (blue ? '#ff2436' : '#39b6ff');
      cx.fillStyle = c1; cx.fillRect(sx - 5, sy - 6, 4, 3);
      cx.fillStyle = c2; cx.fillRect(sx + 2, sy - 6, 4, 3);
      cx.globalAlpha = 0.16; cx.fillStyle = c1;
      cx.fillRect(sx - 22, sy - 14, 44, 30);
      cx.globalAlpha = off ? 0.75 : 1;
    }
    // searching: show the cone they are sweeping so you know where not to be
    if (C.st === 'search') {
      cx.globalAlpha = 0.12;
      cx.fillStyle = '#fff6c0';
      for (let r = 10; r < 90; r += 4) {
        const wdt = 4 + r * 0.55;
        const ca = wrapPi(C.h - S.h);
        cx.fillRect(Math.round(sx + Math.sin(ca) * r - wdt / 2), Math.round(sy - Math.cos(ca) * r), Math.round(wdt), 3);
      }
      cx.globalAlpha = off ? 0.75 : 1;
      if (Math.floor(T * 3) % 2 === 0) drawText('SEARCHING', sx, sy - 30, { sc: 1, col: '#fff6c0', align: 'c', out: '#05070c' });
    }
    if (off && Math.floor(T * 4) % 2 === 0)
      drawText('!', sx, sy - 24, { sc: 2, col: C.kind === 'military' ? '#8aff5a' : '#39b6ff', align: 'c', out: '#05070c' });
    cx.globalAlpha = 1;
  }

  // the Raider
  if (S.raider) {
    const R = S.raider;
    const dxr = R.wx - S.wx, dyr = R.wy - S.wy;
    if (dxr * dxr + dyr * dyr < VIEW2) {
      const [sx0, sy0] = w2s(dxr, dyr);
      const sx = Math.round(sx0), sy = Math.round(sy0);
      if (sx > -30 && sx < W + 30 && sy > HOR - 20 && sy < H + 30) {
        cx.fillStyle = 'rgba(232,244,255,0.7)';
        cx.fillRect(sx - 4, sy + 9, 9, 1);
        cx.save();
        cx.translate(sx, sy + Math.round(Math.sin(T * 6 + R.bob) * 1.2));
        cx.rotate(wrapPi(R.h - S.h));
        cx.scale(1.45, 1.45);
        dLit(sprRaider, -7, -13);
        cx.restore();
        if (R.st === 'aim' && Math.floor(T * 10) % 2 === 0)
          drawText('!', sx, sy - 26, { sc: 2, col: AG, align: 'c', out: '#05070c' });
        if (R.st === 'ram' && Math.floor(T * 8) % 2 === 0)
          drawText('>>>', sx, sy - 24, { sc: 1, col: OR, align: 'c', out: '#05070c' });
      }
    }
  }
  // bombs: arcing through the air, then ticking on the water inside a blast ring
  for (const b of S.bombs) {
    const [bx0, by0] = w2s(b.wx - S.wx, b.wy - S.wy);
    const bx = Math.round(bx0), by = Math.round(by0);
    if (bx < -40 || bx > W + 40 || by < HOR - 40 || by > H + 40) continue;
    if (b.st === 'fly') {
      cx.globalAlpha = 0.3; cx.fillStyle = '#000';
      cx.fillRect(bx - 2, by, 5, 2); cx.globalAlpha = 1;
      const byz = by - Math.round(b.z);
      cx.fillStyle = '#12171c'; cx.fillRect(bx - 2, byz - 2, 5, 5);
      cx.fillStyle = '#39404a'; cx.fillRect(bx - 1, byz - 2, 2, 1);
      cx.fillStyle = Math.floor(T * 20) % 2 ? YL : OR; cx.fillRect(bx + 1, byz - 4, 1, 2);
    } else {
      // the danger circle you must clear
      const warn = clamp(b.t / b.fuse, 0, 1);
      const rr2 = 40;
      const hot = Math.floor(T * (8 + warn * 16)) % 2 === 0;
      cx.fillStyle = hot ? OR : (warn > 0.6 ? '#ff2030' : YL);
      for (let i = 0; i < 22; i++) {
        const a2 = i / 22 * TAU;
        cx.fillRect(Math.round(bx + Math.cos(a2) * rr2), Math.round(by + Math.sin(a2) * rr2 * 0.6), 2, 1);
      }
      cx.fillStyle = '#12171c'; cx.fillRect(bx - 3, by - 3, 6, 6);
      cx.fillStyle = '#2a323c'; cx.fillRect(bx - 2, by - 3, 2, 1);
      if (hot) { cx.fillStyle = YL; cx.fillRect(bx + 2, by - 5, 1, 2); cx.fillStyle = FW; cx.fillRect(bx + 2, by - 6, 1, 1); }
    }
  }

  // rival jet skiers
  for (const n of S.npcs) {
    const dx = n.wx - S.wx, dy = n.wy - S.wy;
    if (dx * dx + dy * dy > VIEW2) continue;
    const [sx, sy] = w2s(dx, dy);
    if (sx < -30 || sx > W + 30 || sy < HOR - 20 || sy > H + 30) continue;
    if (n.td) {
      // TAKEN DOWN: cartwheeling ski, a helmet flying off on its own arc, and a
      // dazed rider bobbing at the end of it
      const T2 = n.td, q = clamp(T2.t / T2.dur, 0, 1);
      cx.globalAlpha = 0.3; cx.fillStyle = '#000';
      cx.fillRect(Math.round(sx) - 6, Math.round(sy) + 5, 12, 3);
      cx.globalAlpha = 1;
      cx.save();
      cx.translate(Math.round(sx), Math.round(sy - T2.hgt));
      cx.rotate(wrapPi(n.h - S.h));
      const scT = 1.3 * (1 + Math.min(0.45, T2.hgt / 200));
      cx.scale(scT, scT);
      dLit(n.img, -7, -13);
      cx.restore();
      if (T2.lid) {                                  // the helmet, tumbling separately
        const L = T2.lid;
        const [lx, ly] = w2s(L.x - S.wx, L.y - S.wy);
        cx.save();
        cx.translate(Math.round(lx), Math.round(ly - L.z));
        cx.rotate(L.t * L.spin);
        cx.fillStyle = '#FF0080'; cx.fillRect(-3, -3, 6, 5);
        cx.fillStyle = '#05070c'; cx.fillRect(-3, 0, 6, 2);
        cx.restore();
        cx.globalAlpha = 0.25; cx.fillStyle = '#000';
        cx.fillRect(Math.round(lx) - 3, Math.round(ly) + 2, 6, 2); cx.globalAlpha = 1;
      }
      if (q > 0.72) {                                // head bobbing in the water
        cx.fillStyle = '#e8a878';
        cx.fillRect(Math.round(sx) - 1, Math.round(sy) + Math.round(Math.sin(T * 5) * 1), 3, 3);
        cx.fillStyle = FW;
        cx.fillRect(Math.round(sx) - 4, Math.round(sy) + 4, 9, 1);
      }
      continue;
    }
    const bobN = n.air ? 0 : Math.sin(T * 6 + n.wx) * 1.2;
    if (n.air) {
      cx.globalAlpha = 0.25; cx.fillStyle = '#000';
      cx.fillRect(Math.round(sx) - 5, Math.round(sy) + 5, 10, 3);
      cx.globalAlpha = 1;
    } else {
      cx.fillStyle = 'rgba(232,244,255,0.7)';
      cx.fillRect(Math.round(sx) - 3, Math.round(sy) + 8, 7, 1);
    }
    cx.save();
    cx.translate(Math.round(sx), Math.round(sy - n.hgt + bobN));
    cx.rotate(wrapPi(n.h - S.h) + n.spin);
    const scN = 1.3 * (n.air ? 1 + Math.min(0.4, n.hgt / 220) : 1);
    cx.scale(scN, scN);
    dLit(n.img, -7, -13);
    cx.restore();
  }

  // the mischief rider
  if (S.pink) {
    const P = S.pink;
    const [px7, py7] = w2s(P.wx - S.wx, P.wy - S.wy);
    if (px7 > -30 && px7 < W + 30 && py7 > HOR - 20 && py7 < H + 30) {
      cx.fillStyle = 'rgba(232,244,255,0.7)';
      cx.fillRect(Math.round(px7) - 3, Math.round(py7) + 8, 7, 1);
      cx.save();
      cx.translate(Math.round(px7), Math.round(py7 + Math.sin(T * 6 + P.wx) * 1.2));
      cx.rotate(wrapPi(P.h - S.h));
      cx.scale(1.3, 1.3);
      dLit(sprPink, -7, -13);
      cx.restore();
      if (P.st === 'admire' && Math.floor(T * 2) % 2 === 0)
        cx.drawImage(HEART_F[0], Math.round(px7) - 3, Math.round(py7) - 22);
    }
  }
  // hearts drifting toward you
  for (const h of S.hearts) {
    const q = clamp(h.t / h.dur, 0, 1);
    const [hx, hy] = w2s(h.wx - S.wx, h.wy - S.wy);
    if (hx < -12 || hx > W + 12 || hy < HOR - 12 || hy > H + 12) continue;
    cx.globalAlpha = (1 - q) * 0.95;
    const fr = HEART_F[Math.floor(T * 6 + h.ph) % 2];
    cx.save();
    cx.translate(Math.round(hx), Math.round(hy - q * 18 + Math.sin(T * 4 + h.ph) * 2));
    const sc7 = h.big ? 1.6 : 1;
    cx.scale(sc7, sc7);
    cx.drawImage(fr, -3, -3);
    cx.restore();
    cx.globalAlpha = 1;
  }
  // impact shockwaves on the water
  for (const rg of S.rings3) {
    const a2 = clamp(1 - rg.t / rg.life, 0, 1);
    const [cx2, cy2] = w2s(rg.wx - S.wx, rg.wy - S.wy);
    cx.globalAlpha = a2 * 0.75;
    cx.fillStyle = rg.col;
    const seg = Math.max(12, Math.round(rg.r * 0.9));
    for (let i = 0; i < seg; i++) {
      const th = i / seg * TAU;
      if ((i + Math.floor(rg.t * 30)) % 3 === 0) continue;
      cx.fillRect(Math.round(cx2 + Math.cos(th) * rg.r), Math.round(cy2 + Math.sin(th) * rg.r * 0.6), 2, 1);
    }
    cx.globalAlpha = 1;
  }

  drawShark(pal);
  drawPlumes();
  // afterimage trail — fading, shrinking copies strung out behind the flight path
  for (let gi = 0; gi < S.ghosts.length; gi++) {
    const gh = S.ghosts[gi];
    const [gx, gy] = w2s(gh.wx - S.wx, gh.wy - S.wy);
    cx.globalAlpha = clamp(gh.life * 0.75, 0, 0.24);
    cx.save();
    cx.translate(Math.round(gx), Math.round(gy - gh.hgt));
    const gs = (1 + Math.min(0.5, gh.hgt / 190)) * 1.5 * (0.7 + 0.3 * (gi / S.ghosts.length));
    cx.scale(gs, gs);
    if (gh.spin) cx.rotate(gh.spin);
    // the trail has to be the trick you are actually doing — a barrel roll used to
    // leave a wake of upright seated skis behind it
    let gimg = gh.pose === 'super' ? sprSkiSuper : gh.pose === 'tuck' ? sprSkiTuck
             : gh.pose === 'oneh' ? sprSkiOneHand : gh.pose === 'nac' ? sprSkiNac : sprSki;
    if (gh.pitch) {
      const c2 = Math.cos(gh.pitch);
      cx.scale(1, Math.max(0.18, Math.abs(c2)));
      if (c2 < 0) gimg = sprSkiBelly;
    }
    if (gh.roll) {
      const r2 = Math.cos(gh.roll);
      cx.scale(Math.max(0.16, Math.abs(r2)), 1);
      if (r2 < 0) gimg = sprSkiBelly;
    }
    cx.drawImage(lit(gimg, LIGHT_A0 - gh.spin), -7, -13);
    cx.restore();
  }
  cx.globalAlpha = 1;
  drawPlayer(pal);
  // rotation arcs whipping around the ski — the classic pixel spin read
  if (S.air && (Math.abs(S.spin) > 0.15 || Math.abs(S.pitch) > 0.15) && S.wipeT <= 0) {
    const cxp = Math.round(W / 2), cyp = Math.round(PY - S.hgt);
    const spinning = Math.abs(S.spin) > 0.15;
    const base = spinning ? S.spin : S.pitch;
    for (let k = 0; k < 3; k++) {
      const a0 = base * 1.25 + k * (TAU / 3);
      const rad = 17 + Math.sin(T * 12 + k) * 2;
      cx.fillStyle = S.trickyT > 0 ? [CY, MG, YL][k % 3] : (k === 0 ? FW : CY);
      cx.globalAlpha = 0.85;
      for (let s2 = 0; s2 < 5; s2++) {
        const th = a0 - s2 * 0.17;
        const rx2 = Math.cos(th) * rad, ry2 = Math.sin(th) * rad * (spinning ? 0.62 : 1);
        cx.fillRect(cxp + Math.round(rx2), cyp + Math.round(ry2), 2, 2 - (s2 > 2 ? 1 : 0));
      }
    }
    cx.globalAlpha = 1;
  }

  // dolphins arcing over the rider
  if (S.leap) {
    for (let di = 0; di < 2; di++) {
      const tt = clamp((S.leap.t - di * 0.12) / S.leap.dur, 0, 1);
      if (tt <= 0 || tt >= 1) continue;
      const lwx = lerp(S.leap.ax, S.leap.bx, tt), lwy = lerp(S.leap.ay, S.leap.by, tt);
      const hgt2 = Math.sin(tt * Math.PI) * 46;
      const [sx, sy] = w2s(lwx - S.wx, lwy - S.wy);
      cx.globalAlpha = 0.3; cx.fillStyle = '#000';
      cx.fillRect(Math.round(sx) - 6, Math.round(sy), 12, 2);
      cx.globalAlpha = 1;
      const f = DOL_F[Math.floor(T * 6 + di) % 2];
      const scrDx = (S.leap.bx - S.leap.ax) * cosH + (S.leap.by - S.leap.ay) * sinH;
      cx.save();
      cx.translate(Math.round(sx), Math.round(sy - hgt2));
      cx.scale(scrDx > 0 ? -1.4 : 1.4, 1.4);
      cx.drawImage(f, -8, -5);
      cx.restore();
    }
  }

  // particles (world + z)
  for (const p of S.parts) {
    const dx = p.wx - S.wx, dy = p.wy - S.wy;
    if (dx * dx + dy * dy > VIEW2) continue;
    const [sx, sy] = w2s(dx, dy);
    cx.globalAlpha = clamp(p.life * 2.5, 0, 1);
    cx.fillStyle = p.col;
    cx.fillRect(Math.round(sx), Math.round(sy - p.z), p.sz, p.sz);
  }
  cx.globalAlpha = 1;
  cx.restore(); // sea clip

  // popups (world-anchored)
  for (const p of S.pops) {
    const [sx, sy] = w2s(p.wx - S.wx, p.wy - S.wy);
    cx.globalAlpha = clamp(p.life * 2, 0, 1);
    drawText(p.t, sx, sy - 30 - p.rise, { sc: p.sc, col: p.col, align: 'c', out: '#05070c' });
  }
  cx.globalAlpha = 1;

  // bird flock overhead — shadows sweep the water, wings ride above
  if (S.flock) {
    const fl = S.flock;
    const tt = fl.t / fl.dur;
    const dirX = (fl.bx - fl.ax) / 860, dirY = (fl.by - fl.ay) / 860;
    const perX = -dirY, perY = dirX;
    for (let i = 0; i < 6; i++) {
      const k = i - 2.5;
      const bwx = lerp(fl.ax, fl.bx, tt) - dirX * Math.abs(k) * 16 + perX * k * 13;
      const bwy = lerp(fl.ay, fl.by, tt) - dirY * Math.abs(k) * 16 + perY * k * 13;
      const [sx, sy] = w2s(bwx - S.wx, bwy - S.wy);
      if (sx < -12 || sx > W + 12 || sy < -12 || sy > H + 12) continue;
      if (sy > 96) { cx.globalAlpha = 0.25; cx.fillStyle = '#000'; cx.fillRect(Math.round(sx) - 2, Math.round(sy), 5, 2); cx.globalAlpha = 1; }
      const f = GULL_F[Math.floor(T * 7 + i * 1.3) % 2];
      cx.drawImage(f, Math.round(sx) - 5, Math.round(sy) - 17, 11, 6);
    }
  }

  const LVfx = curLevel().fx;
  // fog banks: drifting horizontal veils that eat the horizon
  if (LVfx === 'fog') {
    let fs = 7;
    const fr = () => { fs = (fs * 1103515245 + 12345) & 0x7fffffff; return (fs & 0xffff) / 0xffff; };
    for (let i = 0; i < 16; i++) {
      const bandY = HOR + fr() * (H - HOR);
      const drift = (fr() * W + T * (8 + i * 3)) % (W + 120) - 60;
      const bw = 70 + fr() * 110, bh = 3 + fr() * 5;
      cx.globalAlpha = 0.05 + fr() * 0.06;
      cx.fillStyle = '#cfe0ea';
      cx.fillRect(Math.round(drift), Math.round(bandY), Math.round(bw), Math.round(bh));
    }
    cx.globalAlpha = 0.16; cx.fillStyle = '#8fa8bd';
    cx.fillRect(-8, HOR - 4, W + 16, 26);
    cx.globalAlpha = 1;
  }
  // embers rising off the water in the volcanic harbour
  if (LVfx === 'ember') {
    for (let i = 0; i < 30; i++) {
      const seed = i * 37.1;
      const ex2 = (Math.sin(seed) * 0.5 + 0.5) * W + Math.sin(T * 0.6 + i) * 14;
      const ey2 = H - ((T * (16 + (i % 5) * 7) + seed * 23) % (H - HOR)) ;
      cx.globalAlpha = 0.35 + Math.sin(T * 6 + i) * 0.3;
      cx.fillStyle = i % 3 === 0 ? YL : OR;
      cx.fillRect(Math.round(ex2), Math.round(ey2), 1, 2);
    }
    cx.globalAlpha = 0.09; cx.fillStyle = '#ff5a1e';
    cx.fillRect(-8, HOR, W + 16, H - HOR);
    cx.globalAlpha = 1;
  }
  // bioluminescent bloom on the neon level
  if (LVfx === 'glow') {
    for (let i = 0; i < 26; i++) {
      const seed = i * 91.7;
      const gx2 = (Math.sin(seed) * 0.5 + 0.5) * W + Math.sin(T * 0.4 + i * 2) * 20;
      const gy2 = HOR + (Math.cos(seed) * 0.5 + 0.5) * (H - HOR);
      cx.globalAlpha = 0.25 + Math.sin(T * 3 + i) * 0.25;
      cx.fillStyle = i % 4 === 0 ? MG : CY;
      cx.fillRect(Math.round(gx2), Math.round(gy2), 2, 1);
    }
    cx.globalAlpha = 1;
  }
  // rain on the storm level — slanted streaks + darkened water
  if (LVfx === 'rain') {
    cx.globalAlpha = 0.5;
    cx.fillStyle = '#a8c4e0';
    let rs = S.rainSeed;
    const rr2 = () => { rs = (rs * 1103515245 + 12345) & 0x7fffffff; return (rs & 0xffff) / 0xffff; };
    for (let i = 0; i < 46; i++) {
      const x = (rr2() * W + T * 90) % W;
      const y = (rr2() * H + T * 620) % H;
      cx.fillRect(Math.round(x), Math.round(y), 1, 4);
      cx.fillRect(Math.round(x) + 1, Math.round(y) + 2, 1, 3);
    }
    cx.globalAlpha = 1;
  }

  drawHUD(pal);
  cx.restore();

  if (S.flash > 0) {
    cx.globalAlpha = clamp(S.flash, 0, 0.5);
    cx.fillStyle = S.flashCol; cx.fillRect(0, 0, W, H);
    cx.globalAlpha = 1;
  }
  drawDrowsy();
  drawVignette();
  if (S.state === 'pause') drawPause();
  if (S.state === 'over') drawOver();
}
function drawDrowsy() {
  if (!(S.drowsy > 0)) return;
  const q = clamp(S.drowsy / 8, 0, 1);
  // a green wash and a slow swimming double-image
  cx.globalAlpha = 0.16 * q;
  cx.fillStyle = '#5ad17a'; cx.fillRect(0, 0, W, H);
  cx.globalAlpha = 1;
  cx.globalAlpha = 0.22 * q;
  for (let i = 0; i < 5; i++) {
    const y = ((T * 26 + i * 90) % (H + 60)) - 30;
    cx.fillStyle = '#9fe8b4';
    cx.fillRect(0, Math.round(y + Math.sin(T * 1.4 + i) * 6), W, 2);
  }
  cx.globalAlpha = 1;
  if (Math.floor(T * 2) % 2 === 0)
    drawText('DROWSY  ' + Math.ceil(S.drowsy) + 'S', W / 2, HOR + 26,
             { sc: 1, col: '#9fe8b4', align: 'c', out: '#05070c' });
}
function drawVignette() {
  cx.fillStyle = 'rgba(4,11,26,0.5)';
  cx.fillRect(0, 0, W, 2); cx.fillRect(0, H - 2, W, 2);
  cx.fillRect(0, 0, 2, H); cx.fillRect(W - 2, 0, 2, H);
}

function drawPlayer() {
  if (S.shark.st === 'eat') return;
  const px = Math.round(W / 2), base = PY;
  const bob = S.air ? 0 : Math.sin(T * 7 + S.dist * 0.02) * 1.4 + Math.sin(T * 11.3) * 0.6;
  const py = Math.round(base - S.hgt + bob - S.chop);
  if (S.invT > 0 && S.wipeT <= 0 && Math.floor(T * 12) % 2 === 0) return;
  // pose picked up here so the cast shadow and the motion smear share the real
  // silhouette — a superman throws a completely different shadow from a tuck
  const poseNow = S.trick && TRICKS[S.trick.type] && TRICKS[S.trick.type].pose;
  const silSrc = poseNow === 'super' ? sprSkiSuper : poseNow === 'tuck' ? sprSkiTuck
               : poseNow === 'oneh' ? sprSkiOneHand : poseNow === 'nac' ? sprSkiNac : sprSki;
  if (S.air) {
    const sc = clamp(1 - S.hgt / 220, 0.35, 1);
    // A flat bar under the ski is a placeholder shadow. A real one is the SHAPE of
    // the thing, it slides away from the key light as the object climbs, and it
    // turns when the object turns — which is most of what tells you how high you are.
    const sx = px + S.hgt * 0.11, sy = base + 6 + S.hgt * 0.045;
    cx.save();
    cx.globalAlpha = clamp(0.34 * sc, 0.06, 0.34);
    cx.translate(sx, sy);
    if (S.spin) cx.rotate(S.spin);
    cx.scale(1.5 * sc, 1.5 * sc * 0.42);              // squashed: it lies on the water
    if (S.pitch) cx.scale(1, Math.max(0.18, Math.abs(Math.cos(S.pitch))));
    if (S.roll)  cx.scale(Math.max(0.16, Math.abs(Math.cos(S.roll))), 1);
    cx.drawImage(silhouette(silSrc), -7, -13);
    cx.restore();
    cx.globalAlpha = 1;
    // altitude tether + rising speed lines sell the height
    if (S.hgt > 26) {
      cx.fillStyle = 'rgba(0,245,255,0.35)';
      for (let y = base + 4; y > py + 14; y -= 6) cx.fillRect(px, Math.round(y), 1, 2);
      const nlines = Math.min(9, Math.round(S.hgt / 22));
      cx.fillStyle = 'rgba(232,244,255,0.5)';
      for (let i = 0; i < nlines; i++) {
        const off = ((T * 190 + i * 37) % 70);
        const lx = px + (i % 2 ? 1 : -1) * (11 + (i * 5) % 22);
        cx.fillRect(lx, Math.round(py + 6 + off - 24), 1, 5);
      }
      // apex burst of white behind the ski
      if (S.trickFlash > 0) {
        cx.globalAlpha = clamp(S.trickFlash * 3, 0, 0.8);
        cx.fillStyle = FW;
        for (let i = 0; i < 12; i++) {
          const a3 = i / 12 * TAU + T;
          const rr3 = 20 + (0.22 - S.trickFlash) * 150;
          cx.fillRect(Math.round(px + Math.cos(a3) * rr3), Math.round(py + Math.sin(a3) * rr3), 2, 2);
        }
        cx.globalAlpha = 1;
      }
    }
  } else if (S.wipeT <= 0) {
    cx.fillStyle = 'rgba(232,244,255,0.85)';
    const fw = 8 + Math.min(5, S.spd / 60);
    for (let i = 0; i < fw; i++) cx.fillRect(px - fw / 2 + i, base + 12 + ((i + Math.floor(T * 18)) % 2), 1, 1);
    cx.fillStyle = 'rgba(232,244,255,0.5)';
    cx.fillRect(px - 11, base + 14, 4, 1); cx.fillRect(px + 8, base + 14, 4, 1);
    // jet prop-wash — churned water straight off the nozzle
    cx.fillStyle = 'rgba(232,244,255,0.4)';
    for (let i = 1; i <= 6; i++) {
      const wob2 = Math.round(Math.sin(T * 14 + i * 1.7) * 1);
      cx.fillRect(px - 1 + wob2, base + 13 + i * 4, 2, 2);
    }
  }
  cx.save();
  cx.translate(px, py);
  if (S.wipeT > 0) {
    cx.rotate(S.wipeT * 9);
    cx.globalAlpha = 0.9;
    cx.scale(1.5, 1.5);
    cx.drawImage(sprSki, -7, -13);
    cx.globalAlpha = 1;
    cx.restore();
    return;
  }
  const scale = (S.air ? 1 + Math.min(0.5, S.hgt / 190) : 1) * 1.5;
  cx.scale(scale, scale);
  if (S.boostT > 0 && !S.air) cx.scale(1, 0.94); // crouched tuck under boost
  if (S.spin !== 0) cx.rotate(S.spin);
  const paint = S.pw.paint;
  let img = paint >= 0 ? PAINT_SPR[paint] : (S.celebT > 0 && !S.air ? sprSkiCele : sprSki);
  // the rider's POSE, driven by which trick is running
  const pose = S.trick && TRICKS[S.trick.type] && TRICKS[S.trick.type].pose;
  let oy = -13;
  if (pose && paint < 0) {
    if (pose === 'super') { img = sprSkiSuper; }
    else if (pose === 'tuck') { img = sprSkiTuck; }
    else if (pose === 'oneh') { img = sprSkiOneHand; }
    else if (pose === 'nac')  { img = sprSkiNac; }
  }
  if (S.pitch !== 0) {
    const c = Math.cos(S.pitch);
    const syScale = Math.max(0.18, Math.abs(c));
    if (c < 0) img = paint >= 0 ? PAINT_BELLY[paint] : sprSkiBelly;
    cx.scale(1, syScale);
  }
  // BARREL ROLL turns on the long axis, so it squashes in X — a flip squashes in Y.
  // Using the same axis for both made the two tricks look identical.
  if (S.roll) {
    const cr = Math.cos(S.roll);
    if (cr < 0) img = paint >= 0 ? PAINT_BELLY[paint] : sprSkiBelly;
    cx.scale(Math.max(0.16, Math.abs(cr)), 1);
  }
  // the superman throws the rider out behind the ski
  if (S.throwOut > 0.02 && img === sprSkiSuper) cx.translate(0, S.throwOut * 3);
  // Keep the key light WORLD-fixed: the sprite spins under it, so the highlight
  // travels across the hull instead of being painted on. Roll and pitch sweep it
  // too, which is what sells the ski as a solid turning in space.
  {
    let la = LIGHT_A0 - S.spin - (S.air ? 0 : S.bank * 0.26);
    if (S.roll)  la -= Math.sin(S.roll) * 1.15;
    if (S.pitch) la += Math.sin(S.pitch) * 0.85;
    img = lit(img, la);
  }
  if (!S.air && S.pitch === 0 && S.spin === 0) {
    cx.rotate(S.bank * 0.26); // visibly lean the ski into the turn
    const lean = Math.round(S.bank * 3);
    if (lean !== 0) {
      for (let row = 0; row < 26; row++) {
        const off = Math.round(lean * (row - 13) / 13);
        cx.drawImage(img, 0, row, 15, 1, -7 - off, -13 + row, 15, 1);
      }
    } else cx.drawImage(img, -7, oy);
  } else {
    cx.drawImage(img, -7, oy);
  }
  cx.restore();
  if (S.boostT > 0 && !S.air) {
    cx.fillStyle = Math.floor(T * 20) % 2 === 0 ? OR : MG;
    cx.fillRect(px - 3, py + 19, 6, 4);
    cx.fillStyle = YL; cx.fillRect(px - 1, py + 19, 3, 3);
  }
}

// columns of water thrown up where something big breaks the surface.
// Drawn after the shark so the spray reads in front of the body.
function drawPlumes() {
  for (const pl of S.plumes) {
    const p = pl.t / pl.life;
    const [cx2, cy2] = w2s(pl.wx - S.wx, pl.wy - S.wy);
    if (cx2 < -60 || cx2 > W + 60 || cy2 < 60 || cy2 > H + 60) continue;
    const rise = Math.sin(Math.min(1, p * 1.35) * Math.PI * 0.72);
    const h = pl.size * 1.6 * rise;
    cx.globalAlpha = clamp(1 - p * 1.05, 0, 1);
    // central column, jagged at the crest
    const cw = Math.max(2, Math.round(pl.size * 0.3 * (1 - p * 0.5)));
    for (let y = 0; y < h; y++) {
      const t2 = y / Math.max(1, h);
      const w2 = Math.max(1, Math.round(cw * (1 - t2 * 0.7)));
      const jag = Math.round(Math.sin(y * 0.9 + pl.wx) * 1.3);
      cx.fillStyle = t2 > 0.7 ? CY : FW;
      cx.fillRect(Math.round(cx2 - w2 / 2 + jag), Math.round(cy2 - y), w2, 1);
    }
    // side jets fanning out from the base
    for (let s2 = -1; s2 <= 1; s2 += 2) {
      const n = Math.round(pl.size * 0.55);
      for (let i = 0; i < n; i++) {
        const t2 = i / n;
        const jx = cx2 + s2 * t2 * pl.size * 1.2;
        const jy = cy2 - Math.sin(t2 * Math.PI) * h * 0.55;
        cx.fillStyle = i % 3 === 0 ? CY : FW;
        cx.fillRect(Math.round(jx), Math.round(jy), 2, 1);
      }
    }
    cx.globalAlpha = 1;
  }
}
// ---------- the feast: it takes a boat apart where you can see it ----------
function startFeast(o, kind, label) {
  S.feast = {
    t: 0, dur: 2.6, wx: o.wx, wy: o.wy,
    ang: Math.atan2(o.wx - S.wx, -(o.wy - S.wy)) + Math.PI,   // it comes up facing you
    kind, label, thrashed: 0
  };
  S.shark.stun = 2.6;
  S.slow = 1.1;
  S.shake = Math.max(S.shake, 7);
  S.flash = 0.26; S.flashCol = MG;
  splashCrown(o.wx, o.wy, 34, 150);
  plume(o.wx, o.wy, 26);
  SFX.roar(); SFX.chomp();
  banner(label, MG, 2.6, 'THE SHARK TOOK THEM');
  S.score += 3000;
}
function drawFeast() {
  const F = S.feast;
  if (!F) return;
  const p = clamp(F.t / F.dur, 0, 1);
  const [bx0, by0] = w2s(F.wx - S.wx, F.wy - S.wy);
  const bx = Math.round(bx0), by = Math.round(by0);
  let rise, roll, scale;
  if (p < 0.22) {                       // erupting, prey clamped in the jaws
    const q = p / 0.22;
    rise = q * 52; roll = -0.5 + q * 0.35; scale = 1.4 + q * 0.5;
  } else if (p < 0.66) {                // the death roll
    const q = (p - 0.22) / 0.44;
    rise = 52 - q * 8;
    roll = -0.15 + Math.sin(q * Math.PI * 7) * 0.5;
    scale = 1.9;
    if (Math.random() < 0.55) {
      part(F.wx + rnd(-16, 16), F.wy + rnd(-16, 16), rnd(-70, 70), rnd(-70, 70),
           rise * 0.7, rnd(20, 70), 210, rnd(0.3, 0.7),
           Math.random() < 0.5 ? FW : (F.kind === 'military' ? '#8aff5a' : '#39b6ff'), 2);
    }
    if (F.thrashed < Math.floor(q * 4)) { F.thrashed++; SFX.snap(); S.shake = Math.max(S.shake, 4); }
  } else {                              // dragged under
    const q = (p - 0.66) / 0.34;
    rise = 44 * (1 - q * q); roll = -0.15 + q * 1.5; scale = 1.9 - q * 0.5;
    if (q > 0.55 && !F.sunk) {
      F.sunk = true;
      splashCrown(F.wx, F.wy, 30, 140);
      plume(F.wx, F.wy, 20);
      SFX.barraSplash();
      for (let i = 0; i < 10; i++)
        S.debris.push({ wx: F.wx + rnd(-14, 14), wy: F.wy + rnd(-14, 14), t: 0,
                        col: Math.random() < 0.5 ? '#2a323c' : (F.kind === 'military' ? '#4a5638' : '#dfe8f0') });
    }
  }
  // The jaw sits at local (+24,-7) on sprLeapBig. Draw the victim FIRST at that
  // point so the shark's head covers half of it — that is what reads as "inside
  // the mouth" rather than "stuck to the side".
  const held = F.kind === 'military' ? sprMilitary : F.kind === 'raider' ? sprRaider : F.kind === 'heli' ? sprHeli : sprPolice;
  const chomp = p > 0.22 && p < 0.66 && Math.floor(p * 34) % 2 === 0;   // jaws working
  const gnaw = chomp ? 2 : 0;
  cx.save();
  cx.translate(bx, Math.round(by - rise));
  cx.rotate(F.ang - S.h + roll);
  cx.scale(scale, scale);
  // victim, crosswise, sunk into the mouth
  cx.save();
  cx.translate(24 - gnaw, -7);
  cx.rotate(1.45 + Math.sin(p * 40) * 0.12);
  cx.globalAlpha = p > 0.66 ? clamp(1 - (p - 0.66) / 0.28, 0, 1) : 1;
  cx.drawImage(held, -5, -14, 11, 26);
  cx.globalAlpha = 1;
  cx.restore();
  // shark over the top — its head hides the middle of the prey
  dShark(leapSpr(), -38, -25);
  // teeth closing over what it has hold of
  if (chomp) {
    cx.fillStyle = '#ffffff';
    for (let i = 0; i < 7; i++) cx.fillRect(20 + i * 2, -12 + (i % 2), 2, 2);
    cx.fillStyle = '#8c1734';
    cx.fillRect(20, -8, 13, 3);
  }
  cx.restore();
  // gouts of spray and wreck each time the jaws work
  if (chomp && Math.random() < 0.6) {
    const jx = bx + Math.cos(F.ang - S.h) * 22 * scale, jy = by - rise + Math.sin(F.ang - S.h) * 22 * scale;

          const [swx, swy] = w2s(K.wx + fx2 * off + px2 * (i * 2.4) - S.wx, K.wy + fy2 * off + py2 * (i * 2.4) - S.wy);
          cx.globalAlpha = 0.55 - Math.abs(i) * 0.05;
          cx.fillRect(Math.round(swx), Math.round(swy), 2, 1);
        }
        cx.globalAlpha = 1;
        // the mass under the surface, lying along the lane
        cx.save();
        cx.translate(sx, sy + 4);
        cx.rotate(wrapPi(laneAng - S.h));
        sharkShadowK(0, 0, 9, 30, 0.36);
        cx.restore();
        // the tail tip cuts the surface a body-length behind the dorsal
        const [tx3, ty3] = w2s(K.wx + bx2 * 26 - S.wx, K.wy + by2 * 26 - S.wy);
        cx.globalAlpha = 0.85;
        dShark(sprFin, Math.round(tx3) - 5, Math.round(ty3) - 8 + Math.round(Math.sin(T * 9)), 11, 12);
        cx.globalAlpha = 1;
        // THE fin: upright, oversized, rocking on the swell
        cx.save();
        cx.translate(sx, sy + Math.round(Math.sin(T * 12) * 1.5));
        cx.rotate(Math.sin(T * 7) * 0.09);
        dShark(sprFin, -13, -23, 26, 28);
        cx.restore();
        // water breaking off the leading edge
        cx.fillStyle = FW;
        for (let i = 0; i < 5; i++) cx.fillRect(sx + ri(-9, 9), sy - ri(0, 7), 2, 1);
        if (Math.floor(T * 10) % 2 === 0)
          drawText('!', sx, sy - 38, { sc: 2, col: MG, align: 'c', out: '#05070c' });
      } else {
        // THE CORKSCREW: out flat along the lane, rolling through the bite, over
        // and gone. Nothing here is shared with the pounce.
        const pr = clamp(1 - C.t / 0.66, 0, 1);
        const arc = C.arc || 0;
        const riseAng = C.rise === undefined ? laneAng : C.rise;
        const fi = Math.min(ROLL_F.length - 1, Math.floor(pr * ROLL_F.length));
        // the surface tears open under it while it is still coming out
        if (pr < 0.62) {
          const tear = 1 - pr / 0.62;
          cx.fillStyle = FW;
          for (let i = -18; i <= 18; i++) {
            const [gx, gy] = w2s(K.wx + Math.cos(riseAng) * i * 2.6 - S.wx, K.wy + Math.sin(riseAng) * i * 2.6 - S.wy);
            cx.globalAlpha = (0.8 - Math.abs(i) * 0.032) * tear;
            const hh = Math.max(1, Math.round((9 - Math.abs(i) * 0.4) * tear));
            cx.fillRect(Math.round(gx), Math.round(gy) + 4 - hh, 2, hh + 2);
          }
          cx.globalAlpha = 1;

          for (let i = -20; i <= 20; i++) {
            const [gx, gy] = w2s(K.wx + Math.cos(riseAng) * i * 2.6 - S.wx, K.wy + Math.sin(riseAng) * i * 2.6 - S.wy);
            const j = Math.round(Math.sin(i * 1.1 + T * 11) * 2);
            cx.fillStyle = (i + j) % 3 === 0 ? CY : FW;
            cx.globalAlpha = 0.85 * tear;
            cx.fillRect(Math.round(gx), Math.round(gy) + 4 + j, 2, 2);
          }
          cx.globalAlpha = 1;
        }
        // one big burst as it breaks through, and another as it goes back in

        if (!C.splashDown && pr > 0.88) { C.splashDown = true; sharkSplash(K.wx, K.wy, 1.9); }
        // how much of the head-on face is showing — the rolling body yields to it,
        // otherwise you see both and the silhouette turns to mush
        const ddm0 = Math.hypot(S.wx - K.wx, S.wy - K.wy);
        // wide enough that escaping still earns you the face on the way past — at 46
        // you only ever saw it if you were already dead, which is no threat at all
        // This was gated on menace() > 0.18 — so the open jaws only ever appeared from
        // LEVEL 6, and only inside 78 units. Most sweeps showed a rolling body and
        // nothing else, which is why it did not read as coming to eat you. The mouth
        // is the whole point of the move: it shows on every sweep now, from further
        // out, and it holds for most of the pass.
        // A CLEAN CROSSFADE, not a blend. Far out you see the rolling body — whose own
        // side profile already has an open toothy mouth — and up close it hands over
        // completely to the head-on maw. Letting both sit at half alpha in the middle
        // is what turns the silhouette to mush, which is what the old level-6 gate was
        // really protecting against; the gate was the wrong fix.
        const fRaw = clamp((130 - ddm0) / 60, 0, 1);
        const faceOn = (pr > 0.14 && pr < 0.82) ? fRaw * fRaw * (3 - 2 * fRaw) : 0;
        sharkShadowK(sx, sy + 4, Math.round(12 + 16 * (arc / 46)), 6, 0.35);
        // The body stays SOLID. Fading it against a fading maw was a crossfade between
        // two overlapping sprites, which is transparent-shark mush no matter how the
        // curve is shaped — you could read the island through its teeth. The maw is
        // simply drawn opaque on top and occludes it instead.
        cx.globalAlpha = 1;
        cx.save();
        cx.translate(sx, Math.round(sy - arc));
        const flip = Math.cos(wrapPi(riseAng - S.h) - Math.PI / 2) < 0;
        // shallow climb then a hard nose-down re-entry — a flatter line than the pounce
        cx.rotate(wrapPi(riseAng - S.h) - Math.PI / 2 + (flip ? -1 : 1) * lerp(-0.22, 0.62, pr));
        if (flip) cx.scale(1, -1);
        const ls = (1.7 + Math.sin(pr * Math.PI) * 0.95) * (1 + menace() * 0.34);
        cx.scale(ls, ls);
        dShark(rollAt(fi), -40, -24);
        cx.restore();
        cx.globalAlpha = 1;
        // water sheeting off the roll, thrown off the low side
        if (Math.random() < 0.9)
          part(K.wx + rnd(-14, 14), K.wy + rnd(-14, 14), rnd(-40, 40), rnd(-40, 40), arc * 0.75, rnd(-30, 10), 150, rnd(0.3, 0.55), FW, Math.random() < 0.4 ? 2 : 1);
        // from level 6 it stops passing you and puts its face in yours: the head-on
        // maw for a beat at the closest point, scaling into the lens
        if (faceOn > 0.42) {          // hand over to the face only once it dominates
          const bite = faceOn;
          const mf = mawAt(Math.min(2, Math.floor(pr * 3)));   // gape opens with the pass
          cx.globalAlpha = 1;                                  // opaque, always
          cx.save();
          cx.translate(sx, Math.round(sy - arc * 0.5));
          const ms = (1.15 + bite * 2.6) * (1 + menace() * 0.3);   // size carries the distance
          cx.scale(ms, ms);
          dShark(mf, -35, -39);
          cx.restore();
          cx.globalAlpha = 1;
          S.shake = Math.max(S.shake, 3 + bite * 4);
          if (!C.mawFx && bite > 0.55) { C.mawFx = true; SFX.roar(); SFX.growl(); }
        }
        // the jaws close: one frame of white where the teeth meet
        if (fi === 4 && !C.snapFx) {
          C.snapFx = true;
          S.flash = Math.max(S.flash, 0.14); S.flashCol = FW;
          S.shake = Math.max(S.shake, 5);
          splashCrown(K.wx, K.wy, 16, 90);
        }
        S.shake = Math.max(S.shake, 1 + (arc / 46) * 2.2);
      }
      return;
    }
    if (C.phase === 'tele' && C.mode === 'maw') {
      // the ONLY tell: a dark mass swelling under the water where it will come up
      const [mx, my] = w2s(C.aimX - S.wx, C.aimY - S.wy);
      const grow = clamp(1 - C.t / 0.9, 0, 1);
      const rw = 10 + grow * 26;
      cx.globalAlpha = 0.2 + grow * 0.42;
      cx.fillStyle = '#04121f';
      for (let dy = -Math.round(rw * 0.62); dy <= Math.round(rw * 0.62); dy++) {
        const hw = Math.round(rw * Math.sqrt(Math.max(0, 1 - Math.pow(dy / (rw * 0.62), 2))));
        cx.fillRect(Math.round(mx) - hw, Math.round(my) + dy, hw * 2, 1);
      }
      cx.globalAlpha = 1;
      if (Math.floor(T * 12) % 2 === 0) {          // water pulled inward over the top
        cx.fillStyle = C.locked ? '#ff2030' : 'rgba(232,244,255,0.55)';
        for (let i = 0; i < 12; i++) {
          const a5 = i / 12 * TAU, rr5 = rw * (1.25 - grow * 0.3);
          cx.fillRect(Math.round(mx + Math.cos(a5) * rr5), Math.round(my + Math.sin(a5) * rr5 * 0.62), 2, 1);
        }
      }
      if (C.locked && Math.floor(T * 10) % 2 === 0)
        drawText('!', Math.round(mx), Math.round(my) - 28, { sc: 3, col: '#ff2030', align: 'c', out: '#05070c' });
      return;
    }
    if (C.phase === 'maw') {

      // is that it comes THROUGH the surface. So: clip everything below the waterline
      // so the head is genuinely half-submerged as it climbs, sheet water down the
      // parts that have just cleared, and blow a ring of displaced water out from the
      // base. The head also tips back as it rises, so you end up looking down its throat.
      const [mx0, my0] = w2s(C.aimX - S.wx, C.aimY - S.wy);
      const mx = Math.round(mx0), my = Math.round(my0);
      const up = clamp(1 - C.t / 0.52, 0, 1);
      const ease = Math.pow(up, 0.62);                 // fast out of the water, then hangs
      const sc2 = 0.5 + ease * 1.15;
      const headY = my + 30 - ease * 74;

      // the water it is shoving out of the way, before anything breaks the surface
      cx.globalAlpha = clamp(0.55 - up * 0.25, 0, 0.55);
      cx.fillStyle = '#0a2337';
      for (let i = 0; i < 20; i++) {
        const a6 = i / 20 * TAU, rr6 = 16 + ease * 40;
        cx.fillRect(Math.round(mx + Math.cos(a6) * rr6), Math.round(my + Math.sin(a6) * rr6 * 0.5), 3, 2);
      }
      cx.globalAlpha = 1;
      sharkShadowK(mx, my + 6, 14 + up * 14, 6, 0.4);

      // the animal, clipped to the surface so it EMERGES
      cx.save();
      cx.beginPath(); cx.rect(0, 0, W, my + 8); cx.clip();
      cx.translate(mx, headY);
      cx.rotate(Math.sin(ease * Math.PI) * 0.05);
      cx.scale(sc2, sc2 * (0.86 + ease * 0.14));       // foreshortened, opening out
      const mfr = mawAt(Math.min(MAW_F.length - 1, Math.floor(ease * MAW_F.length)));
      dShark(mfr, -35, -39);
      cx.restore();

      // water sheeting off the skin that has just cleared the surface
      cx.save();
      cx.beginPath(); cx.rect(0, 0, W, my + 8); cx.clip();
      cx.fillStyle = 'rgba(232,244,255,0.55)';
      for (let i = 0; i < 16; i++) {
        const sxo = mx - 26 + ((i * 37) % 53);
        const len = 5 + ((i * 13) % 11) + up * 8;
        const top = headY - 20 + ((i * 29) % 34) + up * 16;
        if (Math.random() < 0.75) cx.fillRect(Math.round(sxo), Math.round(top), 1, Math.round(len));
      }
      cx.restore();

      // The clip left a scissor-straight edge across the jaw. Water does not cut like
      // that — it breaks around whatever is coming through it, so the surface gets a
      // jagged foam line the width of the head.
      {
        const halfW = Math.round(20 + ease * 26);
        for (let x2 = -halfW; x2 <= halfW; x2++) {
          const edge = Math.abs(x2) / halfW;
          const j = Math.round(Math.sin(x2 * 0.9 + T * 9) * 2 + Math.sin(x2 * 2.3) * 1.4);
          const h2 = Math.round((1 - edge * edge) * (3 + ease * 4)) + 1;
          cx.fillStyle = (x2 + j) % 3 === 0 ? CY : FW;
          cx.fillRect(mx + x2, my + 4 + j - h2, 1, h2 + 2);
        }
      }
      // the collar of spray thrown up round the base
      cx.fillStyle = FW;
      for (let i = 0; i < 22; i++) {
        const a7 = (i / 22) * TAU;
        const rr7 = 10 + ease * 34 + Math.sin(i * 2.3) * 4;
        const hh = Math.round(Math.sin(Math.min(1, ease * 1.4) * Math.PI) * (8 + (i % 5) * 3));
        cx.fillRect(Math.round(mx + Math.cos(a7) * rr7), Math.round(my + Math.sin(a7) * rr7 * 0.45) - hh, 2, hh + 1);
      }
      if (Math.random() < 0.7)
        part(C.aimX + rnd(-22, 22), C.aimY + rnd(-22, 22), rnd(-80, 80), rnd(-80, 80), up * 46, rnd(-30, 60), 150, 0.45, FW, 2);
      return;
    }
    if (C.phase === 'tele' && C.mode === 'sweep') {
      // warn where the lane will be before it launches
      const [ax1, ay1] = w2s(C.sx0 - S.wx, C.sy0 - S.wy);
      const [ax2, ay2] = w2s(C.ex - S.wx, C.ey - S.wy);
      const hot = Math.floor(T * 10) % 2 === 0;
      cx.globalAlpha = 0.55;
      cx.fillStyle = hot ? MG : YL;
      for (let i = 0; i <= 30; i++) {
        if (i % 2 === 0) continue;
        cx.fillRect(Math.round(lerp(ax1, ax2, i / 30)), Math.round(lerp(ay1, ay2, i / 30)), 3, 2);
      }
      cx.globalAlpha = 1;
      if (hot) drawText('SWEEP', Math.round((ax1 + ax2) / 2), Math.round((ay1 + ay2) / 2) - 18,
                        { sc: 2, col: MG, align: 'c', out: '#05070c' });
      sharkShadowK(sx, sy + 5, 18, 6, 0.4);
      cx.save();
      cx.translate(sx, sy);
      cx.rotate(Math.atan2(S.wx - K.wx, -(S.wy - K.wy)) - S.h);
      cx.scale(1.4, 1.4);
      dShark(sprGape, -13, -9);
      cx.restore();
      return;
    }
    if (C.phase === 'tele') {
      sharkShadowK(sx, sy + 5, 18, 6, 0.4);
      cx.save();
      cx.translate(sx, sy);
      cx.rotate(Math.atan2(S.wx - K.wx, -(S.wy - K.wy)) - S.h);
      const gs = (0.7 + 0.3 * (1 - C.t / 0.9)) * 1.6;
      cx.scale(gs, gs);
      dShark(sprGape, -13, -9);
      cx.restore();
      if (Math.floor(T * 10) % 2 === 0) {
        cx.fillStyle = '#ff2030';
        cx.fillRect(sx - 5, sy - 2, 2, 2); cx.fillRect(sx + 4, sy - 2, 2, 2);
      }
      cx.globalAlpha = 0.55;
      cx.fillStyle = MG;
      for (let i = 1; i <= 6; i++) {
        const lx = Math.round(lerp(sx, ax, i / 7)), ly = Math.round(lerp(sy, ay, i / 7));
        cx.fillRect(lx, ly, 2, 2);
      }
      cx.globalAlpha = 1;
    } else if (C.phase === 'dive') {
      sharkShadowK(sx, sy + 4, 17, 6, 0.42);
      if (Math.random() < 0.4) { cx.fillStyle = 'rgba(232,244,255,0.45)'; cx.fillRect(sx + ri(-9, 9), sy + ri(-3, 3), 3, 1); }
    } else if (C.phase === 'leap') {
      const pr2 = clamp(1 - C.t / 0.6, 0, 1);
      const arc = Math.sin(pr2 * Math.PI);
      const hgt2 = arc * 62;
      // landing shadow tightens on the ring
      sharkShadowK(ax, ay + 3, Math.round(9 + 16 * pr2), Math.round(4 + 6 * pr2), 0.25 + 0.3 * pr2);
      // airborne body — rotated along its flight line, arcing nose-up then nose-down
      const [bx0, by0] = w2s(C.sx0 - S.wx, C.sy0 - S.wy);
      const dirA = Math.atan2(ay - by0, ax - bx0);
      const flip = Math.cos(dirA) < 0;
      // water peeling off it in the air — it just came out of the sea, it should be wet
      if (pr2 < 0.55) {
        cx.fillStyle = 'rgba(232,244,255,0.5)';
        for (let i = 0; i < 10; i++) {
          const t8 = i / 10;
          cx.globalAlpha = (0.55 - pr2) * (1 - t8);
          cx.fillRect(Math.round(sx - 22 + i * 5 + rnd(-2, 2)),
                      Math.round(sy - hgt2 + 6 + t8 * (14 + hgt2 * 0.3)), 1, 3);
        }
        cx.globalAlpha = 1;
      }
      cx.save();
      cx.translate(sx, Math.round(sy - hgt2));
      cx.rotate(dirA + (flip ? -1 : 1) * lerp(-0.4, 0.55, pr2));
      if (flip) cx.scale(1, -1);
      const ls = (1.0 + arc * 0.72) * (1 + menace() * 0.34);   // and bigger again from level 6
      cx.scale(ls, ls);
      dShark(leapSpr(), -38, -25);
      cx.restore();
      // water sheeting off a body that big
      for (let k = 0; k < 2; k++)
        if (Math.random() < 0.8) part(K.wx + rnd(-16, 16), K.wy + rnd(-16, 16), rnd(-30, 30), rnd(-30, 30), hgt2 * 0.8, -20, 140, 0.45, FW, Math.random() < 0.4 ? 2 : 1);
      S.shake = Math.max(S.shake, 1 + arc * 2);
    } else { // dash
      // A straight charge with just a head on it read as a sprite being slid across the
      // screen. It now PORPOISES — breaking the surface in a rhythm — and shoves a V of
      // white water ahead of it, so you can see how hard it is coming.
      const dAng = Math.atan2(C.dx, -C.dy);
      const por = Math.sin((C.dashDur - C.t) * 15);      // up over the surface, then under
      const rise = Math.max(0, por) * 7;
      const nX = Math.cos(dAng - S.h), nY = Math.sin(dAng - S.h);
      const fX = Math.sin(dAng - S.h), fY = -Math.cos(dAng - S.h);
      cx.fillStyle = 'rgba(232,244,255,0.6)';
      for (let i = 0; i < 14; i++) {                     // bow wave, opening out ahead
        const t9 = i / 14, ah = 8 + t9 * 30, sp = 3 + t9 * 13;
        cx.globalAlpha = (1 - t9) * 0.6;
        cx.fillRect(Math.round(sx + fX * ah + nX * sp), Math.round(sy + fY * ah + nY * sp), 2, 1);
        cx.fillRect(Math.round(sx + fX * ah - nX * sp), Math.round(sy + fY * ah - nY * sp), 2, 1);
      }
      cx.globalAlpha = 1;
      for (let i = 1; i < 10; i++) {                     // churn behind
        cx.globalAlpha = 0.45 - i * 0.045;
        cx.fillRect(Math.round(sx - fX * i * 8 + rnd(-3, 3)), Math.round(sy - fY * i * 8 + rnd(-2, 2)), 2, 2);
      }
      cx.globalAlpha = 1;
      sharkShadowK(sx, sy + 5 + rise * 0.5, 18, 6, 0.4);
      cx.save();
      cx.translate(sx, sy - rise);
      cx.rotate(dAng - S.h);
      cx.scale(1.6, 1.6);
      // on the up-beat the whole head clears and you see the gape; on the down-beat
      // only the dorsal shows
      if (por > -0.15) dShark(sprGape, -13, -9);
      else dShark(sprFin, -13, -21, 27, 29);
      cx.restore();
      if (por > 0.92 && !C.porW) { C.porW = 1; sharkSplash(K.wx, K.wy, 0.7); }
      if (por < 0) C.porW = 0;
    }
  } else if (K.st === 'circle') {
    const [sx0, sy0] = w2s(K.wx - S.wx, K.wy - S.wy);
    const sx = Math.round(sx0), sy = Math.round(sy0);
    sharkShadowK(sx, sy + 5, 15, 5, 0.35);
    const ta = K.ca - 0.55;
    const [tx2, ty2] = w2s(Math.sin(ta) * 34, -Math.cos(ta) * 34);
    dShark(sprFin, Math.round(tx2) - 7, Math.round(ty2) - 10, 15, 16);
    cx.fillStyle = 'rgba(232,244,255,0.5)';
    for (let i = 1; i < 5; i++) cx.fillRect(sx - i, sy + 9 + i * 2, i * 2, 1);
    dShark(sprFin, sx - 13, sy - 21 + Math.round(Math.sin(T * 7) * 1.5), 27, 29);
  } else if (K.st === 'lunge') {
    const p = 1 - K.lungeT / 0.85;
    const [sx0, sy0] = w2s(K.lwx - S.wx, K.lwy - S.wy);
    const sx = Math.round(sx0), sy = Math.round(sy0);
    cx.globalAlpha = 0.28 + p * 0.3;
    cx.fillStyle = '#03101e';
    const rw = Math.round(10 + p * 16), rh = Math.round(4 + p * 7);
    for (let dy = -rh; dy <= rh; dy++) {
      const hw = Math.round(rw * Math.sqrt(Math.max(0, 1 - (dy / rh) * (dy / rh))));
      cx.fillRect(sx - hw, sy + 6 + dy, hw * 2, 1);
    }
    cx.globalAlpha = 1;
    if (Math.floor(T * 8) % 2 === 0) drawText('!', sx, sy - 34, { sc: 3, col: MG, align: 'c', out: '#05070c' });
  } else if (K.st === 'breach' || K.st === 'eat') {
    const bt = K.st === 'breach' ? (0.55 - K.lungeT) : 0.4;
    const rise = K.st === 'eat' ? 30 : Math.round(Math.sin(clamp(bt / 0.5, 0, 1) * Math.PI) * 34);
    const [jx0, jy0] = w2s(K.lwx - S.wx, K.lwy - S.wy);
    const jx = Math.round(jx0), jy = Math.round(jy0 + 12 - rise);
    const snapped = bt > 0.4 || (K.st === 'eat' && S.deathJaw && S.deathJaw.t > 0.35);
    const js = 1.9;                                // jaws that dwarf the ski
    cx.save();
    cx.translate(jx, jy);
    cx.scale(js, js);
    dShark(snapped ? sprJawShut : sprJaw, -20, -32);
    cx.restore();
    if (bt < 0.2) splashCrown(K.lwx, K.lwy, 2, 90);
  }
}

// ---------- HUD ----------
function drawSpeaker(x, y, on) {
  cx.fillStyle = on ? CY : '#4a5568';
  cx.fillRect(x, y + 2, 2, 3);
  cx.fillRect(x + 2, y + 1, 1, 5);
  cx.fillRect(x + 3, y, 2, 7);
  if (on) {
    cx.fillRect(x + 6, y + 2, 1, 3);
    cx.fillRect(x + 7, y + 1, 1, 1); cx.fillRect(x + 8, y + 2, 1, 3); cx.fillRect(x + 7, y + 5, 1, 1);
  } else {
    cx.fillStyle = MG;
    cx.fillRect(x + 6, y + 1, 1, 1); cx.fillRect(x + 7, y + 2, 1, 1); cx.fillRect(x + 8, y + 3, 1, 1);
    cx.fillRect(x + 7, y + 4, 1, 1); cx.fillRect(x + 6, y + 5, 1, 1);
    cx.fillRect(x + 8, y + 1, 1, 1); cx.fillRect(x + 6, y + 3, 1, 1); cx.fillRect(x + 8, y + 5, 1, 1);
  }
}
