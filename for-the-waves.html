  const lx = Math.sin(ang + 2.5), ly = -Math.cos(ang + 2.5);
  const rx = Math.sin(ang - 2.5), ry = -Math.cos(ang - 2.5);
  const head = len > 4 ? 4 : 3;
  for (let pass = th > 1 ? 0 : 1; pass < 2; pass++) {
    const s = pass ? th : th + 2, o = Math.floor(s / 2);
    cx.fillStyle = pass ? col : '#05070c';
    for (let i = -len; i <= len; i++) cx.fillRect(Math.round(x + dx * i) - o, Math.round(y + dy * i) - o, s, s);
    for (let i = 1; i <= head; i++) {
      cx.fillRect(Math.round(px2 + lx * i) - o, Math.round(py2 + ly * i) - o, s, s);
      cx.fillRect(Math.round(px2 + rx * i) - o, Math.round(py2 + ry * i) - o, s, s);
    }
  }
}
// icons for each loot type, drawn from primitives so they stay crisp
function drawLootIcon(kind, x, y, s, col) {
  const px = (a, b, w, h, c) => { cx.fillStyle = c; cx.fillRect(Math.round(x + a * s), Math.round(y + b * s), Math.max(1, w * s), Math.max(1, h * s)); };
  if (kind === 'turbo') {                       // lightning bolt over a flame
    px(-1, -5, 3, 2, YL); px(-2, -3, 3, 2, YL); px(-3, -1, 5, 2, OR);
    px(-1, 1, 3, 2, YL); px(0, 3, 3, 2, YL); px(-1, 5, 2, 2, OR);
    px(-5, 3, 1, 3, OR); px(4, 3, 1, 3, OR);
  } else if (kind === 'paint') {                // paint can with a splash
    px(-4, -4, 8, 2, FW); px(-4, -2, 8, 7, col); px(-4, 5, 8, 1, '#05070c');
    px(-2, 0, 2, 2, FW); px(1, 2, 2, 2, FW);
    px(5, -5, 2, 2, MG); px(-7, -3, 2, 2, CY);
  } else if (kind === 'engine') {               // piston block with exhaust
    px(-4, -4, 8, 8, '#3c4b5c'); px(-3, -3, 6, 2, CY);
    px(-3, 0, 2, 3, '#8fa8bd'); px(1, 0, 2, 3, '#8fa8bd');
    px(4, -2, 2, 2, OR); px(6, -1, 2, 2, YL);
  } else {                                      // dolphin
    px(-5, -1, 9, 3, '#4a6a8a'); px(-6, 0, 2, 2, '#2e4a66');
    px(3, -2, 3, 2, '#4a6a8a'); px(5, -1, 2, 2, '#9fc8d8');
    px(-1, -3, 3, 2, '#2e4a66'); px(-3, 2, 4, 1, '#9fc8d8');
    px(4, -1, 1, 1, '#0b0d12');
  }
}
function drawLootReveal() {
  const L = S.loot;
  if (!L) return;
  const p = clamp(L.t / L.dur, 0, 1);
  const rise = Math.min(1, p * 3.2);
  const fade = p > 0.78 ? 1 - (p - 0.78) / 0.22 : 1;
  const [lx0, ly0] = w2s(L.wx - S.wx, L.wy - S.wy);
  const cxp = Math.round(lerp(lx0, W / 2, rise));
  const cyp = Math.round(lerp(ly0, H * 0.33, rise));
  cx.globalAlpha = fade;
  // rays of light spinning behind the prize
  const rays = 12;
  for (let i = 0; i < rays; i++) {
    const a = i / rays * TAU + T * 1.4;
    cx.fillStyle = i % 2 ? L.col : FW;
    for (let r = 14; r < 30 + Math.sin(T * 6) * 5; r += 3)
      cx.fillRect(Math.round(cxp + Math.cos(a) * r), Math.round(cyp + Math.sin(a) * r), 2, 2);
  }
  const s = 1 + Math.sin(clamp(p * 4, 0, Math.PI)) * 0.6;
  drawLootIcon(L.kind, cxp, cyp, s * 1.6, L.col);
  drawText(L.name, W / 2, cyp + 26, { sc: 2, col: Math.floor(T * 8) % 2 ? L.col : FW, align: 'c', out: '#05070c' });
  if (L.sub) drawText(L.sub, W / 2, cyp + 44, { sc: 1, col: FW, align: 'c', out: '#05070c' });
  cx.globalAlpha = 1;
}
// a chunky 7x7 X with a dark rim so it reads over any sky
function drawRedX(x, y, col) {
  cx.fillStyle = '#05070c';
  for (let i = 0; i < 7; i++) { cx.fillRect(x + i, y + i - 1, 2, 3); cx.fillRect(x + 6 - i, y + i - 1, 2, 3); }
  cx.fillStyle = col;
  for (let i = 0; i < 7; i++) { cx.fillRect(x + i, y + i, 1, 1); cx.fillRect(x + 6 - i, y + i, 1, 1); }
}
function drawStar(x, y, col) {
  cx.fillStyle = '#05070c';
  cx.fillRect(x + 2, y - 1, 3, 8); cx.fillRect(x - 1, y + 1, 9, 4);
  cx.fillStyle = col;
  cx.fillRect(x + 3, y, 1, 6); cx.fillRect(x, y + 2, 7, 2);
  cx.fillRect(x + 1, y + 1, 5, 1); cx.fillRect(x + 1, y + 4, 2, 2); cx.fillRect(x + 4, y + 4, 2, 2);
}
function drawHUD(pal) {
  const top = safeTop + 6;
  drawText(fmt(S.score), W / 2, top, { sc: 2, col: FW, align: 'c', out: '#05070c' });
  if (S.trickyT > 0) drawText('TRICKY X3', W / 2, top + 16, { sc: 1, col: AG, align: 'c', out: '#05070c', wave: 1 });
  else {
    const LV = curLevel();
    const line = LV.name + ' ' + LV.act_ + '  ' + (LV.idx + 1) + '/' + MAX_LEVEL;
    drawText(line, W / 2, top + 16, { sc: 1, col: LV.act === 2 ? '#d9a0c0' : '#8ab0cc', align: 'c', out: '#05070c' });
  }

  cx.fillStyle = FW;
  cx.fillRect(12, top + 2, 2, 7); cx.fillRect(16, top + 2, 2, 7);
  drawSpeaker(W - 22, top + 2, AU.on);

  // feeding-time bar
  const K = S.shark;
  const attacking = K.st !== 'deep';
  const bw = 116, bx = W / 2 - bw / 2, by = top + 26;
  if (!attacking) {
    cx.fillStyle = '#05070c'; cx.fillRect(bx - 1, by - 1, bw + 2, 8);
    const frac = clamp(S.cycleT / curLevel().cycle, 0, 1);
    const elapsed = 1 - frac;                       // how far into the cycle
    const done = S.rings >= S.quota;
    const need = S.quota * elapsed;                 // rings you'd have on a steady pace
    const shortfall = need - S.rings;
    const behind = !done && shortfall > S.quota * 0.12;
    const dire = !done && (shortfall > S.quota * 0.3 || (S.cycleT < 40 && !done));
    cx.fillStyle = '#0e2438'; cx.fillRect(bx, by, bw, 6);
    // progress toward the quota fills the bar; the fin marks how much time is gone
    const prog = clamp(S.rings / S.quota, 0, 1);
    cx.fillStyle = done ? AG : (dire && Math.floor(T * 4) % 2 === 0 ? MG : hexLerp(YL, AG, prog));
    cx.fillRect(bx, by, Math.round(bw * prog), 6);
    const fx2 = bx + Math.round(bw * elapsed) - 3;
    cx.fillStyle = 'rgba(255,0,128,0.5)';
    cx.fillRect(bx + Math.round(bw * elapsed), by, 1, 6);
    dLit(sprFin, fx2, by - 8, 7, 8);
    drawText(mmss(S.cycleT), bx + bw, by + 9, { sc: 1, col: dire ? MG : (behind ? OR : '#9fd0e8'), align: 'r', out: '#05070c' });
    const rf = RING_F[Math.floor(T * 7) % 4];
    cx.drawImage(rf, bx - 20, by - 2, 9, 8);
    const cntCol = done ? AG : (dire ? MG : (behind ? OR : YL));
    let cnt = S.rings + '/' + S.quota;
    if (behind && !done && Math.floor(T * 2) % 2 === 0) cnt += ' -' + Math.ceil(shortfall);
    drawText(cnt, bx - 24, by + 9, { sc: 1, col: cntCol, out: '#05070c' });
  } else if (K.st !== 'eat') {
    const flash2 = Math.floor(T * 4) % 2 === 0;
    drawText('FEED IT ' + Math.max(0, K.need) + ' RINGS!', W / 2, by, { sc: 1, col: flash2 ? MG : YL, align: 'c', out: '#05070c' });
  }

  // checkpoint compass
  let cpe = null;
  for (const e of S.ents) if (e.k === 'cp' && e.idx === S.cpIdx) { cpe = e; break; }
  if (cpe) {
    const dx = cpe.wx - S.wx, dy = cpe.wy - S.wy;
    const d = Math.hypot(dx, dy);
    const del = wrapPi(bearingOf(dx, dy) - S.h);
    const ty = by + 20;
    // the baby-blue arrow got fattened (len 6, th 2) after feedback that nobody
    // noticed it pointed at the flag — the label steps left so they don't kiss
    drawText('FLAG ' + (S.cpIdx + 1) + '/8', W / 2 - 24, ty, { sc: 1, col: YL, align: 'r', out: '#05070c' });
    drawArrowGlyph(W / 2 - 12, ty + 3, del, BB, 6, 2);
    drawText(Math.round(d / 10) + 'M', W / 2 + 1, ty, { sc: 1, col: '#e8c840', out: '#05070c' });

    // optional edge marker pointing at the next flag (off by default)
    const onScreen = cpe._sx !== undefined && cpe._sx > 16 && cpe._sx < W - 16 &&
                     cpe._sy > HOR + 10 && cpe._sy < H - 30 && d < 620;
    if (OPTS.guide && !onScreen) {
      const mx = clamp(W / 2 + Math.sin(del) * (W / 2 - 22), 18, W - 18);
      const my = clamp((PY - 40) - Math.cos(del) * (H / 2 - 70), HOR + 26, H - 54);
      const pulse = 0.65 + Math.sin(T * 5) * 0.35;
      cx.globalAlpha = pulse;
      cx.fillStyle = '#05070c';
      cx.fillRect(Math.round(mx) - 11, Math.round(my) - 9, 22, 28); // taller plate for the fatter arrow
      cx.globalAlpha = 1;
      cx.drawImage(FLAG_F[Math.floor(T * 6) % 2], Math.round(mx) - 6, Math.round(my) - 8);
      drawArrowGlyph(Math.round(mx), Math.round(my) + 9, del, BB, 6, 2);
      drawText(Math.round(d / 10) + 'M', Math.round(mx), Math.round(my) + 20, { sc: 1, col: BB, align: 'c', out: '#05070c' });
    }
  }

  // minimap (north-up, top-right)
  const MR = 25, mcx = W - 8 - MR, mcy = top + 26 + MR;
  const mk = MR / 1150;
  cx.globalAlpha = 0.78;
  cx.fillStyle = '#05070c';
  for (let dy = -MR - 2; dy <= MR + 2; dy++) {
    const hw = Math.round(Math.sqrt(Math.max(0, (MR + 2) * (MR + 2) - dy * dy)));
    cx.fillRect(mcx - hw, mcy + dy, hw * 2, 1);
  }
  cx.globalAlpha = 1;
  // rim
  cx.fillStyle = 'rgba(0,245,255,0.5)';
  for (let i = 0; i < 30; i++) {
    const a = i / 30 * TAU;
    cx.fillRect(Math.round(mcx + Math.cos(a) * (MR + 2)), Math.round(mcy + Math.sin(a) * (MR + 2)), 1, 1);
  }
  const plot = (wx, wy, col, sz, clampEdge) => {
    let dx = (wx - S.wx) * mk, dy = (wy - S.wy) * mk;
    const dd = Math.hypot(dx, dy);
    if (dd > MR - 1) {
      if (!clampEdge) return;
      dx *= (MR - 1) / dd; dy *= (MR - 1) / dd;
    }
    cx.fillStyle = col;
    cx.fillRect(Math.round(mcx + dx - sz / 2), Math.round(mcy + dy - sz / 2), sz, sz);
  };
  for (const e of S.ents) {
    if (e.k === 'ring') { if (!e.taken && Math.floor((e.wx + e.wy)) % 3 === 0) plot(e.wx, e.wy, 'rgba(255,230,0,0.6)', 1, false); }
    else if (e.k === 'ramp') plot(e.wx, e.wy, e.mega ? MG : 'rgba(0,245,255,0.8)', 1, false);
    else if (e.k === 'island') plot(e.wx, e.wy, '#2a1a4e', Math.max(2, Math.round(e.r * mk * 2)), false);
    else if (e.k === 'cp') {
      const act = e.idx === S.cpIdx;
      if (!act || Math.floor(T * 3) % 2 === 0) plot(e.wx, e.wy, act ? YL : '#8a6a10', act ? 3 : 2, act);
    }
    else if (e.k === 'wreck') plot(e.wx, e.wy, '#f2b41d', 3, false);
    else if (e.k === 'plane') plot(e.wx, e.wy, '#e9eff4', 3, false);
    else if (e.k === 'sail') plot(e.wx, e.wy, FW, 1, false);
    else if (e.k === 'boat') plot(e.wx, e.wy, FW, 2, false);
    else if (e.k === 'skiboat') plot(e.wx, e.wy, CY, 2, false);
  }
  for (const n of S.npcs) plot(n.wx, n.wy, '#9fe8ff', 1, false);
  for (const g of S.gators) if (g.st !== 'bask') plot(g.wx, g.wy, AG, 2, false);
  if (S.raider && Math.floor(T * 4) % 2 === 0) plot(S.raider.wx, S.raider.wy, '#39ff8a', 3, true);
  for (const c of S.cops) plot(c.wx, c.wy, c.kind === 'heli' ? '#c8d0b8' : c.kind === 'military' ? '#8aff5a' : (Math.floor(T * 7) % 2 ? '#39b6ff' : '#ff2436'), 3, true);
  for (const w of S.wires) plot(w.wx, w.wy, '#c8d4e0', 2, false);
  for (const b of S.bombs) plot(b.wx, b.wy, OR, 2, false);
  for (const b of S.barras) if (b.st !== 'patrol') plot(b.wx, b.wy, '#94c9ad', 1, false);
  for (const e of S.ents) if (e.k === 'crate' && !e.taken && Math.floor(T * 3) % 2 === 0) plot(e.wx, e.wy, YL, 3, true);
  if ((K.st === 'attack' || K.st === 'charge' || K.st === 'circle') && Math.floor(T * 4) % 2 === 0) plot(K.wx, K.wy, MG, 3, true);
  if (K.rampage && Math.floor(T * 4) % 2 === 0) plot(K.rampage.wx, K.rampage.wy, MG, 2, false);
  // player arrow
  const pax = Math.sin(S.h), pay = -Math.cos(S.h);
  cx.fillStyle = CY;
  cx.fillRect(Math.round(mcx + pax * 3) , Math.round(mcy + pay * 3), 1, 1);
  cx.fillRect(Math.round(mcx + pax * 1.5), Math.round(mcy + pay * 1.5), 1, 1);
  cx.fillRect(Math.round(mcx), Math.round(mcy), 2, 2);
  drawText('N', mcx, mcy - MR - 8, { sc: 1, col: '#5a7a9a', align: 'c' });

  // ring radar — edge chevron toward nearest ring when none on screen
  let nearRing = null, nd2 = 1600 * 1600;
  let ringOnScreen = false;
  for (const e of S.ents) {
    if (e.k !== 'ring' || e.taken) continue;
    if (e._sx !== undefined && e._sx > 10 && e._sx < W - 10 && e._sy > 100 && e._sy < H - 10 && e._d2 < VIEW2) { ringOnScreen = true; break; }
    if (e._d2 < nd2) { nd2 = e._d2; nearRing = e; }
  }
  if (!ringOnScreen && nearRing && (attacking || S.rings < S.quota)) {
    const del = wrapPi(bearingOf(nearRing.wx - S.wx, nearRing.wy - S.wy) - S.h);
    const ex = W / 2 + Math.sin(del) * (W / 2 - 18);
    const ey = (PY - 60) - Math.cos(del) * (H / 2 - 60);
    cx.globalAlpha = 0.6 + Math.sin(T * 5) * 0.3;
    cx.drawImage(RING_F[Math.floor(T * 7) % 4], Math.round(clamp(ex, 12, W - 12)) - 5, Math.round(clamp(ey, 104, H - 40)) - 4, 9, 8);
    cx.globalAlpha = 1;
  }

  // strikes: one red X per two people you've upset, five X's brings the patrol
  const strikes = Math.min(5, Math.floor(S.heat / 2));
  if (strikes > 0 || S.cops.length) {
    const sxs = 10, sys = top + 15;
    for (let i = 0; i < strikes; i++) {
      const hot = (strikes >= 4 || S.cops.length) && Math.floor(T * 5) % 2 === 0;
      drawRedX(sxs + i * 9, sys, hot ? '#ff6a6a' : '#e02030');
    }
  }
  // stars earned this run, kept next to the strikes
  for (let i = 0; i < S.stars; i++) drawStar(10 + i * 8, top + 25, i >= 3 ? '#ff2436' : YL);
  if (S.cops.length) {
    const blue = Math.floor(T * 7) % 2 === 0;
    const mil = S.cops.some(c => c.kind !== 'police');
    const hunting = S.cops.some(c => c.st === 'chase');
    drawText(mil ? 'MILITARY' : 'WANTED', W / 2, PY + 52,
             { sc: 1, col: hunting ? (blue ? '#39b6ff' : '#ff2436') : '#fff6c0', align: 'c', out: '#05070c' });
    if (!hunting) drawText('STAY HIDDEN', W / 2, PY + 62, { sc: 1, col: '#fff6c0', align: 'c', out: '#05070c' });
  }

  // active loot, stacked above the speed readout
  let iy = H - 40;
  if (S.pw.turbo > 0) {
    drawLootIcon('turbo', 14, iy, 1, OR);
    drawText(Math.ceil(S.pw.turbo) + 'S', 24, iy - 3, { sc: 1, col: Math.floor(T * 6) % 2 ? YL : OR, out: '#05070c' });
    iy -= 14;
  }
  if (S.pw.comp && S.pw.comp.dead <= 0) {
    drawLootIcon('comp', 14, iy, 1, AG);
    drawText(Math.ceil(S.pw.comp.t) + 'S', 24, iy - 3, { sc: 1, col: AG, out: '#05070c' });
    iy -= 14;
  }
  if (S.pw.mk3 > 0) {
    drawText('MK3 ' + Math.ceil(S.pw.mk3) + 'S', 24, (iy -= 11) + 8, { sc: 1, col: OR, out: '#05070c' });
  }
  if (S.pw.engine > 0) {
    drawLootIcon('engine', 14, iy, 1, CY);
    drawText('MK' + (S.pw.engine + 1), 24, iy - 3, { sc: 1, col: CY, out: '#05070c' });
    iy -= 14;
  }

  drawLootReveal();

  // speed (warm ramp: gold → hot pink like the old gauge)
  const sfrac = clamp((S.spd - 140) / 180, 0, 1);
  const spdCol = hexLerp(YL, MG, sfrac);
  drawText(Math.round(S.spd * 0.3) + ' KN', 10, H - 14, { sc: sfrac > 0.8 && Math.floor(T * 6) % 2 === 0 ? 2 : 1, col: spdCol, out: sfrac > 0.6 ? '#05070c' : undefined });
  if (S.combo > 1) drawText('COMBO X' + S.combo, 10, H - 26, { sc: 1, col: MG });

  // boost button
  const b = BTN.boost();
  const ready = S.boostCd <= 0;
  const firing = S.boostT > 0;
  // plate: dark bezel, lit face, corner notches so it reads as a physical button
  cx.fillStyle = '#05070c'; cx.fillRect(b.x - 19, b.y - 19, 38, 38);
  cx.fillStyle = ready ? '#241206' : '#14161d';
  cx.fillRect(b.x - 17, b.y - 17, 34, 34);
  cx.fillStyle = ready ? (firing ? '#ff8a1f' : '#3a1c08') : '#1b1f28';
  cx.fillRect(b.x - 15, b.y - 15, 30, 30);
  for (const [ox, oy] of [[-17, -17], [14, -17], [-17, 14], [14, 14]]) {
    cx.fillStyle = ready ? OR : '#39404f';
    cx.fillRect(b.x + ox, b.y + oy, 3, 3);
  }
  // NO IDLE ANIMATION. The frame only changes when you actually fire it — cycling
  // flame frames in the corner of the screen reads as distraction, not polish.
  const fl = GFIRE_F[firing ? 1 : 0];
  if (ready) {
    cx.globalAlpha = firing ? 1 : 0.95;
    cx.drawImage(fl, Math.round(b.x - fl.width / 2), Math.round(b.y - fl.height / 2 + (firing ? 0 : 1)));
    cx.globalAlpha = 1;
    if (firing) {                                   // heat haze, firing only
      cx.fillStyle = YL;
      for (let i = 0; i < 3; i++) cx.fillRect(b.x + ri(-7, 7), b.y - 14 - ri(0, 5), 2, 1);
    }
  } else {
    cx.globalAlpha = 0.28;                            // cold, waiting
    cx.drawImage(fl, Math.round(b.x - fl.width / 2), Math.round(b.y - fl.height / 2 + 1));
    cx.globalAlpha = 1;
  }
  if (!ready) {
    const cdf = clamp(S.boostCd / 5.5, 0, 1);
    cx.fillStyle = 'rgba(4,7,12,0.72)';
    cx.fillRect(b.x - 15, b.y - 15, 30, Math.round(30 * cdf));
    cx.fillStyle = OR;                                // the refill line sweeping down
    cx.fillRect(b.x - 15, b.y - 15 + Math.round(30 * cdf), 30, 1);
    drawText(Math.ceil(S.boostCd) + '', b.x, b.y + 4, { sc: 1, col: '#8fa2b4', align: 'c' });
  }
  if (firing) {
    cx.fillStyle = YL;                            // steady, not a 16Hz strobe
    cx.fillRect(b.x - 19, b.y - 19, 38, 2); cx.fillRect(b.x - 19, b.y + 17, 38, 2);
    cx.fillRect(b.x - 19, b.y - 19, 2, 38); cx.fillRect(b.x + 17, b.y - 19, 2, 38);
  }

  // live air readout — height and the trick chain building
  if (S.air && S.hgt > 30) {
    const hy2 = PY - S.hgt - 46;
    drawText(Math.round(S.hgt / 4) + 'FT', W / 2, hy2, { sc: 1, col: CY, align: 'c', out: '#05070c' });
    if (S.airTricks > 0) drawText('X' + S.airTricks + '  ' + fmt(S.trickPts * S.airTricks * (S.trickyT > 0 ? 3 : 1)), W / 2, hy2 - 10, { sc: 1, col: YL, align: 'c', out: '#05070c', wave: 1 });
  }
  if (S.hint.steer > 0) drawText('DRAG TO TURN - TAP TO HOP', W / 2, PY + 40, { sc: 1, col: FW, align: 'c', out: '#05070c' });
  // Seventeen tricks across eight directions and two flick strengths is nothing the
  // player can find by accident, so the in-air hint rotates through the vocabulary
  // instead of repeating one line.
  if (S.hint.trick > 0 && S.air) {
    const TIPS = ['SWIPE FOR TRICKS!', 'SWIPE DIAGONAL FOR OFF-AXIS!', 'FLICK HARDER FOR THE BIG ONE!'];
    drawText(TIPS[Math.floor(T * 0.7) % TIPS.length], W / 2, PY - 70,
             { sc: 1, col: CY, align: 'c', out: '#05070c' });
  }
  if (S.hint.ring > 0) drawText('RINGS KEEP THE SHARK AWAY', W / 2, PY + 40, { sc: 1, col: YL, align: 'c', out: '#05070c' });

  if (S.banner) {
    const bn = S.banner;
    const a = clamp(bn.life / 0.3, 0, 1) * clamp((bn.max - bn.life) / 0.12, 0, 1);
    cx.globalAlpha = a;
    const colCycle = [bn.col, FW][Math.floor(T * 6) % 2];
    const sc = bn.t.length > 12 ? 2 : (bn.t.length > 7 ? 2 : 3);
    drawText(bn.t, W / 2, H * 0.32, { sc, col: bn.t === '!!!' ? MG : colCycle, align: 'c', out: '#05070c' });
    if (bn.sub) drawText(bn.sub, W / 2, H * 0.32 + sc * 8 + 4, { sc: 1, col: FW, align: 'c', out: '#05070c' });
    cx.globalAlpha = 1;
  }
}

// ---------- screens ----------
function drawTitle(pal) {
  const bob = Math.sin(T * 2.4) * 2;
  cx.save();
  cx.translate(W / 2, H * 0.62 + bob);
  cx.rotate(Math.sin(T * 1.1) * 0.06);
  cx.scale(2, 2);
  cx.drawImage(sprSki, -7, -13);
  cx.restore();
  cx.fillStyle = 'rgba(232,244,255,0.8)';
  for (let i = 0; i < 10; i++) cx.fillRect(W / 2 - 10 + i * 2, H * 0.62 + 27 + ((i + Math.floor(T * 10)) % 2), 2, 1);
  drawText('FOR THE', W / 2, H * 0.15, { sc: 2, col: FW, align: 'c', out: '#05070c', wave: 1 });
  drawText('WAVES', W / 2, H * 0.15 + 20, { sc: 4, col: CY, align: 'c', out: MG, wave: 2 });
  drawText('OPEN WATER', W / 2, H * 0.15 + 58, { sc: 1, col: MG, align: 'c', out: '#05070c' });
  if (Math.floor(T * 1.6) % 2 === 0) drawText('TAP TO RIDE', W / 2, H * 0.78, { sc: 2, col: YL, align: 'c', out: '#05070c' });
  drawText('DRAG TURN - TAP HOP - SWIPE 8 WAYS FOR TRICKS', W / 2, H * 0.85, { sc: 1, col: '#7ab8d8', align: 'c' });
  drawText('RIDE THE 8 FLAGS - FEED THE METER', W / 2, H * 0.885, { sc: 1, col: '#7ab8d8', align: 'c' });
  drawText('BITES COST 5 RINGS', W / 2, H * 0.915, { sc: 1, col: MG, align: 'c' });
  cx.drawImage(FLAG_F[Math.floor(T * 6) % 2], Math.round(W / 2 - 76), Math.round(H * 0.881));
  if (S.hi > 0) drawText('BEST ' + fmt(S.hi), W / 2, H * 0.93, { sc: 1, col: YL, align: 'c' });
  // options row — tapping this toggles instead of starting the run
  const gy = Math.round(H * 0.955);
  cx.fillStyle = '#05070c'; cx.fillRect(W / 2 - 62, gy - 3, 124, 13);
  cx.fillStyle = OPTS.guide ? AG : '#3a4a5a'; cx.fillRect(W / 2 - 60, gy - 1, 2, 9);
  drawText('FLAG GUIDE ' + (OPTS.guide ? 'ON' : 'OFF'), W / 2 + 2, gy, { sc: 1, col: OPTS.guide ? AG : '#6a7a8a', align: 'c' });
  const fx3 = ((T * 14) % (W + 60)) - 30;
  dLit(sprFin, Math.round(fx3), Math.round(H * 0.70) - 18, 30, 32);
  cx.globalAlpha = 0.4; cx.fillStyle = FW;
  for (let i = 1; i < 8; i++) cx.fillRect(Math.round(fx3) + 14 - i * 2, Math.round(H * 0.70) + 14 + i, i * 3, 1);
  cx.globalAlpha = 1;
}
function drawPause() {
  cx.fillStyle = 'rgba(4,7,12,0.72)'; cx.fillRect(0, 0, W, H);
  drawText('PAUSED', W / 2, H * 0.4, { sc: 3, col: CY, align: 'c', out: '#05070c' });
  drawText('TAP TO RESUME', W / 2, H * 0.52, { sc: 1, col: FW, align: 'c' });
}
function drawOver() {
  S.overT += 1 / 60;
  const a = clamp(S.overT / 0.5, 0, 0.8);
  cx.fillStyle = 'rgba(4,7,12,' + a + ')'; cx.fillRect(0, 0, W, H);
  if (S.overT < 0.3) return;
  const yy = H * 0.13;
  if (S.overWhy === 'EATEN') {
    drawText('EATEN', W / 2, yy, { sc: 4, col: MG, align: 'c', out: '#05070c' });
    drawText('THE OCEAN ALWAYS WINS', W / 2, yy + 34, { sc: 1, col: '#7ab8d8', align: 'c' });
    dLit(sprJaw, W / 2 - 33, yy + 44, 66, 60);
  } else if (S.overWhy === 'BLOWN UP') {
    drawText('BOOM', W / 2, yy, { sc: 4, col: OR, align: 'c', out: '#05070c' });
    drawText('THE RAIDER GOT YOU', W / 2, yy + 34, { sc: 1, col: '#7ab8d8', align: 'c' });
    cx.save(); cx.translate(W / 2, yy + 74); cx.scale(2.2, 2.2);
    dLit(sprRaider, -7, -13); cx.restore();
  }
  const sy = yy + 112;
  const row = (label, val, col, i) => {
    drawText(label, W / 2 - 52, sy + i * 14, { sc: 1, col: '#7ab8d8' });
    drawText(val, W / 2 + 56, sy + i * 14, { sc: 1, col: col || FW, align: 'r' });
  };
  row('SCORE', fmt(S.score), FW, 0);
  row('TIME', mmss(S.runT), FW, 1);
  row('DISTANCE', fmt(Math.round(S.dist / 10)) + 'M', FW, 2);
  row('RINGS', S.ringsTotal, YL, 3);
  row('FEEDINGS', S.fedBanks, CY, 4);
  row('REACHED', 'LV ' + (curLevel().idx + 1) + '/' + MAX_LEVEL, YL, 5);
  row('ZONE', curLevel().name + ' ' + curLevel().act_, AG, 6);
  if (S.stars) row('STARS', String(S.stars), YL, 8);
  if (S.bestTrickName) row('BEST TRICK', S.bestTrickName, MG, 7);
  if (S.newHi) drawText('NEW BEST!', W / 2, sy + 122, { sc: 2, col: YL, align: 'c', out: '#05070c', wave: 1 });
  else drawText('BEST ' + fmt(S.hi), W / 2, sy + 122, { sc: 1, col: YL, align: 'c' });
  if (S.overT > 0.8 && Math.floor(T * 1.8) % 2 === 0)
    drawText('TAP TO RIDE AGAIN', W / 2, H * 0.83, { sc: 2, col: CY, align: 'c', out: '#05070c' });
}

// ---------- main loop ----------
// offline play once installed to the home screen (no-ops where unavailable)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let frame = (now - last) / 1000;
  last = now;
  if (frame > 0.25) frame = 0.25; // cap catch-up after long stalls
  if (S.slow > 0) { S.slow -= frame; frame *= 0.3; }
  // fixed-timestep substeps: game speed stays true even when rAF is throttled
  let acc = frame;
  while (acc > 0.0001) {
    const step = Math.min(acc, 1 / 60);
    update(step);
    acc -= step;
  }
  if (AU.ready && AU.on && (S.state === 'play')) musicTick();
  draw();
}
requestAnimationFrame(loop);
</script>
