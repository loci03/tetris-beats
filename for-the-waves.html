function sprite(rows, pal) {

// chamfer distance transform gives a height field, its gradient gives the surface

function makeRing(wpx) {
  const c = document.createElement('canvas'); c.width = 13; c.height = 11;
  const g = c.getContext('2d');
  const rx = Math.max(1.2, wpx / 2), ry = 5;
  for (let y = 0; y < 11; y++) for (let x = 0; x < 13; x++) {
    const dx = (x + 0.5 - 6.5) / rx, dy = (y + 0.5 - 5.5) / ry;
    const d = dx * dx + dy * dy;
    const hole = wpx > 6 ? 0.42 : (wpx > 3 ? 0.2 : -1);
    if (d <= 1 && d >= hole) {
      g.fillStyle = (y <= 3 && x <= 6) ? FW : (y >= 8 ? '#c98a00' : YL);
      g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}

// Leaping bottlenose, side profile, nose right. Same grid-then-keyline build as
// the shark: arched body, beak, hooked dorsal, pectoral, forked flukes.
function makeDolphin() {
  const W2 = 46, H2 = 30;
  const grid = new Array(H2);
  for (let y = 0; y < H2; y++) grid[y] = new Array(W2).fill(null);
  const set = (x, y, c) => {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= W2 || y >= H2) return;
    grid[y][x] = c;
  };
  const OUT = '#101c2a', TOP = '#3f6a92', MID = '#5f8cb5', LOW = '#9fc2da', BELLY = '#e9dfd4', SHADE = '#c8b9ab';
  const X0 = 9, X1 = 43, spine0 = 17;
  const tOf = x => (x - X0) / (X1 - X0);
  const arch = t => -5.5 * Math.sin(Math.PI * Math.pow(clamp(t, 0, 1), 0.9)) - 2.5 * clamp(t, 0, 1);
  const spineAt = x => spine0 + arch(tOf(x));
  // fat mid-body, tapering to a slim beak
  const half = t => {
    if (t <= 0 || t >= 1) return 0;
    if (t > 0.88) return 2.1 * (1 - (t - 0.88) / 0.12) + 0.6;   // the beak
    return 6.9 * Math.pow(Math.sin(Math.PI * Math.pow(t / 0.88, 1.15)), 0.7);
  };
  const topAt = x => spineAt(x) - half(tOf(x));
  const botAt = x => spineAt(x) + half(tOf(x)) * 0.95;

  for (let x = X0; x <= X1; x++) {
    const h = half(tOf(x));
    if (h < 0.4) continue;
    const top = topAt(x), bot = botAt(x);
    for (let y = Math.round(top); y <= Math.round(bot); y++) {
      const f = (y - top) / Math.max(0.001, bot - top);
      set(x, y, f < 0.32 ? TOP : f < 0.52 ? MID : f < 0.66 ? LOW : (f > 0.92 ? SHADE : BELLY));
    }
  }
  function tri(ax, ay, bx, by, cxp, cy, col) {
    const minX = Math.floor(Math.min(ax, bx, cxp)), maxX = Math.ceil(Math.max(ax, bx, cxp));
    const minY = Math.floor(Math.min(ay, by, cy)), maxY = Math.ceil(Math.max(ay, by, cy));
    const area = (bx - ax) * (cy - ay) - (cxp - ax) * (by - ay);
    if (!area) return;
    for (let y = minY; y <= maxY; y++) for (let x = minX; x <= maxX; x++) {
      const w0 = ((bx - ax) * (y - ay) - (x - ax) * (by - ay)) / area;
      const w1 = ((x - ax) * (cy - ay) - (cxp - ax) * (y - ay)) / area;
      if (w0 < -0.03 || w1 < -0.03 || (1 - w0 - w1) < -0.03) continue;
      set(x, y, col);
    }
  }
  tri(23, topAt(23), 30, topAt(30), 19, spineAt(24) - 14, TOP);      // hooked dorsal
  tri(28, botAt(28), 34, botAt(34), 25, spineAt(30) + 12, MID);      // pectoral
  const tx = X0 + 2, tS = spineAt(tx);
  for (let x = X0 - 1; x <= tx; x++)
    for (let y = Math.round(tS - 2.5); y <= Math.round(tS + 2.5); y++) set(x, y, MID);
  tri(tx, tS - 3, tx, tS + 3, tx - 9, tS - 8, TOP);                  // fluke, upper
  tri(tx, tS - 3, tx, tS + 3, tx - 9, tS + 8, MID);                  // fluke, lower
  // smiling mouth line along the beak, and the eye
  for (let x = 36; x <= X1 - 1; x++) set(x, botAt(x) - 0.5, '#26445e');
  const ey = spineAt(34) - 2;
  set(34, ey, '#05070c'); set(35, ey, '#05070c'); set(34, ey - 1, '#05070c');
  set(35, ey - 1, '#cfe4f0');
  // highlight along the back
  for (let x = 16; x < 30; x += 2) set(x, topAt(x) + 1.5, '#b8dcf0');

  const edge = [];
  for (let y = 0; y < H2; y++) for (let x = 0; x < W2; x++) {
    if (!grid[y][x]) continue;
    if (!grid[y - 1]?.[x] || !grid[y + 1]?.[x] || !grid[y][x - 1] || !grid[y][x + 1]) edge.push([x, y]);
  }
  for (const [x, y] of edge) grid[y][x] = OUT;

  const c = document.createElement('canvas'); c.width = W2; c.height = H2;
  const g = c.getContext('2d');
  for (let y = 0; y < H2; y++) for (let x = 0; x < W2; x++) {
    if (!grid[y][x]) continue;
    g.fillStyle = grid[y][x]; g.fillRect(x, y, 1, 1);
  }
  return c;
}

// The wreck of the SEA WOLF: a broken freighter half out of the water. The
// stern is solid steel (hitting it hurts), the tilted bow deck is a huge ramp.
function makeWreck() {
  const W2 = 44, H2 = 92;
  const c = document.createElement('canvas'); c.width = W2; c.height = H2;
  const g = c.getContext('2d');
  const px = (x, y, col) => { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), 1, 1); };
  const OUT = '#0a0e14', RUST = '#7a4326', RST2 = '#5a2f18', HULL = '#3d4a56', HUL2 = '#2a343d',
        DECK = '#6a7482', RAMP = '#f2b41d', RMP2 = '#c9950d', WHT = '#e8f4ff', GLS = '#1c3a4a';
  const halfAt = y => {

    const t = (y - 6) / (H2 - 10);
    return 4 + 14 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.85)), 0.6);
  };
  for (let y = 6; y < H2 - 4; y++) {
    const h = halfAt(y);
    if (h < 1) continue;
    const cxm = W2 / 2 + Math.sin(y * 0.06) * 1.5;
    for (let x = Math.round(cxm - h); x <= Math.round(cxm + h); x++) {
      const f = (x - (cxm - h)) / (2 * h);
      if (y < 30) {
        // bow deck: rusted plating, with the ramp only down the centreline where
        // you actually ride it — the whole bow in hazard yellow read as a beehive
        const mid = Math.abs(f - 0.5) < 0.30;
        px(x, y, mid ? ((y % 4 < 2) ? RAMP : RMP2)
                     : (y % 6 < 2 ? RST2 : (f < 0.5 ? '#6d5142' : '#54402f')));
      } else if (y < 38) {
        px(x, y, Math.abs(f - 0.5) < 0.34 ? WHT : '#b9c2c9');   // the lip you launch off
      } else {
        px(x, y, f < 0.28 ? HULL : f > 0.78 ? HUL2 : (y % 7 < 2 ? RST2 : RUST));
      }
    }
    px(Math.round(cxm - h), y, OUT); px(Math.round(cxm + h), y, OUT);
  }
  // superstructure and broken funnel on the stern
  for (let y = 52; y < 70; y++) for (let x = 14; x < 30; x++) px(x, y, (x + y) % 5 === 0 ? RST2 : DECK);
  for (let y = 54; y < 60; y++) for (let x = 17; x < 27; x++) px(x, y, GLS);
  for (let y = 62; y < 68; y++) for (let x = 19; x < 25; x++) px(x, y, RST2);
  for (let x = 13; x < 31; x++) { px(x, 51, OUT); px(x, 70, OUT); }
  for (let y = 51; y <= 70; y++) { px(13, y, OUT); px(30, y, OUT); }
  // torn gash across the middle where she broke her back
  for (let x = 6; x < 38; x++) {
    const yy = 46 + Math.round(Math.sin(x * 0.7) * 1.6);
    px(x, yy, OUT); px(x, yy + 1, '#151b22');
  }
  // chevrons up the ramp
  for (let k = 0; k < 3; k++) {
    const yy = 11 + k * 7;
    for (let i = 0; i < 4; i++) { px(W2 / 2 - i, yy + i, '#8a2be2'); px(W2 / 2 + i, yy + i, '#8a2be2'); }
  }
  // rust weeping down the plating, and algae along the waterline
  for (let k = 0; k < 14; k++) {

  // foam where she meets the water
  g.fillStyle = 'rgba(232,244,255,0.8)';
  for (let x = 2; x < W2 - 2; x += 2) g.fillRect(x, H2 - 4 + (x % 4 === 0 ? 1 : 0), 1, 1);

// jazzier voicings are what give the Sonic sound its lift
const chordTones = (root, q) => {
  switch (q) {
    case 'min':  return [root, root + 3, root + 7, root + 12];
    case 'min7': return [root, root + 3, root + 7, root + 10];
    case 'maj7': return [root, root + 4, root + 7, root + 11];
    case 'dom7': return [root, root + 4, root + 7, root + 10];
    default:     return [root, root + 4, root + 7, root + 12];
  }
};
function musicTick() {
  if (!AU.ready || !AU.on) return;
  const LVm = curLevel();
  const song = SONGS[Math.min(LVm.music, SONGS.length - 1)];
  // tricky mode pushes the tempo; the grid is 16th notes
  const bpm = song.bpm * LVm.tempo * (S.trickyT > 0 ? 1.14 : 1);
  const stepDur = 60 / bpm / 4;
  if (AU.nextT < AU.ctx.currentTime) AU.nextT = AU.ctx.currentTime + 0.05;
  while (AU.nextT < AU.ctx.currentTime + 0.16) {
    const st = AU.step;
    const s16 = st % 16, s64 = st % 64, bar = Math.floor(s64 / 16);
    // shuffle: nudge the off-16ths late for groove
    const t = AU.nextT + (s16 % 2 ? stepDur * (song.swing || 0) : 0);
    if (AU.mode === 'chill') {
      // 8-bar cycle: the progression can run 8 chords and the lead alternates its
      // A and B phrases, so the loop is twice as long as it was and stops feeling
      // like a 4-bar sample on repeat.
      const s128 = st % 128;
      const bar8 = Math.floor(s128 / 16);
      const [croot, cq] = song.prog[bar8 % song.prog.length];
      const tones = chordTones(croot, cq);
      // sustained pad under everything, one voicing per bar
      if (song.padVol && s16 === 0) {
        const pv = song.padVol * (S.trickyT > 0 ? 1.2 : 1);
        playAt(mid2f(croot + (song.padOct || -12)), t, stepDur * 15, song.padWave || 'triangle', pv, AU.musicGain);
        playAt(mid2f(tones[1] + (song.padOct || -12)), t, stepDur * 15, song.padWave || 'triangle', pv * 0.7, AU.musicGain);
        playAt(mid2f(tones[2] + (song.padOct || -12)), t, stepDur * 15, song.padWave || 'triangle', pv * 0.55, AU.musicGain);
      }
      // '1' = root, '2' = octave up, '5' = fifth — the bounce in the bassline
      const bc = song.bassPat[s16];
      if (bc && bc !== '.') {
        const off = bc === '2' ? 12 : bc === '5' ? 7 : 0;
        playAt(mid2f(croot + song.bassOct + off), t, stepDur * (bc === '1' ? 2.2 : 1.5), song.bassWave, song.bassVol, AU.musicGain);
      }
      if (song.arpPat[s16] === '1') {
        const n = tones[song.arpSeq[Math.floor(st / 1) % song.arpSeq.length]] + song.arpOct;
        playAt(mid2f(n), t, stepDur * 1.5, song.arpWave, song.arpVol, AU.musicGain);
      }
      const phrase = (s128 < 64 || !song.leadB) ? song.lead : song.leadB;
      const l = phrase[s64];
      if (l && S.state === 'play') {
        playAt(mid2f(l), t, stepDur * 2.2, song.leadWave, song.leadVol * (S.trickyT > 0 ? 1.5 : 1), AU.musicGain);
        playAt(mid2f(l + 12), t, stepDur * 1.1, 'square', song.leadVol * 0.22, AU.musicGain);   // octave sparkle
      }
      const half2 = s128 >= 64;
      const kp = (half2 && song.kick2) ? song.kick2 : song.kick;
      const sp = (half2 && song.snare2) ? song.snare2 : song.snare;
      if (kp[s16] === '1') kickAt(t);
      if (sp[s16] === '1') snareAt(t);
      if (song.hat[s16] === '1') hatAt(t, song.hatVol);
      if (song.ride && song.ride[s16] === '1') hatAt(t, (song.hatVol || 0.02) * 0.6, true);
    } else {
      // the hunt: everything drops to a heartbeat and a low drone
      if (s16 % 8 === 0) {
        playAt(58, t, stepDur * 3.6, 'sine', 0.30, AU.dangerGain);
        playAt(58, t + stepDur * 1.8, stepDur * 2.8, 'sine', 0.22, AU.dangerGain);
      }
      if (s16 === 4 || s16 === 12) playAt(mid2f(38), t, stepDur * 3, 'sawtooth', 0.07, AU.dangerGain);
    }
    AU.nextT += stepDur; AU.step++;
  }
}
function kickAt(t) {
  const o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
  g.gain.setValueAtTime(0.34, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.19);
  o.connect(g); g.connect(AU.musicGain); o.start(t); o.stop(t + 0.22);
}
function snareAt(t) {
  const len = Math.ceil(AU.ctx.sampleRate * 0.16);
  const buf = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AU.ctx.createBufferSource(); src.buffer = buf;
  const f = AU.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.8;
  const g = AU.ctx.createGain();
  g.gain.setValueAtTime(0.13, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  src.connect(f); f.connect(g); g.connect(AU.musicGain); src.start(t); src.stop(t + 0.18);
}
function playAt(freq, t, dur, type, vol, dest) {
  const o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
}
function hatAt(t, vol, open) {
  const len = Math.ceil(AU.ctx.sampleRate * (open ? 0.16 : 0.03));
  const buf = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = AU.ctx.createBufferSource(); src.buffer = buf;
  const f = AU.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = open ? 4800 : 6000;
  const g = AU.ctx.createGain(); g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + (open ? 0.16 : 0.03));
  src.connect(f); f.connect(g); g.connect(AU.musicGain); src.start(t); src.stop(t + (open ? 0.2 : 0.05));
}

// ---------- world constants ----------
const CYCLE = 120, QUOTA0 = 50, QUOTA_STEP = 15;   // CYCLE: title/reset only — curLevel().cycle is the truth in play
const HEAT_LIMIT = 10;              // shouts before the harbour patrol takes an interest
const HOR = 92;                     // horizon line — shared by draw() and drawHUD()
const WORLD_R = 2400, DEEP_R = 2600;
const SUN_AZ = 3.9; // fixed world bearing of the sun
const VIEW2 = 650 * 650, NEAR2 = 220 * 220;

// ---------- state ----------
const S = {};
let T = 0;
let cosH = 1, sinH = 0;
function w2s(dx, dy) { return [W / 2 + dx * cosH + dy * sinH, PY - dx * sinH + dy * cosH]; }
function bearingOf(dx, dy) { return Math.atan2(dx, -dy); }

function buildWorld() {
  const rr = mulberry(73);
  const rrange = (a, b) => a + rr() * (b - a);
  const E = [];
  // --- checkpoint course: 8 gold buoys on a tilted ellipse
  const cps = [];
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU - 0.4;
    const wx = 150 + Math.sin(a) * 1150, wy = -100 - Math.cos(a) * 850;
    cps.push({ wx, wy });
    E.push({ k: 'cp', wx, wy, idx: i });
  }
  // --- islands (avoid spawn + CP course)
  const isles = [];
  const lhPos = { wx: 900, wy: -1500, r: 55 };
  isles.push(lhPos);
  E.push({ k: 'island', wx: lhPos.wx, wy: lhPos.wy, r: lhPos.r, img: makeIsland(lhPos.r, rr), lh: true, name: 'THE LIGHT' });
  const homeR = 90;
  isles.push({ wx: -340, wy: 320, r: homeR });
  E.push({ k: 'island', wx: -340, wy: 320, r: homeR, img: makeIsland(homeR, rr), home: true, name: 'HOME CAY' });
  let tries = 0;
  while (isles.length < 11 && tries < 400) {
    tries++;
    const a = rr() * TAU, d = 500 + rr() * 1800;
    const wx = Math.sin(a) * d, wy = -Math.cos(a) * d;
    const r = 40 + rr() * 80;
    if (Math.hypot(wx, wy) < 420) continue;
    let ok = true;
    for (const c of cps) if (Math.hypot(wx - c.wx, wy - c.wy) < r + 220) { ok = false; break; }

// ---------- popups / banners (world-anchored popups) ----------
function pop(txt, wx, wy, col, sc) { S.pops.push({ t: txt, wx, wy, col: col || FW, sc: sc || 1, life: 1.1, rise: 0 }); }
// expanding water shockwave ring (world-space ellipse)
function shockwave(wx, wy, r0, r1, life, col) { S.rings3.push({ wx, wy, r: r0, r1, t: 0, life, col: col || FW }); }
// a column of water thrown up where something big breaks the surface
// A two-tonne animal coming through the surface should move a LOT of water. The old
// calls were sized for a jet ski hopping a wake. This is the shark-scale version:
// a low sheet that flies outward, a high crown, and a shockwave ring.
function sharkSplash(wx, wy, pow) {
  const P = pow || 1;
  shockwave(wx, wy, 6 * P, 46 * P, 0.55, FW);
  shockwave(wx, wy, 3 * P, 30 * P, 0.4, CY);
  S.plumes.push({ wx, wy, t: 0, life: 0.8, size: 22 * P });
  // the flat sheet: fast, low, straight out sideways — this is the part that reads
  for (let i = 0; i < Math.round(30 * P); i++) {
    const a = rnd(TAU), sp = rnd(90, 240) * P;
    part(wx + Math.cos(a) * rnd(2, 10), wy + Math.sin(a) * rnd(2, 8),
         Math.cos(a) * sp, Math.sin(a) * sp, rnd(0, 8), rnd(20, 70), 260, rnd(0.35, 0.8),
         Math.random() < 0.72 ? FW : CY, Math.random() < 0.5 ? 2 : 1);
  }
  // and the column that goes UP and comes back down
  for (let i = 0; i < Math.round(18 * P); i++) {
    const a = rnd(TAU);
    part(wx + Math.cos(a) * rnd(1, 12), wy + Math.sin(a) * rnd(1, 9),
         Math.cos(a) * rnd(10, 60), Math.sin(a) * rnd(10, 60),
         rnd(10, 46) * P, rnd(120, 230), 300, rnd(0.45, 0.95),
         Math.random() < 0.8 ? FW : CY, Math.random() < 0.4 ? 2 : 1);
  }
  S.shake = Math.max(S.shake, 3 * P);
}
function plume(wx, wy, size) {
  S.plumes.push({ wx, wy, t: 0, life: 0.7, size });
  shockwave(wx, wy, size * 0.2, size * 1.5, 0.6, FW);
  for (let i = 0; i < Math.round(size * 0.7); i++) {
    const a = rnd(TAU);
    part(wx + Math.cos(a) * rnd(2, size * 0.35), wy + Math.sin(a) * rnd(2, size * 0.25),
         Math.cos(a) * rnd(20, 90), Math.sin(a) * rnd(20, 90),
         rnd(0, size * 0.4), rnd(60, 150), 260, rnd(0.35, 0.75),
         Math.random() < 0.8 ? FW : CY, Math.random() < 0.45 ? 2 : 1);
  }
}
function banner(txt, col, dur, sub) { S.banner = { t: txt, col: col || CY, life: dur || 1.6, max: dur || 1.6, sub: sub || '' }; }

// ---------- particles (world-plane + pseudo-height z) ----------
function part(wx, wy, vx, vy, z, vz, g, life, col, sz) {
  // A full sharkSplash asks for ~48 particles at once and the big ones stack two
  // bursts back to back. A charge-only test peaked at 366, but a real run with tricks,
  // wake and a rampage in flight hits 460 exactly — i.e. it was pinned against the old
  // cap and silently dropping the tail of every splash. Measure the whole game, not the
  // feature you just changed.
  if (S.parts.length > 700) return;
  S.parts.push({ wx, wy, vx, vy, z, vz, g, life, col, sz });
}
function spray(wx, wy, n, col, pow, up) {
  for (let i = 0; i < n; i++) {
    const a = rnd(TAU);
    part(wx + rnd(-3, 3), wy + rnd(-3, 3), Math.cos(a) * pow * 0.4, Math.sin(a) * pow * 0.4,
         0, up ? rnd(20, 70) : rnd(0, 20), 180, rnd(0.25, 0.6), col, rnd(1) < 0.3 ? 2 : 1);
  }
}
function splashCrown(wx, wy, n, pow) {
  for (let i = 0; i < n; i++) {
    const a = rnd(TAU);
    part(wx + Math.cos(a) * 4, wy + Math.sin(a) * 4, Math.cos(a) * pow * rnd(0.3, 0.8), Math.sin(a) * pow * rnd(0.3, 0.8),
         0, rnd(30, 90), 300, rnd(0.3, 0.7), rnd(1) < 0.75 ? FW : CY, rnd(1) < 0.4 ? 2 : 1);
  }
}

// ---------- tricks ----------
const TRICKS = {
  spinL:  { base: 500,  dur: 0.42, name: '360',            pose: 'tuck' },
  spinR:  { base: 500,  dur: 0.42, name: '360',            pose: 'tuck' },
  back:   { base: 800,  dur: 0.55, name: 'BACKFLIP',       pose: 'tuck' },
  front:  { base: 800,  dur: 0.52, name: 'FRONTFLIP',      pose: 'tuck' },
  // the dynamic set — same triggers, chosen by HOW you swipe
  superB: { base: 1900, dur: 0.78, name: 'SUPERMAN FLIP',  pose: 'super' },
  superF: { base: 1900, dur: 0.74, name: 'SUPERMAN FRONT', pose: 'super' },
  rollL:  { base: 1200, dur: 0.60, name: 'BARREL ROLL',    pose: 'oneh', roll: -1 },
  rollR:  { base: 1200, dur: 0.60, name: 'BARREL ROLL',    pose: 'oneh', roll: 1 },
  oneH:   { base: 950,  dur: 0.50, name: 'ONE-HANDER',     pose: 'oneh' },
  // ---- diagonals: two axes at once, which is what makes them read as off-axis ----
  misty:  { base: 2200, dur: 0.82, name: 'MISTY FLIP',     pose: 'tuck'  },  // NE: flip + spin
  cork:   { base: 2400, dur: 0.86, name: 'CORKSCREW',      pose: 'super' },  // NW: spin + roll
  table:  { base: 1500, dur: 0.66, name: 'TABLETOP',       pose: 'oneh'  },  // SE: roll, held flat
  nac:    { base: 1700, dur: 0.70, name: 'NAC-NAC',        pose: 'nac'   },  // SW: leg over, half spin
  // ---- and the committed versions of the same four, for a hard diagonal flick ----
  rodeo:  { base: 3200, dur: 1.00, name: 'RODEO 540',      pose: 'super' },
  dcork:  { base: 3800, dur: 1.10, name: 'DOUBLE CORK',    pose: 'super' },
  stable: { base: 2600, dur: 0.86, name: 'SUPERMAN TABLE', pose: 'super' },
  nacro:  { base: 2900, dur: 0.92, name: 'NAC ROTO',       pose: 'nac'   },
};
const SPIN_NAMES = ['360', '720 TORNADO', '1080 CYCLONE', '1440 MAELSTROM'];
// Which trick a flick means. Pulled out of the pointer handler so it can be tested
// directly — eight directions times three styles is too many combinations to trust
// to eyeballing it in play.
// Returns a PREFERENCE LIST for the gesture, biggest first. queueTrick walks it and
// takes the first that fits in the air you actually have, so the same flick always
// gives you the same family of trick — just the size your air can pay for.
function trickForSwipe(dx, dy, mag, held) {
  const ax = Math.abs(dx), ay = Math.abs(dy);
  const hard = mag > 74;
  // A genuine DIAGONAL (both axes within a comfortable ratio of each other) is its own
  // gesture, not a sloppy cardinal — those get the two-axis tricks.
  if (Math.min(ax, ay) / Math.max(ax, ay) > 0.55) {
    const lad = dy < 0 ? (dx > 0 ? ['rodeo', 'misty', 'back',  'spinR']    // NE
                                 : ['dcork', 'cork',  'rollL', 'spinL'])   // NW
                       : (dx > 0 ? ['stable', 'table', 'rollR', 'spinR']   // SE
                                 : ['nacro',  'nac',   'oneH',  'spinL']); // SW
    // a soft flick asks for the small version even when there is air for the big one —
    // the ladder is a fallback, not a free upgrade
    return hard ? lad : lad.slice(1);
  }
  if (ax > ay) {
    if (hard) return dx > 0 ? ['rollR', 'oneH', 'spinR'] : ['rollL', 'oneH', 'spinL'];
    if (held) return ['oneH', dx > 0 ? 'spinR' : 'spinL'];
    return dx > 0 ? ['spinR'] : ['spinL'];
  }
  if (hard) return dy < 0 ? ['superB', 'back', 'oneH', 'spinR'] : ['superF', 'front', 'oneH', 'spinL'];
  if (held) return ['oneH', 'spinL'];
  return dy < 0 ? ['back', 'spinR'] : ['front', 'spinL'];
}
// Landing mid-trick is a slam, and a hop only buys 0.67s of air — so a SUPERMAN FLIP
// (0.78s) off a hop was an unavoidable wipeout no matter how well you played it. The
// player cannot see their own hang time, so punishing them for it is just a trap.
// Instead the gesture always lands SOMETHING: if the big version does not fit in the
// air you have left, it steps down the same family until one does. Big tricks then
// require big air on their own, without a hidden rule enforcing it.
function airLeft() {
  const g = 330;   // matches the gravity in the air update
  return (S.vh + Math.sqrt(Math.max(0, S.vh * S.vh + 2 * g * S.hgt))) / g;
}
function queueTrick(pick) {
  if (!S.air || S.wipeT > 0) return;
  const list = Array.isArray(pick) ? pick : [pick];
  // whatever is already running or queued has to land first
  let busy = S.trick ? Math.max(0, S.trick.dur - S.trick.t) : 0;
  for (const q of S.trickQ) busy += (TRICKS[q.type] || {}).dur || 0;
  const room = airLeft() - busy;
  let type = null;
  for (const t of list) if (TRICKS[t] && TRICKS[t].dur <= room) { type = t; break; }
  // Nothing fits — a plain hop only buys ~0.34s from the apex, less than any trick.
  // Queueing anyway would be a guaranteed slam the player had no way to foresee, so
  // the swipe is simply ignored. Ramps are the trick platform; hops are for dodging.
  if (!type) return;
  S.trickQ.push({ type });
  SFX.trick();
}
function updateTricks(dt) {
  if (!S.trick && S.trickQ.length) {
    const q = S.trickQ.shift();
    S.trick = { type: q.type, t: 0, dur: TRICKS[q.type].dur, reps: 1 };
  }
  if (S.trick) {
    const tr = S.trick;
    if ((tr.type === 'spinL' || tr.type === 'spinR') && S.trickQ.length && S.trickQ[0].type === tr.type && tr.reps < 4) {
      S.trickQ.shift(); tr.reps++; tr.dur += 0.38;
    }
    tr.t += dt;
    const p = clamp(tr.t / tr.dur, 0, 1);
    if (tr.type === 'spinL') S.spin = -p * TAU * tr.reps;
    if (tr.type === 'spinR') S.spin = p * TAU * tr.reps;
    if (tr.type === 'back') S.pitch = -p * TAU;
    if (tr.type === 'front') S.pitch = p * TAU;
    // superman flips rotate AND throw the rider out; barrel rolls spin on the long
    // axis, which is a different squash (X) from a flip (Y)
    if (tr.type === 'superB') { S.pitch = -p * TAU; S.throwOut = Math.sin(p * Math.PI); }
    if (tr.type === 'superF') { S.pitch = p * TAU;  S.throwOut = Math.sin(p * Math.PI); }
    if (tr.type === 'rollL')  S.roll = -p * TAU;
    if (tr.type === 'rollR')  S.roll = p * TAU;
    if (tr.type === 'oneH')   S.spin = Math.sin(p * Math.PI) * 0.55;
    // two axes at once is what sells an off-axis trick — one axis alone just reads
    // as a flip or a spin that has been renamed
    if (tr.type === 'misty') { S.pitch = -p * TAU; S.spin = p * TAU * 0.5; }
    if (tr.type === 'cork')  { S.spin = -p * TAU; S.roll = p * TAU * 0.75; S.throwOut = Math.sin(p * Math.PI); }
    if (tr.type === 'table') { S.roll = Math.sin(p * Math.PI) * 1.85; S.spin = Math.sin(p * Math.PI) * 0.3; }
    if (tr.type === 'nac')   { S.spin = Math.sin(p * Math.PI) * 1.3; S.pitch = Math.sin(p * Math.PI) * 0.5; }
    // the big four: same axes, more of it, and the rider comes off the seat
    if (tr.type === 'rodeo')  { S.pitch = -p * TAU; S.spin = p * TAU * 1.5; S.throwOut = Math.sin(p * Math.PI); }
    if (tr.type === 'dcork')  { S.spin = -p * TAU * 2; S.roll = p * TAU; S.throwOut = Math.sin(p * Math.PI); }
    if (tr.type === 'stable') { S.roll = Math.sin(p * Math.PI) * 2.6; S.throwOut = Math.sin(p * Math.PI); }
    if (tr.type === 'nacro')  { S.spin = p * TAU; S.pitch = Math.sin(p * Math.PI) * 0.85; }
    if (p >= 1) {
      let pts = 0, nm = '';
      if (tr.type === 'spinL' || tr.type === 'spinR') { nm = SPIN_NAMES[tr.reps - 1]; pts = [500, 1400, 2800, 4800][tr.reps - 1]; }
      else { nm = TRICKS[tr.type].name; pts = TRICKS[tr.type].base; }
      S.airTricks++;
      S.trickPts += pts;
      pop(nm + '!', S.wx, S.wy, [CY, MG, YL, AG][S.airTricks % 4], 2);
      // trick completes: burst of sparks + a beat of white
      S.trickFlash = 0.22;
      for (let j = 0; j < 14; j++) {
        const a2 = j / 14 * TAU;
        part(S.wx, S.wy, Math.cos(a2) * rnd(40, 90), Math.sin(a2) * rnd(40, 90),
             S.hgt, rnd(-10, 30), 90, rnd(0.3, 0.55), pick([CY, MG, YL, FW]), Math.random() < 0.5 ? 2 : 1);
      }
      const mult = (S.trickyT > 0 ? 3 : 1);
      if (pts * mult > S.bestTrick) { S.bestTrick = pts * mult; S.bestTrickName = nm; }
      S.spin = 0; S.pitch = 0; S.roll = 0; S.throwOut = 0; S.trick = null;
      SFX.trickDone();
    }
  }
}

// ---------- player actions ----------
function hop() {
  if (S.air || S.wipeT > 0 || S.state !== 'play') return;
  S.air = true; S.airT = 0; S.hgt = 0.01; S.vh = 112;
  spray(S.wx, S.wy, 8, FW, 60, true);
  SFX.hop();
}
function launch(mega, label) {
  S.air = true; S.airT = 0; S.hgt = Math.max(S.hgt, 0.01); S.hangDone = false;
  shockwave(S.wx, S.wy, 4, mega ? 44 : 28, 0.5, CY);
  const spdBonus = S.spd / 300;
  S.vh = (mega ? 225 : 172) * (0.85 + spdBonus * 0.35);
  S.score += mega ? 150 : 50;
  spray(S.wx, S.wy, 16, FW, 90, true);
  S.shake = Math.max(S.shake, 2);
  pop(label || (mega ? 'MEGA AIR!' : 'AIR!'), S.wx, S.wy, label ? YL : (mega ? MG : CY), mega || label ? 2 : 1);
  if (S.hint.trick < 2.5 && S.runT < 120) S.hint.trick = 2.5;
  SFX.launch();
}
function land() {
  const impact = -S.vh;
  S.hgt = 0; S.vh = 0; S.air = false;
  if (S.trick) {
    const p = S.trick.t / S.trick.dur;
    if (p > 0.82) { S.trick.t = S.trick.dur; updateTricks(0.001); }
  }
  if (S.trick || S.trickQ.length) { S.trickQ = []; S.trick = null; S.spin = 0; S.pitch = 0; S.roll = 0; S.throwOut = 0; wipeout('SLAM!'); return; }
  S.spin = 0; S.pitch = 0;
  const big = impact > 150;
  splashCrown(S.wx, S.wy, big ? 26 : 12, big ? 110 : 60);
  S.shake = Math.max(S.shake, big ? 4 : 1.5);
  SFX.land(big);
  buzz(big ? 22 : 8);
  // impact rings racing outward across the water
  shockwave(S.wx, S.wy, 6, big ? 62 : 34, big ? 0.75 : 0.5, FW);
  if (big) shockwave(S.wx, S.wy, 3, 40, 0.55, CY);
  if (S.airTricks > 0) {
    for (let j = 0; j < (big ? 22 : 12); j++) {
      const a2 = rnd(TAU);
      part(S.wx, S.wy, Math.cos(a2) * rnd(60, 150), Math.sin(a2) * rnd(60, 150), 0, rnd(20, 60), 260, rnd(0.3, 0.6), Math.random() < 0.7 ? FW : CY, Math.random() < 0.5 ? 2 : 1);
    }
  }
  S.hangDone = false;
  if (S.airTricks > 0) {
    const total = S.trickPts * S.airTricks * (S.trickyT > 0 ? 3 : 1);
    S.score += total;
    S.combo = S.airTricks;
    pop('+' + fmt(total) + (S.airTricks > 1 ? '  X' + S.airTricks : ''), S.wx, S.wy, YL, S.airTricks > 1 ? 2 : 1);
    if (S.airTricks >= 3) {
      banner('ABSOLUTELY FILTHY!', MG, 1.4);
      pop('YAHOO!', S.wx, S.wy, YL, 2);
      SFX.whoop(0.16);
      SFX.combo();
    } else if (S.airTricks === 2) SFX.combo();
    S.streak++;
    if (S.streak >= 3 && S.trickyT <= 0) { S.trickyT = 15; banner('TRICKY MODE!', AG, 2.0, 'SCORE X3 - 15 SECONDS'); SFX.combo(); }
    if (S.shark.st === 'attack') { S.shark.dist += 26 + S.airTricks * 14; pop('IT FALLS BACK!', S.wx, S.wy, AG, 1); }
    else if (S.shark.st === 'circle') { S.shark.st = 'attack'; S.shark.dist = 90; pop('IT FLINCHES!', S.wx, S.wy, AG, 1); }
    S.spd += 30;
    S.boostCd = Math.max(0, S.boostCd - 1.1 * S.airTricks); // tricks recharge boost
    S.celebT = 0.75; // fist-pump pose
  } else S.streak = 0;
  S.airTricks = 0; S.trickPts = 0;
}
function wipeout(why) {
  // A grind hard-assigns S.wx/S.wy and re-pins S.hgt every frame, so being wiped
  // mid-rail (shark, mine, cop) left the ride branch fighting the wipeout forever.
  if (S.grind) { S.grind.e.cd = 1.2; S.grind = null; S.air = false; S.hgt = 0; S.vh = 0; }
  if (S.invT > 0 || S.wipeT > 0) return;
  S.wipeT = 1.15; S.invT = 2.2; S.combo = 0; S.streak = 0; S.trickyT = 0;
  S.trickQ = []; S.trick = null; S.spin = 0; S.pitch = 0; S.roll = 0; S.throwOut = 0; S.air = false; S.hgt = 0; S.vh = 0;
  splashCrown(S.wx, S.wy, 30, 120);
  S.shake = 6; S.flash = 0.22; S.flashCol = FW;
  banner(why || 'WIPEOUT!', OR, 1.2);
  if (S.shark.st === 'attack') S.shark.dist -= 44;
  SFX.wipe();
  buzz([30, 40, 30]);
}
function boost() {
  if (S.state !== 'play' || S.wipeT > 0) return;
  if (S.boostCd > 0 && S.pw.turbo <= 0) return;
  S.boostT = 1.6; S.boostCd = S.pw.turbo > 0 ? 0 : 5.5;
  S.spd = Math.min(S.spd + 52, 360);                 // it punches, it does not ramp
  // gunning it out of a sweep is the answer to a sweep: the shark led you at the
  // speed you were doing, and it cannot re-aim once its nose is out of the water
  const KB = S.shark;

function interceptTime(px, py, vx, vy, sx, sy, spd) {

  const a = vx * vx + vy * vy - spd * spd;

  if (S.wipeT > 0) S.wipeT -= dt;
  if (S.invT > 0) S.invT -= dt;
  if (S.hopCd > 0) S.hopCd -= dt;
  if (S.celebT > 0) S.celebT -= dt;
  if (S.emergCd > 0) S.emergCd -= dt;
  if (S.deepWarnCd > 0) S.deepWarnCd -= dt;
  if (S.bumpCd > 0) S.bumpCd -= dt;
  if (S.pw.mk3 > 0) { S.pw.mk3 -= dt; if (S.pw.mk3 <= 0) banner('MK3 RETURNED', CY, 1.4, 'BACK TO MK' + (S.pw.engine + 1)); }
  if (S.tdChainT > 0) { S.tdChainT -= dt; if (S.tdChainT <= 0) S.tdChain = 0; }
  if (S.ringStreakT > 0) { S.ringStreakT -= dt; if (S.ringStreakT <= 0) S.ringStreak = 0; }
  for (const k in S.hint) if (S.hint[k] > 0) S.hint[k] -= dt;
  if (S.shark.st !== 'eat') S.cycleT -= dt;

  // speed
  // SPEED CREEP was +150 on a base of 150 — the ski literally DOUBLED in speed over
  // a long run while the course stayed the same size, so flags and rings became
  // impossible to hit. It is now a gentle +45.
  const creep = Math.min(45, S.runT * 0.13);
  const engineMul = 1 + (S.pw.engine + (S.pw.mk3 > 0 ? 1 : 0)) * 0.08;   // MK3 is a timed loaner
  const target = (150 + creep) * engineMul * (S.boostT > 0 ? 1.45 : 1) * (S.wipeT > 0 ? 0.3 : 1) * (S.trickyT > 0 ? 1.1 : 1);
  S.spd += (target - S.spd) * Math.min(1, dt * 1.8);

  // steering → heading
  let steer = 0;
  if (IN.down) {
    steer = clamp((IN.x - IN.x0) / 42, -1, 1);
    IN.x0 = lerp(IN.x0, IN.x, Math.min(1, dt * 2.4));
  }
  if ((KEYS['ArrowLeft'] && !S.air) || KEYS['KeyA']) steer = -1;
  if ((KEYS['ArrowRight'] && !S.air) || KEYS['KeyD']) steer = 1;
  if (S.wipeT > 0) steer = 0;
  // DROWSY — her gas, or a bad box. The ski wanders on its own and your input goes
  // mushy: you can still fight it, you just cannot hold a line.
  if (S.drowsy > 0) {
    S.drowsy -= dt;
    // fast components that average out — the low-frequency term in the first pass
    // held near-full lock for seconds and spun the ski a full 180
    const w = Math.sin(T * 2.6) * 0.42 + Math.sin(T * 1.73 + 1.1) * 0.2;
    steer = clamp(steer * 0.62 + w, -1, 1);
    if (S.drowsy <= 0) { S.drowsy = 0; banner('HEAD CLEAR', CY, 1.3, 'BACK IN CONTROL'); }
  }
  S.steer = steer;
  // hold a committed carve and the ski bites harder into it
  if (!S.air && Math.abs(steer) > 0.6) S.carveHold = Math.min(1, S.carveHold + dt * 2.2);
  else S.carveHold = Math.max(0, S.carveHold - dt * 3.5);
  // and the speed penalty on turning was making the circle balloon from 12 units to
  // 46 across a run — softened so going fast stays steerable
  const turnRate = (2.55 - Math.min(0.26, S.spd / 1000) + S.carveHold * 0.55) * (S.boostT > 0 ? 0.88 : 1);
  S.h += steer * turnRate * (S.air ? 0.35 : 1) * dt;
  S.bank = lerp(S.bank, steer, Math.min(1, dt * 8));

  // movement — more grip, so the ski goes where it points
  const fwdX = Math.sin(S.h), fwdY = -Math.cos(S.h);
  S.velx = lerp(S.velx, fwdX * S.spd, Math.min(1, dt * 4.4));
  S.vely = lerp(S.vely, fwdY * S.spd, Math.min(1, dt * 4.4));
  S.wx += S.velx * dt; S.wy += S.vely * dt;
  S.dist += S.spd * dt;
  S.score += S.spd * dt * 0.05;

  // tile scroll (apparent motion in screen space)
  cosH = Math.cos(S.h); sinH = Math.sin(S.h);
  S.tileOX -= (S.velx * cosH + S.vely * sinH) * dt;
  S.tileOY -= (-S.velx * sinH + S.vely * cosH) * dt;

  // chop skips — the hull slaps across the water at speed
  const rightX = Math.cos(S.h), rightY = Math.sin(S.h);
  if (!S.air && S.wipeT <= 0) {
    S.chopT -= dt * (0.55 + S.spd / 250);
    if (S.chopT <= 0) {
      S.chopT = rnd(0.55, 1.0);
      S.chop = rnd(3, 5.5) * Math.min(1, S.spd / 200);
      if (S.spd > 130) spray(S.wx + fwdX * 9, S.wy + fwdY * 9, 3, FW, 45, true);
    }
  }
  if (S.chop > 0) S.chop = Math.max(0, S.chop - dt * 26);
  // carving digs in: speed bleeds, a sheet of spray fans out
  if (!S.air && Math.abs(steer) > 0.5 && S.wipeT <= 0 && Math.random() < dt * 30) {
    part(S.wx - rightX * Math.sign(steer) * 7, S.wy - rightY * Math.sign(steer) * 7,
         -rightX * Math.sign(steer) * rnd(30, 70), -rightY * Math.sign(steer) * rnd(30, 70),
         0, rnd(20, 50), 180, rnd(0.25, 0.5), Math.random() < 0.6 ? FW : CY, 1);
  }
  if (!S.air && Math.abs(steer) > 0.75 && S.wipeT <= 0) {
    S.spd *= 1 - (0.13 + S.carveHold * 0.09) * dt; // tighter turns cost speed — that's the trade
    if (Math.random() < dt * 55) {
      part(S.wx - rightX * Math.sign(steer) * 9, S.wy - rightY * Math.sign(steer) * 9,
           -rightX * Math.sign(steer) * rnd(60, 120), -rightY * Math.sign(steer) * rnd(60, 120),
           0, rnd(30, 75), 210, rnd(0.3, 0.6), Math.random() < 0.55 ? FW : CY, Math.random() < 0.4 ? 2 : 1);
    }
    S.carveHiss -= dt;
    if (S.carveHiss <= 0) { S.carveHiss = 0.18; noise(0.14, 0.05, 1600, 700); }
  }
  // wake
  if (!S.air && S.wipeT <= 0) {
    S.wake.push({ wx: S.wx, wy: S.wy, rx: rightX, ry: rightY, a: 1 });
    if (S.wake.length > 46) S.wake.shift();
  } else if (S.wake.length && Math.random() < dt * 8) S.wake.shift();
  for (const w of S.wake) w.a -= dt * 0.55;

  // air physics
  if (S.air) {
    S.airT += dt;
    S.vh -= 330 * dt;
    S.hgt += S.vh * dt;
    S.airPeak = Math.max(S.airPeak, S.hgt);
    // hangtime: a beat of slow-mo at the apex of a big rotating trick
    if (!S.hangDone && S.vh < 0 && S.hgt > 95 && (S.trick || S.airTricks > 0)) {
      S.hangDone = true; S.slow = Math.max(S.slow, 0.26);
      tone(1320, 0.12, 'square', 0.06);
    }
    // droplets streaming off the hull just after launch
    if (S.airT < 0.35 && Math.random() < dt * 55)
      part(S.wx + rnd(-6, 6), S.wy + rnd(-6, 6), rnd(-14, 14), rnd(-14, 14), S.hgt * rnd(0.4, 0.9), -30, 150, rnd(0.25, 0.5), FW, 1);
    // afterimage trail while spinning or flipping
    if ((S.trick || Math.abs(S.spin) > 0.1 || Math.abs(S.pitch) > 0.1) && S.ghosts.length < 7) {
      const lastG = S.ghosts[S.ghosts.length - 1];
      if (!lastG || T - lastG.tt > 0.055)
        S.ghosts.push({ wx: S.wx, wy: S.wy, hgt: S.hgt, spin: S.spin, pitch: S.pitch,
                        roll: S.roll, pose: S.trick && TRICKS[S.trick.type] && TRICKS[S.trick.type].pose,
                        life: 0.3, tt: T });
    }
    if (S.hgt <= 0) land();
  } else S.airPeak = 0;
  for (let i = S.ghosts.length - 1; i >= 0; i--) { S.ghosts[i].life -= dt; if (S.ghosts[i].life <= 0) S.ghosts.splice(i, 1); }
  for (let i = S.rings3.length - 1; i >= 0; i--) {
    const rg = S.rings3[i];
    rg.t += dt;
    rg.r = lerp(rg.r, rg.r1, Math.min(1, dt * 5));
    if (rg.t >= rg.life) S.rings3.splice(i, 1);
  }
  for (let i = S.plumes.length - 1; i >= 0; i--) {
    S.plumes[i].t += dt;
    if (S.plumes[i].t >= S.plumes[i].life) S.plumes.splice(i, 1);
  }
  if (S.trickFlash > 0) S.trickFlash -= dt;
  updateTricks(dt);

  if (S.boostT > 0 && Math.random() < dt * 40)
    part(S.wx - fwdX * 12 + rnd(-3, 3), S.wy - fwdY * 12 + rnd(-3, 3), -fwdX * rnd(40, 80), -fwdY * rnd(40, 80), 2, 10, 40, rnd(0.15, 0.35), Math.random() < 0.5 ? OR : MG, 2);
  if (S.trickyT > 0 && Math.random() < dt * 34)
    part(S.wx - fwdX * 10 + rnd(-6, 6), S.wy - fwdY * 10 + rnd(-6, 6), 0, 0, 2, 20, 30, 0.5, pick([CY, MG, YL, AG]), 2);

  // ---- entities: interact ----
  for (const e of S.ents) {
    const dx = e.wx - S.wx, dy = e.wy - S.wy;
    const d2 = dx * dx + dy * dy;
    e._d2 = d2;
    if (e.k === 'ring' && e.taken) { e.rT -= dt; if (e.rT <= 0 && d2 > 90000) e.taken = false; continue; }
    if (e.k === 'pod') {
      if (d2 < 300 * 300) { e.active = Math.min(1, e.active + dt); e.t += dt; }
      else e.active = Math.max(0, e.active - dt * 0.5);
      continue;
    }
    if (e.k === 'fish') {
      e.t += dt;
      if (e.gone > 0) { e.gone -= dt; continue; }
      if (e.scatter > 0) e.scatter -= dt;
      // a school mills about, and bolts when anything big comes through
      e.h += Math.sin(e.t * 0.7 + e.seed) * 0.9 * dt;
      if (avoidLand(e, dt, 1.6, 60)) e.h += Math.PI;
      const fspd = e.scatter > 0 ? 96 : 26;
      e.wx += Math.sin(e.h) * fspd * dt; e.wy += -Math.cos(e.h) * fspd * dt;
      if (d2 < 90 * 90 && e.scatter <= 0) {
        e.scatter = 1.8;
        e.h = Math.atan2(e.wx - S.wx, -(e.wy - S.wy));
        for (let i = 0; i < 5; i++) part(e.wx + rnd(-8, 8), e.wy + rnd(-8, 8), rnd(-30, 30), rnd(-30, 30), 0, 14, 90, 0.35, '#9fd8f0', 1);
      }
      continue;
    }
    if (e.k === 'sail') {
      if (e.cd > 0) e.cd -= dt;
      if (avoidLand(e, dt, 0.9, 70)) e.h += Math.PI;      // they never had this and drifted onto beaches
      e.wx += Math.sin(e.h) * 9 * dt; e.wy += -Math.cos(e.h) * 9 * dt;
      if (Math.hypot(e.wx, e.wy) > 2250) e.h += Math.PI;
      // THE GRIND. Time a jump onto her deck and you ride the gunwale the length of
      // the boat. Come in on the water instead and you wear the hull.
      const relXg = S.wx - e.wx, relYg = S.wy - e.wy;
      const gf = Math.sin(e.h), gfy = -Math.cos(e.h);
      const alongG = relXg * gf + relYg * gfy;
      const acrossG = relXg * Math.cos(e.h) + relYg * Math.sin(e.h);
      const onDeck = alongG > -46 && alongG < 46 && Math.abs(acrossG) < 13;
      if (S.grind && S.grind.e === e) {
        // riding it: locked to the centreline, carried along at your own speed
        S.grind.t += dt;
        S.grind.score += dt * 700;
        S.wx = e.wx + gf * S.grind.along + Math.cos(e.h) * 0;
        S.wy = e.wy + gfy * S.grind.along;
        S.grind.along += (S.spd * 0.75) * dt * (S.grind.dir);
        S.hgt = 13; S.air = true; S.vh = 0;
        // DO NOT touch S.h here. The camera is rotated by the player's heading, so
        // lerping it onto the boat's axis swung the entire world around the rider
        // mid-grind — which is what made it feel wrong. You entered lined up (the
        // `lined` gate guarantees it), so hold your own heading and just ride.
        if (Math.random() < dt * 50)
          part(S.wx + rnd(-4, 4), S.wy + rnd(-4, 4), rnd(-30, 30), rnd(-30, 30), 14, rnd(10, 40), 150, 0.3, '#ffd84a', 1);
        if (Math.abs(S.grind.along) > 46 || S.grind.t > 3) {
          const won = Math.round(S.grind.score);
          S.score += won;
          pop('RAIL GRIND +' + won, S.wx, S.wy, YL, 2);
          banner('RAIL GRIND!', YL, 1.2, '+' + won);
          SFX.hurdle();
          S.vh = 120; S.hgt = 13; S.air = true; S.airT = 0; S.trickyT = 1.2;
          S.grind = null; e.cd = 1.2;
        }
      } else if (!S.grind && onDeck && S.hgt >= 9 && S.wipeT <= 0 && e.cd <= 0) {
        // Which way you ride it comes from the direction you are POINTING, projected
        // onto her axis. S.velx/vely are a smoothed follower that lags the heading by
        // most of a second — sampled at the instant of touchdown they still report the
        // way you came from, which is what spun riders up the deck backwards.
        const fwdAlong = Math.sin(S.h) * gf + -Math.cos(S.h) * gfy;
        // and you have to be lined up with her: flying across the beam is not a grind
        const off = Math.abs(wrapPi(S.h - e.h));
        const lined = off < 1.05 || off > Math.PI - 1.05;
        if (lined && S.spd > 40) {
          S.grind = { e, t: 0, along: alongG, score: 250, dir: fwdAlong >= 0 ? 1 : -1 };
          pop('GRIND!', S.wx, S.wy, YL, 1);
          SFX.hop(); S.shake = Math.max(S.shake, 2);
        }
      } else if (d2 < 34 * 34 && Math.abs(acrossG) < 13 && S.hgt < 9 &&
                 S.wipeT <= 0 && S.invT <= 0 && e.cd <= 0) {
        e.cd = 3; wipeout('HULL SMASH!');
      }
      continue;
    }
    if (e.k === 'plane') {
      // RAIL THE NOSE. Same three-branch shape as the sailboat grind — ride / start /
      // smash — but on the plane's own axis (e.ang), and the band is the forward
      // fuselage only: the nose is the rail, the tail is just wreckage.
      const relXp = S.wx - e.wx, relYp = S.wy - e.wy;
      const pf = Math.sin(e.ang), pfy = -Math.cos(e.ang);
      const alongP = relXp * pf + relYp * pfy;
      const acrossP = relXp * Math.cos(e.ang) + relYp * Math.sin(e.ang);
      const onNose = alongP > 2 && alongP < 52 && Math.abs(acrossP) < 11;
      if (S.grind && S.grind.e === e) {
        S.grind.t += dt;
        S.grind.score += dt * 850;                 // pays better than a gunwale: it is narrower
        S.wx = e.wx + pf * S.grind.along;
        S.wy = e.wy + pfy * S.grind.along;
        S.grind.along += (S.spd * 0.75) * dt * S.grind.dir;
        S.hgt = 15; S.air = true; S.vh = 0;
        // never touch S.h — the camera is heading-rotated, so steering the rider onto
        // the rail's axis swings the whole world around him
        if (Math.random() < dt * 60)
          part(S.wx + rnd(-4, 4), S.wy + rnd(-4, 4), rnd(-34, 34), rnd(-34, 34), 16, rnd(10, 44), 150, 0.3, '#ffd84a', 1);
        if (S.grind.along < 0 || S.grind.along > 52 || S.grind.t > 3) {
          const won = Math.round(S.grind.score);
          S.score += won;
          pop('NOSE RAIL +' + won, S.wx, S.wy, YL, 2);
          banner('NOSE RAIL!', YL, 1.2, '+' + won);
          SFX.hurdle();
          S.vh = 130; S.hgt = 15; S.air = true; S.airT = 0; S.trickyT = 1.2;
          S.grind = null; e.cd = 1.2;
        }
      } else if (!S.grind && onNose && S.hgt >= 9 && S.wipeT <= 0 && e.cd <= 0) {
        const fwdAlongP = Math.sin(S.h) * pf + -Math.cos(S.h) * pfy;
        const offP = Math.abs(wrapPi(S.h - e.ang));
        if ((offP < 1.0 || offP > Math.PI - 1.0) && S.spd > 40) {
          S.grind = { e, t: 0, along: alongP, score: 300, dir: fwdAlongP >= 0 ? 1 : -1 };
          pop('RAIL!', S.wx, S.wy, YL, 1);
          SFX.hop(); S.shake = Math.max(S.shake, 2);
        }
      } else if (d2 < 46 * 46 && Math.abs(acrossP) < 11 && alongP > -54 && alongP < 52 &&
                 S.hgt < 9 && S.wipeT <= 0 && S.invT <= 0 && e.cd <= 0) {
        e.cd = 3; wipeout('FUSELAGE!');            // hit the hull on the water and you wear it
      }
      continue;
    }
    if (e.k === 'skiboat') {
      if (e.cd > 0) e.cd -= dt;
      if (e.hop > 0) e.hop -= dt;
      const sfx2 = Math.sin(e.h), sfy2 = -Math.cos(e.h);
      // the boat obeys the same land everything else does
      if (e.down <= 0) {
        if (avoidLand(e, dt, 1.9, 90)) { e.h += Math.PI; }
        e.wx += sfx2 * 108 * dt; e.wy += sfy2 * 108 * dt;
        if (Math.hypot(e.wx, e.wy) > 2250) e.h += Math.PI + rnd(-0.3, 0.3);
      } else {
        e.down -= dt;
        // he is in the water shouting; the boat turns back for him
        if (e.cut) {
          e.helpT = (e.helpT || 0) - dt;
          if (e.helpT <= 0) {
            e.helpT = rnd(1.4, 2.6);
            if (Math.hypot(e.skx - S.wx, e.sky - S.wy) < 620) {
              pop(pick(['HELP!', 'HEY!', 'COME BACK!']), e.skx, e.sky, OR, 1);
              SFX.shout(0.12, true);
            }
          }
          // the boat circles back to pick him up
          const back = Math.atan2(e.skx - e.wx, -(e.sky - e.wy));
          if (!landAhead(e.wx + Math.sin(back) * 90, e.wy - Math.cos(back) * 90, 40))
            e.h += clamp(wrapPi(back - e.h), -1.5 * dt, 1.5 * dt);
          e.wx += Math.sin(e.h) * 70 * dt; e.wy += -Math.cos(e.h) * 70 * dt;
          if (Math.random() < dt * 3) part(e.skx + rnd(-5, 5), e.sky + rnd(-5, 5), rnd(-14, 14), rnd(-14, 14), 0, 12, 90, 0.4, FW, 1);
        }
        if (e.down <= 0) {
          e.swing = rnd(TAU); e.air = 0; e.cut = false;
          e.skx = e.wx - Math.sin(e.h) * e.rope; e.sky = e.wy + Math.cos(e.h) * e.rope;
          if (Math.hypot(e.wx - S.wx, e.wy - S.wy) < 560) pop('BACK UP!', e.skx, e.sky, CY, 1);
        }
      }
      // the skier rides an arc across the wake, out to one side then the other
      e.swing += dt * 1.35;
      let across = Math.sin(e.swing) * 40;
      const rX2 = Math.cos(e.h), rY2 = Math.sin(e.h);
      // the boat clears the headland but the skier is 54 back and 40 out, so his arc
      // can still cross the sand. Pull him into line rather than let him ski on grass.
      let tx4 = e.wx - sfx2 * e.rope + rX2 * across;
      let ty4 = e.wy - sfy2 * e.rope + rY2 * across;
      for (let g5 = 0; g5 < 3 && landAhead(tx4, ty4, 14); g5++) {
        across *= 0.45;
        tx4 = e.wx - sfx2 * e.rope + rX2 * across;
        ty4 = e.wy - sfy2 * e.rope + rY2 * across;
      }
      if (landAhead(tx4, ty4, 14)) {                       // still fouled: shorten the rope in
        tx4 = e.wx - sfx2 * 46; ty4 = e.wy - sfy2 * 46;
      }
      e.skx = lerp(e.skx, tx4, Math.min(1, dt * 7));
      e.sky = lerp(e.sky, ty4, Math.min(1, dt * 7));
      e.lean = clamp(Math.sin(e.swing) * 1.25, -1, 1);   // matches `across`, which is sin too
      // crossing the boat's own wake pops him into the air
      if (e.down <= 0 && e.hop <= 0 && Math.abs(across) < 6 && Math.abs(Math.cos(e.swing)) > 0.7) {
        e.hop = 0.72; e.air = 0.001;
        if (Math.hypot(e.wx - S.wx, e.wy - S.wy) < 620) SFX.hop();
      }
      e.air = e.hop > 0 ? Math.sin((1 - e.hop / 0.72) * Math.PI) * 13 : 0;
      if (e.down <= 0 && Math.random() < dt * 24)
        part(e.skx + rnd(-4, 4), e.sky + rnd(-4, 4), rnd(-26, 26), rnd(-26, 26), e.air, 22, 110, 0.32, FW, 1);
      // he is having a better day than you are
      e.whoop -= dt;
      if (e.whoop <= 0 && e.down <= 0) {
        e.whoop = rnd(5, 11);
        if (Math.hypot(e.skx - S.wx, e.sky - S.wy) < 460) { pop(pick(['WOOO!', 'YEAH!', 'HAHA!']), e.skx, e.sky, CY, 1); SFX.shout(0.1, false); }
      }
      e.segT -= dt;
      if (e.segT <= 0 && d2 < 800 * 800) {
        e.segT = 0.12;
        e.segs.push({ wx: e.wx - sfx2 * 42, wy: e.wy - sfy2 * 42, t: 0, rx: rX2, ry: rY2 });
        if (e.segs.length > 20) e.segs.shift();
      }
      for (const sg of e.segs) sg.t += dt;
      // its transom is a ramp like the speedboat's, and its hull is just as solid
      if (e.rampCd > 0) e.rampCd -= dt;
      if (d2 < 105 * 105) {
        const relX3 = S.wx - e.wx, relY3 = S.wy - e.wy;
        const along3 = relX3 * sfx2 + relY3 * sfy2;
        const across3 = relX3 * rX2 + relY3 * rY2;
        if (along3 < -8 && along3 > -44 && Math.abs(across3) < 16 && !S.air && S.wipeT <= 0 && (e.rampCd || 0) <= 0) {
          if (Math.abs(wrapPi(S.h - e.h)) < 1.35) {
            e.rampCd = 1.2; launch(true, 'TOW BOAT LAUNCH!'); S.score += 300;
          }
        } else if (along3 >= -8 && along3 < 40 && Math.abs(across3) < 14 && S.hgt < 12 &&
                   S.wipeT <= 0 && S.invT <= 0 && e.cd <= 0 && (e.rampCd || 0) <= 0) {
          e.cd = 3; wipeout('HULL SMASH!');
        }
      }
      // THE ROPE vs THE PERSON — two different outcomes.
      // Cut the line and HE pays for it: he drops in the water and shouts for help
      // (and the shark can hear him). Hit the man himself and you go down with him.
      if (e.down <= 0 && S.wipeT <= 0 && S.invT <= 0) {
        const dSkier = Math.hypot(S.wx - e.skx, S.wy - e.sky);
        if (dSkier < 15 && S.hgt < 11) {
          wipeout('YOU HIT THE SKIER!');
          e.down = 5.5; e.cut = true; e.hop = 0;
          pop('OW!', e.skx, e.sky, MG, 1); SFX.shout(0.13, true);
          addHeat(e.skx, e.sky);
        } else {
          const ax4 = e.wx, ay4 = e.wy;
          const vx4 = e.skx - ax4, vy4 = e.sky - ay4;
          const len4 = vx4 * vx4 + vy4 * vy4 || 1;
          const t4 = clamp(((S.wx - ax4) * vx4 + (S.wy - ay4) * vy4) / len4, 0, 1);
          const dRope = Math.hypot(S.wx - (ax4 + vx4 * t4), S.wy - (ay4 + vy4 * t4));
          if (dRope < 11) {
            if (S.hgt >= 11) {
              if (!e.jumped) { e.jumped = true; S.score += 300; pop('ROPE JUMP +300', S.wx, S.wy, CY, 1); SFX.hurdle(); }
            } else {
              // you go straight through it — the line parts and he is left behind
              e.down = 9; e.cut = true; e.hop = 0; e.helpT = 0;
              S.score += 150;
              banner('LINE CUT!', OR, 1.6, 'HE IS IN THE WATER');
              pop('HELP!', e.skx, e.sky, OR, 2);
              SFX.shout(0.14, true);
              for (let i = 0; i < 10; i++)
                part(e.skx + rnd(-6, 6), e.sky + rnd(-6, 6), rnd(-40, 40), rnd(-40, 40), 0, 30, 130, 0.5, FW, 1);
              addHeat(e.skx, e.sky);
            }
          } else if (dRope > 26) e.jumped = false;
        }
      }
      continue;
    }
    if (e.k === 'boat') {
      if (e.cd > 0) e.cd -= dt;
      if (e.rampCd > 0) e.rampCd -= dt;
      const bfx = Math.sin(e.h), bfy = -Math.cos(e.h);
      e.wx += bfx * 95 * dt; e.wy += bfy * 95 * dt;
      if (Math.hypot(e.wx, e.wy) > 2300) e.h += Math.PI + rnd(-0.4, 0.4);
      else for (const isl of S.isles) {
        const ddx = e.wx - isl.wx, ddy = e.wy - isl.wy;
        if (ddx * ddx + ddy * ddy < (isl.r + 90) * (isl.r + 90)) { e.h = Math.atan2(ddx, -ddy); break; }
      }
      // deep diesel rumble as a speedboat crosses near you
      if (d2 < 230 * 230) {
        if (!e.passed) { e.passed = true; SFX.passBy(clamp(0.11 * (1 - Math.sqrt(d2) / 230) + 0.03, 0.02, 0.14), 70, 1.9, false); }
      } else if (d2 > 380 * 380) e.passed = false;
      e.segT -= dt;
      if (e.segT <= 0 && d2 < 800 * 800) {
        e.segT = 0.12;
        e.segs.push({ wx: e.wx - bfx * 44, wy: e.wy - bfy * 44, t: 0, rx: Math.cos(e.h), ry: Math.sin(e.h) });
        if (e.segs.length > 24) e.segs.shift();
      }
      for (const sg of e.segs) sg.t += dt;
      // boat-frame zones: stern ramp launches you, hull wrecks you
      // zones follow the drawn hull: 58px sprite at 1.5x = 87 long, half = 43
      if (d2 < 110 * 110) {
        const relX = S.wx - e.wx, relY = S.wy - e.wy;
        const brx = Math.cos(e.h), bry = Math.sin(e.h);
        const along = relX * bfx + relY * bfy;   // + toward bow
        const across = relX * brx + relY * bry;
        if (along < -8 && along > -46 && Math.abs(across) < 17 && !S.air && S.wipeT <= 0 && e.rampCd <= 0) {
          const a2 = Math.abs(wrapPi(S.h - e.h));
          if (a2 < 1.35) { e.rampCd = 1.2; launch(true, 'BOAT LAUNCH!'); S.score += 250; }
        } else if (along >= -8 && along < 42 && Math.abs(across) < 14 && S.hgt < 12 &&
                   S.wipeT <= 0 && S.invT <= 0 && e.cd <= 0 && e.rampCd <= 0) {
          // rampCd also means "this rider is mid-flight off MY ramp". The hull is
          // now 87 units long, so you are still climbing through hgt 11 when you
          // cross it — without this you wipe on the boat that just launched you.
          e.cd = 3; wipeout('HULL SMASH!');
        }
      }
      if (!S.air && S.wipeT <= 0 && S.hopCd <= 0 && d2 < 300 * 300) {
        for (const sg of e.segs) {
          // the hoppable wake has to start well astern of the stern ramp. At 0.3s the
          // segment is only ~30 units back — inside the ramp approach — so the weak
          // wake hop fired first, blocked the ramp (it needs !S.air) and dumped the
          // rider onto the hull at half the height they needed.
          if (sg.t > 2.4 || sg.t < 0.8) continue;
          const ddx = sg.wx - S.wx, ddy = sg.wy - S.wy;
          if (ddx * ddx + ddy * ddy < 100) {
            S.hopCd = 1.4; S.air = true; S.hgt = 0.01; S.vh = 92; S.score += 100;
            pop('WAKE HOP +100', S.wx, S.wy, CY, 1);
            SFX.hop(); break;
          }
        }
      }
      continue;
    }
    if (e.k === 'swim') {
      if (e.cd > 0) e.cd -= dt;
      if (e.hx === undefined) { e.hx = e.wx; e.hy = e.wy; e.panic = 0; e.said = false; }
      const threat = d2 < 90 * 90 && S.spd > 60;
      e.panic = clamp((e.panic || 0) + (threat ? dt * 2.5 : -dt * 0.8), 0, 1);
      if (e.panic > 0.05) {
        // paddle away from where the ski is headed
        const px2 = S.wx + S.velx * 0.4, py2 = S.wy + S.vely * 0.4;
        const away = Math.atan2(e.wx - px2, -(e.wy - py2));
        e.wx += Math.sin(away) * 36 * e.panic * dt;
        e.wy += -Math.cos(away) * 36 * e.panic * dt;
        if (Math.hypot(e.wx - e.hx, e.wy - e.hy) > 130) { e.wx = lerp(e.wx, e.hx, dt); e.wy = lerp(e.wy, e.hy, dt); }
        if (threat && !e.said && Math.random() < dt * 2.2) { e.said = true; pop('HEY!', e.wx, e.wy, OR, 1); SFX.shout(0.13, true); addHeat(e.wx, e.wy); }
        if (Math.random() < dt * 9 * e.panic) part(e.wx + rnd(-3, 3), e.wy + rnd(-3, 3), rnd(-16, 16), rnd(-16, 16), 0, 16, 80, 0.35, '#9fc8d8', 1);
      } else { e.said = false; e.wx = lerp(e.wx, e.hx, dt * 0.4); e.wy = lerp(e.wy, e.hy, dt * 0.4); }
      if (d2 < 9 * 9 && S.hgt < 8 && e.cd <= 0 && S.wipeT <= 0) { e.cd = 4; S.spd *= 0.55; S.shake = 2; banner('WHOA! SWIMMER!', OR, 1.1); SFX.bump(); }
      continue;
    }
    if (d2 > NEAR2) continue;
    const d = Math.sqrt(d2);
    if (e.k === 'ring') {
      const rr2 = e.air ? 15 : 13;
      const hOk = e.air ? (S.hgt > 8) : (S.hgt < 26);
      if (d < rr2 && hOk && S.wipeT <= 0) collectRing(e);
    } else if (e.k === 'ramp') {
      if (d < (e.mega ? 17 : 11) && !S.air && S.wipeT <= 0) {
        const velB = Math.atan2(S.velx, -S.vely);
        const a = Math.abs(wrapPi(velB - e.face));
        if (a < 1.25 || a > Math.PI - 1.25) launch(e.mega);
        else if (S.bumpCd <= 0) { S.bumpCd = 1; S.spd *= 0.7; S.shake = 2; SFX.bump(); pop('BUMP!', e.wx, e.wy, OR, 1); }
      }
    } else if (e.k === 'buoy') {
      if (d < 9 && S.hgt < 15 && S.wipeT <= 0 && S.invT <= 0) wipeout('WIPEOUT!');
      else if (d < 19 && d >= 10 && !e.nm && S.hgt < 15 && S.spd > 140 && S.wipeT <= 0) { e.nm = true; S.score += 150; pop('CLOSE! +150', e.wx, e.wy, AG, 1); SFX.close(); }
      else if (d > 44) e.nm = false;
    } else if (e.k === 'log') {
      if (d < 12 && S.hgt < 7 && S.wipeT <= 0 && S.invT <= 0) wipeout('LOG! OOF!');
      else if (d < 22 && d >= 13 && !e.nm && S.hgt < 10 && S.spd > 140 && S.wipeT <= 0) { e.nm = true; S.score += 150; pop('CLOSE! +150', e.wx, e.wy, AG, 1); SFX.close(); }
      else if (d > 46) e.nm = false;
    } else if (e.k === 'wreck') {
      if (d < 62) {
        // work in the wreck's own frame: -y is the bow ramp, +y the steel stern
        const fx2 = Math.sin(e.ang), fy2 = -Math.cos(e.ang);
        const rx2 = Math.cos(e.ang), ry2 = Math.sin(e.ang);
        const along = (S.wx - e.wx) * fx2 + (S.wy - e.wy) * fy2;
        const across = (S.wx - e.wx) * rx2 + (S.wy - e.wy) * ry2;
        // e.ang is the direction you ride the ramp: deck first, then the steel
        if (Math.abs(across) < 19) {
          if (along > -44 && along < 8 && !S.air && S.wipeT <= 0) {
            const velB = Math.atan2(S.velx, -S.vely);
            if (Math.abs(wrapPi(velB - e.ang)) < 1.15) {
              launch(true, 'SHIPWRECK AIR!');
              S.vh *= 1.25; S.score += 400;      // the biggest ramp in the bay
            }
          } else if (along >= 8 && along < 50 && S.hgt < 26 && S.wipeT <= 0 && S.invT <= 0) {
            wipeout('WRECKED!');                 // clear the hull or wear it
          }
        }
      }
    } else if (e.k === 'crate') {
      if (e.mine) { updateMine(e, dt); }
      else if (!e.taken && d < 18 && S.wipeT <= 0) { if (e.fake) openFake(e); else openCrate(e); }
    } else if (e.k === 'kelp') {
      if (d < 15 && S.hgt < 5) { S.spd *= 1 - 0.4 * dt; if (Math.random() < dt * 6) part(S.wx, S.wy, rnd(-20, 20), rnd(-20, 20), 0, 20, 100, 0.4, '#1d6b48', 1); }
    } else if (e.k === 'island') {
      if (d < e.r * 0.86 + 8 && S.hgt < 30) {
        // run aground: push out + tumble
        const nx = dx / (d || 1), ny = dy / (d || 1);
        S.wx = e.wx - nx * (e.r * 0.86 + 12); S.wy = e.wy - ny * (e.r * 0.86 + 12);
        S.velx *= 0.2; S.vely *= 0.2;
        if (S.invT <= 0) wipeout('RAN AGROUND!');
      }
    } else if (e.k === 'cp') {
      if (e.idx === S.cpIdx && d < 46) {
        S.cpIdx++;
        S.score += 500;
        pop('FLAG ' + S.cpIdx + '/8  +500', e.wx, e.wy, YL, 2);
        SFX.cp();
        shockwave(e.wx, e.wy, 8, 46, 0.5, YL);
        if (S.cpIdx === 1 && S.laps === 0) banner('FLAG 1 OF 8!', YL, 1.8, 'SEVEN MORE FOR A LAP');
        if (S.cpIdx >= 8) {
          S.cpIdx = 0;
          S.score += 10000 + S.laps * 2500;
          if (S.laps + 1 >= MAX_LEVEL) {
            // ran the whole ladder — the ocean gives up trying to be subtle
            S.laps++;
            banner('ALL 21 CLEARED', YL, 3.2, 'THE ABYSS KEEPS YOU NOW');
            SFX.lap(); setTimeout(() => SFX.levelUp(), 400);
          } else {
            S.laps++;
            advanceLevel();
          }
        }
      }
    }
  }

  // checkpoint onboarding: tell them what the flags are, then keep nudging
  // until they actually take the first one.
  if (S.hint.cp > 0 && S.hint.cp - dt <= 0)
    banner('RIDE THROUGH THE FLAGS', YL, 2.4, 'FOLLOW THE BLUE ARROW - 8 FLAGS = A LAP');
  if (S.laps === 0 && S.cpIdx === 0) {
    S.cpNag -= dt;
    if (S.cpNag <= 0) {
      S.cpNag = 26;
      if (S.runT > 12) banner('FIND THE CHECKERED FLAG', YL, 2.0, 'FOLLOW THE ARROW');
    }
  }

  // rival jet skiers out having fun
  for (const n of S.npcs) updateNpc(n, dt);
  updateLoot(dt);
  updateCops(dt);
  updateWires(dt);
  updateRaider(dt);
  updatePink(dt);
  updateHearts(dt);
  updateBombs(dt);
  for (const b of S.barras) {
    const bdx = b.wx - S.wx, bdy = b.wy - S.wy;
    if (bdx * bdx + bdy * bdy < 900 * 900 || b.st !== 'patrol') updateBarra(b, dt);
  }
  // alligators basking on the beaches, hunting the shallows
  for (const g of S.gators) updateGator(g, dt);
  // the beach crowd — only the ones near you need thinking about
  for (const p of S.beach) {
    const dxp = p.wx - S.wx, dyp = p.wy - S.wy;
    if (dxp * dxp + dyp * dyp < 900 * 900 || p.hide > 0 || p.scare > 0) updateBeach(p, dt);
  }
  // a ski roaring past the shallows sends the waders scrambling
  if (!S.air && S.spd > 120 && S.wipeT <= 0) scareBeach(S.wx, S.wy, 70, false);

  // storm weather on the stormy level
  if (curLevel().fx === 'rain') {
    S.boltT -= dt;
    if (S.boltT <= 0) {
      S.boltT = rnd(6, 14);
      S.flash = Math.max(S.flash, 0.3); S.flashCol = '#cfe4ff';
      SFX.thunder();
    }
  }

  // dolphins that leap clean over you
  S.leapCd -= dt;
  if (S.leapCd <= 0 && !S.leap) {
    S.leapCd = rnd(22, 40);
    let nearIsle = false;
    for (const isl of S.isles) if (Math.hypot(S.wx - isl.wx, S.wy - isl.wy) < isl.r + 150) { nearIsle = true; break; }
    if (!nearIsle && S.spd > 90 && S.shark.st === 'deep') {
      const rX = Math.cos(S.h), rY = Math.sin(S.h);
      const fX = Math.sin(S.h), fY = -Math.cos(S.h);
      const side = Math.random() < 0.5 ? 1 : -1;
      S.leap = { t: 0, dur: 1.15, showered: false,
        ax: S.wx - rX * 95 * side, ay: S.wy - rY * 95 * side,
        bx: S.wx + rX * 95 * side + fX * 40, by: S.wy + rY * 95 * side + fY * 40 };
      splashCrown(S.leap.ax, S.leap.ay, 10, 80);
      SFX.dolphin();
    }
  }
  if (S.leap) {
    S.leap.t += dt;
    const tt = S.leap.t / S.leap.dur;
    if (tt >= 0.45 && !S.leap.showered) {
      S.leap.showered = true;
      for (let i = 0; i < 14; i++) part(S.wx + rnd(-10, 10), S.wy + rnd(-10, 10), rnd(-25, 25), rnd(-25, 25), rnd(26, 42), 0, 200, rnd(0.4, 0.7), Math.random() < 0.6 ? FW : CY, 1);
      pop('SPLASH!', S.wx, S.wy, CY, 1);
    }
    if (tt >= 1) { splashCrown(S.leap.bx, S.leap.by, 10, 80); S.leap = null; SFX.dolphin(); }
  }

  // bird flocks crossing overhead
  S.flockCd -= dt;
  if (S.flockCd <= 0 && !S.flock) {
    S.flockCd = rnd(14, 26);
    // The gulls head for the next flag. A random bearing was just decoration; pointing
    // them at the checkpoint turns every flyover into a free readable nav cue — look up,
    // follow the birds. Falls back to random if the course somehow has no active flag.
    const cpN = (S.ents || []).find(e => e.k === 'cp' && e.idx === S.cpIdx);
    const a = cpN ? Math.atan2(cpN.wx - S.wx, -(cpN.wy - S.wy)) : rnd(TAU);
    const dirX = Math.sin(a), dirY = -Math.cos(a);
    const cxw = S.wx + fwdX * rnd(-30, 120) + rightX * rnd(-60, 60);
    const cyw = S.wy + fwdY * rnd(-30, 120) + rightY * rnd(-60, 60);
    S.flock = { t: 0, dur: 7, ax: cxw - dirX * 430, ay: cyw - dirY * 430, bx: cxw + dirX * 430, by: cyw + dirY * 430 };
  }
  if (S.flock) {
    S.flock.t += dt;
    // they cry more as they sweep over your head
    const fl = S.flock, ft = fl.t / fl.dur;
    const fx2 = lerp(fl.ax, fl.bx, ft) - S.wx, fy2 = lerp(fl.ay, fl.by, ft) - S.wy;
    const near = fx2 * fx2 + fy2 * fy2 < 160 * 160;
    if (Math.random() < dt * (near ? 2.6 : 0.5)) SFX.gull();
    if (S.flock.t >= S.flock.dur) S.flock = null;
  }

  // gulls (ambient, screen-space-ish world pts near player)
  S.gullCd -= dt;
  if (S.gullCd <= 0) {
    S.gullCd = rnd(9, 20);
    const a = rnd(TAU);
    S.gulls.push({ wx: S.wx + Math.sin(a) * 320, wy: S.wy - Math.cos(a) * 320, dir: rnd(TAU), t: 0 });
  }
  for (let i = S.gulls.length - 1; i >= 0; i--) {
    const g = S.gulls[i];
    g.t += dt;
    if (g.spook > 0) g.spook -= dt;
    const gsp = g.spook > 0 ? 26 + 95 * clamp(g.spook / 1.8, 0, 1) : 26;
    g.wx += Math.sin(g.dir) * gsp * dt; g.wy += -Math.cos(g.dir) * gsp * dt;
    if (g.t > 26) S.gulls.splice(i, 1);
  }

  // emergency ring drops while hunted (the ocean bargains)
  if ((S.shark.st === 'attack') && S.emergCd <= 0) {
    let near = 0;
    for (const e of S.ents) if (e.k === 'ring' && !e.taken && e._d2 < 350 * 350) near++;
    if (near < 4) {
      const baseX = S.wx + fwdX * 300 + rightX * rnd(-60, 60), baseY = S.wy + fwdY * 300 + rightY * rnd(-60, 60);
      for (let j = 0; j < 4; j++) S.ents.push({ k: 'ring', wx: baseX + fwdX * j * 40, wy: baseY + fwdY * j * 40, taken: false, rT: 0, temp: true });
      S.emergCd = 4;
    } else S.emergCd = 1;
  }

  // the open deep — beyond the bay the shark owns the water
  const rC = Math.hypot(S.wx, S.wy);
  if (rC > WORLD_R + 50 && S.deepWarnCd <= 0) {
    S.deepWarnCd = 12;
    banner('THE OPEN DEEP', '#7ab8d8', 2.0, 'NOTHING OUT HERE BUT TEETH');
    SFX.warn();
  }
  if (rC > DEEP_R && S.shark.st === 'deep') startAttack('SOMETHING RISES', 'GET BACK TO THE BAY!');

  // particles
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const p = S.parts[i];
    p.life -= dt; if (p.life <= 0) { S.parts.splice(i, 1); continue; }
    p.wx += p.vx * dt; p.wy += p.vy * dt;
    p.z += p.vz * dt; p.vz -= p.g * dt;
    if (p.z < 0) p.z = 0;
  }
  // popups
  for (let i = S.pops.length - 1; i >= 0; i--) {
    const p = S.pops[i]; p.life -= dt; p.rise += 26 * dt;
    if (p.life <= 0) S.pops.splice(i, 1);
  }
  if (S.banner) { S.banner.life -= dt; if (S.banner.life <= 0) S.banner = null; }

  sharkUpdate(dt);

  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 14);
  if (S.flash > 0) S.flash -= dt * 1.6;

  if (AU.ready) {
    AU.engGain.gain.setTargetAtTime(AU.on ? 0.05 : 0, AU.ctx.currentTime, 0.1);
    // each engine upgrade raises the note and opens the filter — it sounds meaner
    const f = (50 + S.spd * 0.34 + (S.air ? 70 : 0) + (S.boostT > 0 ? 40 : 0)) * (1 + (S.pw.engine + (S.pw.mk3 > 0 ? 1 : 0)) * 0.16);
    AU.engine.frequency.setTargetAtTime(f, AU.ctx.currentTime, 0.08);
    AU.engFilt.frequency.setTargetAtTime((S.wipeT > 0 ? 160 : (S.air ? 1200 : 480)) * (1 + S.pw.engine * 0.35), AU.ctx.currentTime, 0.1);
    AU.engGain.gain.setTargetAtTime(AU.on ? 0.05 + S.pw.engine * 0.012 : 0, AU.ctx.currentTime, 0.1);
  }
}
function updateNpc(n, dt) {
  if (n.td) { updateTakedown(n, dt); return; }
  n.ret -= dt;
  const dxT = n.tx - n.wx, dyT = n.ty - n.wy;
  if (n.ret <= 0 || dxT * dxT + dyT * dyT < 60 * 60) {
    n.ret = rnd(6, 12);
    if (Math.random() < 0.35 && S.ramps.length) {
      const rp = pick(S.ramps);
      n.tx = rp.wx - Math.sin(rp.face) * 160; n.ty = rp.wy + Math.cos(rp.face) * 160;
      n.after = rp;
    } else {
      const a = rnd(TAU), d = rnd(300, 2100);
      n.tx = Math.sin(a) * d; n.ty = -Math.cos(a) * d; n.after = null;
    }
  }
  let gx = n.tx, gy = n.ty;
  if (n.after && Math.hypot(n.wx - n.tx, n.wy - n.ty) < 90) { gx = n.after.wx; gy = n.after.wy; }
  let want = Math.atan2(gx - n.wx, -(gy - n.wy));
  for (const isl of S.isles) {
    const dx = n.wx - isl.wx, dy = n.wy - isl.wy;
    if (dx * dx + dy * dy < (isl.r + 90) * (isl.r + 90)) { want = Math.atan2(dx, -dy); break; }
  }
  const dxP = n.wx - S.wx, dyP = n.wy - S.wy;
  const dP2 = dxP * dxP + dyP * dyP;
  // They give the player room — which made takedowns almost impossible to land,
  // since they were always already sliding out of the way. On the turbo they see
  // you coming too late and only flinch, which is both fairer and funnier.
  if (dP2 < 70 * 70) {
    const away = Math.atan2(dxP, -dyP);
    if (S.boostT > 0 && dP2 < 52 * 52) {
      want = lerp(want, away, 0.22);                 // a panicked half-swerve
      if (!n.eek && Math.random() < 0.5) {
        n.eek = true;
        pop(pick(['LOOK OUT!', 'WHOA!', 'NO NO NO']), n.wx, n.wy, OR, 1);
      }
    } else { want = away; n.eek = false; }
  } else n.eek = false;
  // engine roaring past + a shout when a rival buzzes you
  if (dP2 < 150 * 150) {
    if (!n.passed) {
      n.passed = true;
      SFX.passBy(clamp(0.10 * (1 - Math.sqrt(dP2) / 150) + 0.03, 0.02, 0.13), 150, 1.1, true);
      if (dP2 < 95 * 95 && Math.random() < 0.65) {
        setTimeout(() => SFX.shout(0.11, Math.random() < 0.5), 180);
        pop(pick(['HEY!', 'YEAH!', 'WHOO!', 'NICE!']), n.wx, n.wy, pick([CY, YL, AG]), 1);
        addHeat(n.wx, n.wy);
      }
    }
  } else if (dP2 > 260 * 260) n.passed = false;
  let spdMult = 1;
  if (n.fleeT > 0) { // shark on its tail — flat out, away
    n.fleeT -= dt;
    want = Math.atan2(n.wx - n.fleeX, -(n.wy - n.fleeY));
    spdMult = 1.5;
    if (Math.random() < dt * 1.5 && dP2 < 500 * 500) pop('HELP!', n.wx, n.wy, OR, 1);
  }
  const dh = wrapPi(want - n.h);
  n.h += clamp(dh, (n.fleeT > 0 ? -2.6 : -1.7) * dt, (n.fleeT > 0 ? 2.6 : 1.7) * dt);
  const fx = Math.sin(n.h), fy = -Math.cos(n.h);
  n.wx += fx * n.spd * spdMult * dt; n.wy += fy * n.spd * spdMult * dt;
  if (n.air) {
    n.vh -= 330 * dt; n.hgt += n.vh * dt; n.spin += n.spinV * dt;
    if (n.hgt <= 0) {
      n.air = false; n.hgt = 0; n.spin = 0; n.spinV = 0;
      splashCrown(n.wx, n.wy, 10, 60);
      if (dP2 < 380 * 380 && Math.random() < 0.5) pop('WOO!', n.wx, n.wy, pick([CY, MG, YL, AG]), 1);
    }
  } else {
    for (const rp of S.ramps) {
      const ddx = rp.wx - n.wx, ddy = rp.wy - n.wy;
      const rr2 = rp.mega ? 17 : 11;
      if (ddx * ddx + ddy * ddy < rr2 * rr2) {
        const a2 = Math.abs(wrapPi(n.h - rp.face));
        if (a2 < 1.25 || a2 > Math.PI - 1.25) {
          n.air = true; n.vh = rnd(140, 205);
          n.spinV = Math.random() < 0.55 ? rnd(4, 9) * (Math.random() < 0.5 ? 1 : -1) : 0;
          spray(n.wx, n.wy, 8, FW, 60, true);
        }
        break;
      }
    }
    n.wakeT -= dt;
    if (n.wakeT <= 0 && dP2 < 700 * 700) {
      n.wakeT = 0.07;
      part(n.wx - fx * 9, n.wy - fy * 9, 0, 0, 0, 0, 0, 0.9, 'rgba(232,244,255,0.45)', 1);
    }
    if (dP2 < 15 * 15 && S.hgt < 10 && S.wipeT <= 0 && S.invT <= 0 && S.bumpCd <= 0 && !n.td) {
      if (S.boostT > 0) {
        // TAKEDOWN. Only on the turbo — at cruising speed you just bump fenders.
        takedown(n);
      } else {
        S.bumpCd = 1.2; S.spd *= 0.6; S.shake = 3;
        splashCrown((n.wx + S.wx) / 2, (n.wy + S.wy) / 2, 12, 80);
        banner('TRAFFIC!', OR, 1.0);
        SFX.bump();
      }
    }
  }
}
// Roll the world over to the next level: new zone look, tighter fuse, more teeth.
function advanceLevel() {
  const LV = curLevel();
  const prevZone = levelCfg(Math.max(0, S.laps - 1)).zone;
  const newZone = LV.zone !== prevZone;
  S.quota = Math.max(S.quota, LV.quota);   // never eases off
  // The fuse is a WALL CLOCK now: advancing a level does not touch it. It used to
  // refill to a full cycle here, and a lap of the 8 flags is only ~6,150 units — about
  // 41s of riding — so a player could lap forever, never collect a ring, and never
  // once meet the shark. "Every 2 minutes" has to mean every 2 minutes.
  if (S.cycleT > 30) S.shark.warned = false;
  seedGators(LV.gators);
  seedBarras(LV.barras);
  seedRingBloom(LV.bloom);
  S.raiderCd = Math.min(S.raiderCd, LV.raiderGap);
  AU.step = 0;                                   // start the theme at bar 1
  SFX.lap();
  banner('LAP ' + S.laps + ' COMPLETE', YL, 2.2, '+' + fmt(10000 + (S.laps - 1) * 2500));
  setTimeout(() => {
    if (S.state !== 'play') return;

    if (newZone) { S.flash = 0.3; S.flashCol = FW; S.shake = 3; }
  }, 2300);
}

function openCrate(e) {

function updateLoot(dt) {
  if (S.loot) { S.loot.t += dt; if (S.loot.t >= S.loot.dur) S.loot = null; }
  if (S.sac) { S.sac.t += dt; if (S.sac.t >= S.sac.dur) S.sac = null; }
  if (S.feast) { S.feast.t += dt; if (S.feast.t >= S.feast.dur) S.feast = null; }
  for (let i = S.debris.length - 1; i >= 0; i--) {
    const d2 = S.debris[i];
    d2.t += dt; d2.wy += 3 * dt;
    if (d2.t > 22) S.debris.splice(i, 1);
  }
  if (S.shark.stun > 0) S.shark.stun -= dt;
  if (S.pw.turbo > 0) {
    S.pw.turbo -= dt;
    S.boostCd = 0;                                    // boost is free while it lasts
    S.boostT = Math.max(S.boostT, 0.25);
    if (S.pw.turbo <= 0) { S.pw.turbo = 0; banner('OVERDRIVE OUT', OR, 1.2); }
  }
  // crates appear rarely, and only one at a time
  S.crateCd -= dt;
  // her fakes must not count here — an unopened fake sitting on the water was
  // suppressing every real crate spawn in the run
  if (S.crateCd <= 0 && !S.ents.some(e => e.k === 'crate' && !e.taken && !e.fake)) {
    S.crateCd = rnd(42, 74);
    spawnCrate();
  }
  // the dolphin friend
  const C = S.pw.comp;
  if (C) {
    if (C.dead > 0) { C.dead -= dt; if (C.dead <= 0) S.pw.comp = null; }
    else {
      C.t -= dt; C.ph += dt;
      // porpoising: it keeps pace off your shoulder, arcing out of the water
      const rX = Math.cos(S.h), rY = Math.sin(S.h), fX = Math.sin(S.h), fY = -Math.cos(S.h);
      const tx = S.wx + rX * 30 * C.side + fX * -4;
      const ty = S.wy + rY * 30 * C.side + fY * -4;
      C.wx = lerp(C.wx, tx, Math.min(1, dt * 5));
      C.wy = lerp(C.wy, ty, Math.min(1, dt * 5));
      // a 1.7s cycle: about half of it airborne, the rest cruising under
      const cyc = (C.ph % 1.7) / 1.7;
      C.arc = cyc < 0.55 ? Math.sin(cyc / 0.55 * Math.PI) * 26 : 0;
      const up = C.arc > 1;
      if (up && !C.wasUp) { splashCrown(C.wx, C.wy, 6, 45); SFX.barraSplash(); }
      if (!up && C.wasUp) { splashCrown(C.wx, C.wy, 8, 55); if (Math.random() < 0.35) SFX.dolphin(); }
      C.wasUp = up;
      if (up && Math.random() < dt * 14) part(C.wx + rnd(-5, 5), C.wy + rnd(-5, 5), rnd(-14, 14), rnd(-14, 14), C.arc * 0.7, -12, 130, 0.35, FW, 1);
      if (!up && Math.random() < dt * 10) part(C.wx, C.wy, rnd(-10, 10), rnd(-10, 10), 0, 10, 60, 0.3, FW, 1);
      // it drives off barracudas that get too close
      for (const b of S.barras) {
        if (b.st === 'follow' && Math.hypot(b.wx - C.wx, b.wy - C.wy) < 60) {
          b.st = 'patrol'; b.cd = 4; pop('SHOO!', C.wx, C.wy, AG, 1);
        }
      }
      if (C.t <= 0) { S.pw.comp = null; banner('YOUR FRIEND SWIMS OFF', AG, 1.6); }
    }
  }
}
// the dolphin throws itself at the shark to save you — once.
function companionSaves() {
